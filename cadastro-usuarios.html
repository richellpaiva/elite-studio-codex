<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Usuários</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <script>
        if (localStorage.getItem('isLoggedIn') !== 'true') {
            window.location.href = 'index.html';
        }
    </script>

    <div class="watermark"></div>

    <div class="container-center" style="justify-content: flex-start; padding-top: 80px;">
        <a href="home.html" style="position: absolute; top: 25px; left: 30px; color: #3b82f6; text-decoration: none; transition: 0.3s; border: 1px solid rgba(59,130,246,0.2); padding: 10px 18px; border-radius: 50px; background: rgba(255,255,255,0.7); backdrop-filter: blur(10px); display: flex; align-items: center; gap: 8px; font-weight: 500;">
            <i class="fas fa-arrow-left"></i> Voltar
        </a>

        <div style="background: rgba(255,255,255,0.75); backdrop-filter: blur(12px); padding: 40px; border-radius: 24px; max-width: 1100px; width: 100%; border: 1px solid rgba(59,130,246,0.2); box-shadow: 0 20px 60px rgba(31,38,135,0.15); position: relative; z-index: 1;">

            <h2 style="color: #1e3a8a; text-align: center; margin-bottom: 10px;">Cadastro de Usuários</h2>
            <p style="color: #64748b; text-align: center; margin-bottom: 30px;">Gerencie os usuários e vínculos com as empresas</p>

            <div style="display: flex; gap: 15px; flex-wrap: wrap; margin-bottom: 20px; align-items: center; justify-content: space-between;">
                <button onclick="abrirModal()" class="btn-primary" style="display: inline-flex; align-items: center; gap: 8px; padding: 10px 20px;">
                    <i class="fas fa-plus"></i> Adicionar Usuário
                </button>
                <input type="text" id="buscaUsuario" placeholder="Pesquisar por Nome ou Login..." oninput="filtrarTabela()" style="max-width: 350px; flex: 1; background: rgba(255,255,255,0.9); border: 1px solid rgba(59,130,246,0.2); border-radius: 50px; padding: 10px 20px; color: #1e3a8a; outline: none; font-size: 0.95rem;">
            </div>

            <div style="max-height: 500px; overflow-y: auto; border: 1px solid rgba(59,130,246,0.2); border-radius: 12px; background: rgba(255,255,255,0.6);">
                <table style="width: 100%; border-collapse: collapse; text-align: left;">
                    <thead style="position: sticky; top: 0; background: linear-gradient(135deg, #3b82f6, #2563eb); color: #ffffff; z-index: 10;">
                        <tr>
                            <th style="padding: 15px; font-weight: 600; width: 80px;">Foto</th>
                            <th style="padding: 15px; font-weight: 600;">Nome</th>
                            <th style="padding: 15px; font-weight: 600;">Login</th>
                            <th style="padding: 15px; font-weight: 600;">CPF</th>
                            <th style="padding: 15px; font-weight: 600;">Empresa</th>
                            <th style="padding: 15px; font-weight: 600; width: 120px; text-align: center;">Ações</th>
                        </tr>
                    </thead>
                    <tbody id="tabela-corpo"></tbody>
                </table>
            </div>

            <p style="color: #64748b; font-size: 0.8rem; margin-top: 10px; text-align: center;">* Dados sincronizados com o Supabase.</p>
        </div>
    </div>

    <!-- Modal de formulário -->
    <div class="modal-overlay" id="modal" style="display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(30, 58, 138, 0.4); backdrop-filter: blur(6px); align-items: center; justify-content: center; z-index: 999;">
        <div class="modal-box" style="background: #ffffff; border-radius: 24px; padding: 30px; max-width: 800px; width: 95%; max-height: 90vh; overflow-y: auto; border: 1px solid rgba(59,130,246,0.2); box-shadow: 0 20px 60px rgba(31,38,135,0.3);">
            <h3 id="modal-titulo" style="color: #1e3a8a; margin-bottom: 20px; font-size: 1.5rem;">Adicionar Usuário</h3>
            <form id="form-usuario" onsubmit="event.preventDefault(); salvarRegistro();">
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                    <!-- Foto -->
                    <div style="grid-column: 1 / -1;">
                        <label style="color: #64748b; font-size: 0.9rem; font-weight: 600; display: block; margin-bottom: 8px;">Foto do Usuário</label>
                        <div style="display: flex; align-items: center; gap: 15px; background: rgba(240,249,255,0.8); padding: 15px; border-radius: 12px; border: 1px dashed rgba(59,130,246,0.3);">
                            <input type="file" id="input-foto" accept="image/*" style="display: none;" onchange="previewFoto(event)">
                            <button type="button" onclick="document.getElementById('input-foto').click()" class="btn-outline" style="font-size: 0.9rem;"><i class="fas fa-upload"></i> Escolher Imagem</button>
                            <div style="position: relative;">
                                <img id="preview-foto" src="" alt="Preview" style="display: none; width: 80px; height: 80px; object-fit: cover; border-radius: 50%; border: 1px solid #ccc;">
                                <span id="btn-remove-foto" onclick="removerImagem()" style="display: none; position: absolute; top: -5px; right: -5px; background: #ef4444; color: #fff; width: 20px; height: 20px; border-radius: 50%; cursor: pointer; font-size: 12px; line-height: 20px; text-align: center;">×</span>
                            </div>
                        </div>
                    </div>

                    <!-- Nome -->
                    <div style="grid-column: 1 / -1;">
                        <label style="color: #64748b; font-size: 0.9rem; font-weight: 600; display: block; margin-bottom: 5px;">Nome Completo *</label>
                        <input type="text" id="nome" placeholder="Ex: João da Silva" style="width: 100%; background: #e0f2fe; border: 1px solid #bae6fd; color: #1e3a8a; padding: 12px; border-radius: 8px; outline: none;">
                    </div>

                    <!-- Empresa -->
                    <div style="grid-column: 1 / -1;">
                        <label style="color: #64748b; font-size: 0.9rem; font-weight: 600; display: block; margin-bottom: 5px;">Empresa (Vínculo) *</label>
                        <select id="empresa_id" style="width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #cbd5e1; outline: none; background: #fff; color: #1e3a8a;">
                            <option value="">Selecione uma empresa...</option>
                        </select>
                    </div>

                    <!-- CPF -->
                    <div>
                        <label style="color: #64748b; font-size: 0.9rem; font-weight: 600; display: block; margin-bottom: 5px;">CPF *</label>
                        <input type="text" id="cpf" placeholder="000.000.000-00" oninput="mascaraCPF(this)" style="width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #cbd5e1; outline: none;">
                    </div>

                    <!-- RG -->
                    <div>
                        <label style="color: #64748b; font-size: 0.9rem; font-weight: 600; display: block; margin-bottom: 5px;">RG</label>
                        <input type="text" id="rg" placeholder="00.000.000-0" style="width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #cbd5e1; outline: none;">
                    </div>

                    <!-- CEP -->
                    <div>
                        <label style="color: #64748b; font-size: 0.9rem; font-weight: 600; display: block; margin-bottom: 5px;">CEP</label>
                        <input type="text" id="cep" placeholder="00000-000" oninput="mascaraCEP(this)" style="width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #cbd5e1; outline: none;">
                    </div>

                    <!-- Telefone -->
                    <div>
                        <label style="color: #64748b; font-size: 0.9rem; font-weight: 600; display: block; margin-bottom: 5px;">Telefone</label>
                        <input type="text" id="telefone" placeholder="(86) 3222-0000" oninput="mascaraTelefone(this)" style="width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #cbd5e1; outline: none;">
                    </div>

                    <!-- Endereço -->
                    <div style="grid-column: 1 / -1;">
                        <label style="color: #64748b; font-size: 0.9rem; font-weight: 600; display: block; margin-bottom: 5px;">Endereço (Rua/Avenida)</label>
                        <input type="text" id="endereco" placeholder="Ex: Rua das Flores" style="width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #cbd5e1; outline: none;">
                    </div>

                    <!-- Número -->
                    <div>
                        <label style="color: #64748b; font-size: 0.9rem; font-weight: 600; display: block; margin-bottom: 5px;">Número</label>
                        <input type="text" id="numero" placeholder="Ex: 123" style="width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #cbd5e1; outline: none;">
                    </div>

                    <!-- Complemento -->
                    <div>
                        <label style="color: #64748b; font-size: 0.9rem; font-weight: 600; display: block; margin-bottom: 5px;">Complemento</label>
                        <input type="text" id="complemento" placeholder="Apto, Sala..." style="width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #cbd5e1; outline: none;">
                    </div>

                    <!-- Cidade -->
                    <div>
                        <label style="color: #64748b; font-size: 0.9rem; font-weight: 600; display: block; margin-bottom: 5px;">Cidade</label>
                        <input type="text" id="cidade" placeholder="Teresina" style="width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #cbd5e1; outline: none;">
                    </div>

                    <!-- Estado -->
                    <div>
                        <label style="color: #64748b; font-size: 0.9rem; font-weight: 600; display: block; margin-bottom: 5px;">Estado (UF)</label>
                        <select id="estado" style="width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #cbd5e1; outline: none; background: #fff; color: #1e3a8a;">
                            <option value="">UF</option>
                            <option value="AC">AC</option><option value="AL">AL</option><option value="AP">AP</option>
                            <option value="AM">AM</option><option value="BA">BA</option><option value="CE">CE</option>
                            <option value="DF">DF</option><option value="ES">ES</option><option value="GO">GO</option>
                            <option value="MA">MA</option><option value="MT">MT</option><option value="MS">MS</option>
                            <option value="MG">MG</option><option value="PA">PA</option><option value="PB">PB</option>
                            <option value="PR">PR</option><option value="PE">PE</option><option value="PI">PI</option>
                            <option value="RJ">RJ</option><option value="RN">RN</option><option value="RS">RS</option>
                            <option value="RO">RO</option><option value="RR">RR</option><option value="SC">SC</option>
                            <option value="SP">SP</option><option value="SE">SE</option><option value="TO">TO</option>
                        </select>
                    </div>

                    <!-- Email -->
                    <div>
                        <label style="color: #64748b; font-size: 0.9rem; font-weight: 600; display: block; margin-bottom: 5px;">E-mail</label>
                        <input type="email" id="email" placeholder="usuario@empresa.com" style="width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #cbd5e1; outline: none;">
                    </div>

                    <!-- Login -->
                    <div>
                        <label style="color: #64748b; font-size: 0.9rem; font-weight: 600; display: block; margin-bottom: 5px;">Login *</label>
                        <input type="text" id="login" placeholder="Ex: joao.silva" style="width: 100%; background: #e0f2fe; border: 1px solid #bae6fd; color: #1e3a8a; padding: 12px; border-radius: 8px; outline: none;">
                    </div>

                    <!-- Senha -->
                    <div>
                        <label style="color: #64748b; font-size: 0.9rem; font-weight: 600; display: block; margin-bottom: 5px;">Senha *</label>
                        <input type="password" id="senha" placeholder="Mínimo 6 caracteres" style="width: 100%; background: #e0f2fe; border: 1px solid #bae6fd; color: #1e3a8a; padding: 12px; border-radius: 8px; outline: none;">
                    </div>
                </div>

                <div style="display: flex; justify-content: flex-end; gap: 15px; margin-top: 25px;">
                    <button type="button" onclick="fecharModal()" class="btn-outline">Cancelar</button>
                    <button type="submit" class="btn-primary"><i class="fas fa-check"></i> Salvar</button>
                </div>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        const dbClient = window.supabaseClient || null;

        // Máscaras
        function mascaraCPF(input) {
            let value = input.value.replace(/\D/g, '');
            if (value.length > 11) value = value.slice(0, 11);
            value = value.replace(/^(\d{3})(\d)/, '$1.$2');
            value = value.replace(/^(\d{3})\.(\d{3})(\d)/, '$1.$2.$3');
            value = value.replace(/\.(\d{3})(\d)/, '.$1-$2');
            input.value = value;
        }

        function mascaraCEP(input) {
            let value = input.value.replace(/\D/g, '');
            if (value.length > 8) value = value.slice(0, 8);
            value = value.replace(/^(\d{5})(\d)/, '$1-$2');
            input.value = value;
        }

        function mascaraTelefone(input) {
            let value = input.value.replace(/\D/g, '');
            if (value.length > 11) value = value.slice(0, 11);
            if (value.length > 2) {
                value = '(' + value.substring(0, 2) + ') ' + value.substring(2);
            }
            if (value.length > 10) {
                value = value.substring(0, 10) + '-' + value.substring(10);
            }
            input.value = value;
        }

        // Foto
        function previewFoto(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                const preview = document.getElementById('preview-foto');
                preview.src = e.target.result;
                preview.style.display = 'block';
                document.getElementById('btn-remove-foto').style.display = 'block';
            };
            reader.readAsDataURL(file);
        }

        function removerImagem() {
            const preview = document.getElementById('preview-foto');
            preview.src = '';
            preview.style.display = 'none';
            document.getElementById('input-foto').value = '';
            document.getElementById('btn-remove-foto').style.display = 'none';
        }

        // Dados
        let usuarios = [];
        let empresas = [];
        let editandoId = null;

        // Carrega empresas para o dropdown
        async function carregarEmpresas() {
            if (!dbClient) return;
            const { data, error } = await dbClient.from('empresas').select('id, razao');
            if (error) { console.error('Erro ao carregar empresas:', error); return; }
            empresas = data || [];
            preencherSelectEmpresas();
        }

        function preencherSelectEmpresas() {
            const select = document.getElementById('empresa_id');
            select.innerHTML = '<option value="">Selecione uma empresa...</option>';
            empresas.forEach(emp => {
                const option = document.createElement('option');
                option.value = emp.id;
                option.textContent = emp.razao;
                select.appendChild(option);
            });
        }

        // Carrega usuários
        async function carregarUsuarios() {
            if (!dbClient) return;
            const { data, error } = await dbClient.from('usuarios').select('*').order('nome');
            if (error) { console.error('Erro ao carregar usuários:', error); return; }
            usuarios = data || [];
            renderizarTabela();
        }

        function renderizarTabela(filtro = '') {
            const tbody = document.getElementById('tabela-corpo');
            tbody.innerHTML = '';
            const filtroLower = filtro.toLowerCase();
            usuarios.forEach(user => {
                if (filtro && !user.nome.toLowerCase().includes(filtroLower) && !user.login.toLowerCase().includes(filtroLower)) return;
                const tr = document.createElement('tr');
                tr.style.borderBottom = '1px solid rgba(59,130,246,0.1)';

                // Foto
                const tdFoto = document.createElement('td');
                tdFoto.style.padding = '10px';
                if (user.foto && user.foto.trim() !== '') {
                    const img = document.createElement('img');
                    img.src = user.foto;
                    img.style.width = '50px';
                    img.style.height = '50px';
                    img.style.objectFit = 'cover';
                    img.style.borderRadius = '50%';
                    img.style.border = '1px solid #e0f2fe';
                    tdFoto.appendChild(img);
                } else {
                    tdFoto.innerHTML = '<div style="width:50px;height:50px;background:#e0f2fe;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#3b82f6;"><i class="fas fa-user"></i></div>';
                }
                tr.appendChild(tdFoto);

                // Nome
                const tdNome = document.createElement('td');
                tdNome.style.padding = '10px';
                tdNome.style.color = '#1e3a8a';
                tdNome.style.fontWeight = '600';
                tdNome.textContent = user.nome;
                tr.appendChild(tdNome);

                // Login
                const tdLogin = document.createElement('td');
                tdLogin.style.padding = '10px';
                tdLogin.style.color = '#64748b';
                tdLogin.textContent = user.login;
                tr.appendChild(tdLogin);

                // CPF
                const tdCpf = document.createElement('td');
                tdCpf.style.padding = '10px';
                tdCpf.style.color = '#64748b';
                tdCpf.textContent = user.cpf || '';
                tr.appendChild(tdCpf);

                // Empresa (busca nome na lista de empresas)
                const tdEmpresa = document.createElement('td');
                tdEmpresa.style.padding = '10px';
                tdEmpresa.style.color = '#64748b';
                const empresaEncontrada = empresas.find(e => e.id === user.empresa_id);
                tdEmpresa.textContent = empresaEncontrada ? empresaEncontrada.razao : 'Não vinculado';
                tr.appendChild(tdEmpresa);

                // Ações
                const tdAcoes = document.createElement('td');
                tdAcoes.style.padding = '10px';
                tdAcoes.style.textAlign = 'center';
                tdAcoes.innerHTML = `
                    <button onclick="editarRegistro('${user.id}')" style="background:transparent;border:none;color:#3b82f6;cursor:pointer;margin-right:8px;"><i class="fas fa-edit"></i></button>
                    <button onclick="excluirRegistro('${user.id}')" style="background:transparent;border:none;color:#ef4444;cursor:pointer;"><i class="fas fa-trash"></i></button>
                `;
                tr.appendChild(tdAcoes);

                tbody.appendChild(tr);
            });
        }

        function filtrarTabela() {
            const filtro = document.getElementById('buscaUsuario').value;
            renderizarTabela(filtro);
        }

        // Modal
        function abrirModal(user = null) {
            document.getElementById('modal').style.display = 'flex';
            document.getElementById('modal-titulo').textContent = user ? 'Editar Usuário' : 'Adicionar Usuário';

            document.getElementById('nome').value = user ? user.nome : '';
            document.getElementById('cpf').value = user ? user.cpf || '' : '';
            document.getElementById('rg').value = user ? user.rg || '' : '';
            document.getElementById('cep').value = user ? user.cep || '' : '';
            document.getElementById('telefone').value = user ? user.telefone || '' : '';
            document.getElementById('endereco').value = user ? user.endereco || '' : '';
            document.getElementById('numero').value = user ? user.numero || '' : '';
            document.getElementById('complemento').value = user ? user.complemento || '' : '';
            document.getElementById('cidade').value = user ? user.cidade || '' : '';
            document.getElementById('estado').value = user ? user.estado || '' : '';
            document.getElementById('email').value = user ? user.email || '' : '';
            document.getElementById('login').value = user ? user.login : '';
            document.getElementById('senha').value = user ? user.senha : '';
            document.getElementById('empresa_id').value = user && user.empresa_id ? user.empresa_id : '';

            if (user && user.foto) {
                const preview = document.getElementById('preview-foto');
                preview.src = user.foto;
                preview.style.display = 'block';
                document.getElementById('btn-remove-foto').style.display = 'block';
            } else {
                removerImagem();
            }

            editandoId = user ? user.id : null;
        }

        function fecharModal() {
            document.getElementById('modal').style.display = 'none';
            document.getElementById('form-usuario').reset();
            removerImagem();
            editandoId = null;
        }

        // Salvar
        async function salvarRegistro() {
            const nome = document.getElementById('nome').value.trim();
            const cpf = document.getElementById('cpf').value.trim();
            const login = document.getElementById('login').value.trim();
            const senha = document.getElementById('senha').value.trim();
            const empresa_id = document.getElementById('empresa_id').value;

            if (!nome || !cpf || !login || !senha) { alert('Preencha os campos obrigatórios: Nome, CPF, Login e Senha.'); return; }
            if (senha.length < 6) { alert('A senha deve ter no mínimo 6 caracteres.'); return; }

            const rg = document.getElementById('rg').value.trim();
            const endereco = document.getElementById('endereco').value.trim();
            const numero = document.getElementById('numero').value.trim();
            const complemento = document.getElementById('complemento').value.trim();
            const cep = document.getElementById('cep').value.trim();
            const telefone = document.getElementById('telefone').value.trim();
            const email = document.getElementById('email').value.trim();
            const cidade = document.getElementById('cidade').value.trim();
            const estado = document.getElementById('estado').value;
            const foto = document.getElementById('preview-foto').src || '';

            const novoRegistro = { nome, cpf, rg, endereco, numero, complemento, cep, foto, telefone, email, cidade, estado, login, senha, empresa_id: empresa_id || null };

            if (!dbClient) { alert('Cliente Supabase não configurado.'); return; }

            try {
                if (editandoId) {
                    const { error } = await dbClient.from('usuarios').update(novoRegistro).eq('id', editandoId);
                    if (error) throw error;
                } else {
                    const { error } = await dbClient.from('usuarios').insert(novoRegistro);
                    if (error) throw error;
                }
            } catch (err) {
                console.error('Erro detalhado:', err);
                alert('Falha ao salvar no banco de dados. Nenhum dado foi salvo localmente. Detalhes: ' + err.message);
                return;
            }

            fecharModal();
            carregarUsuarios();
        }

        // Editar e Excluir
        async function editarRegistro(id) {
            if (!dbClient) return;
            const { data, error } = await dbClient.from('usuarios').select('*').eq('id', id).single();
            if (error) { alert('Erro ao buscar usuário: ' + error.message); return; }
            if (data) abrirModal(data);
        }

        async function excluirRegistro(id) {
            if (!confirm('Deseja excluir este usuário?')) return;
            if (!dbClient) return;
            const { error } = await dbClient.from('usuarios').delete().eq('id', id);
            if (error) { alert('Erro ao excluir: ' + error.message); return; }
            carregarUsuarios();
        }

        // Inicialização
        document.addEventListener('DOMContentLoaded', () => {
            carregarEmpresas().then(() => carregarUsuarios());
        });
    </script>
</body>
</html>
