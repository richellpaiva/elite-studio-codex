    <script>

        // NOVA FUNÇÃO PARA SALVAR HISTÓRICO
        async function registrarHistorico(nomeArquivo, linhas, tamanho) {
            const db = window.supabaseClient;
            if (!db) return;
            const empresaId = localStorage.getItem('empresaId');
            const dataCriacao = new Date().toISOString().split('T')[0]; // Pode extrair do arquivo se quiser
            const { error } = await db.from('historico_importacoes').insert({
                empresa_id: empresaId,
                nome_arquivo: nomeArquivo,
                data_criacao: dataCriacao,
                quantidade_linhas: linhas,
                tamanho_arquivo: tamanho
            });
            if (error) console.error('Erro ao salvar histórico:', error);
        }

        // MODIFIQUE A FUNÇÃO processarArquivos PARA CHAMAR registrarHistorico
        async function processarArquivos() {
            const db = window.supabaseClient;
            if (!db) { alert('Banco não conectado.'); return; }
            
            const linhas = await lerArquivos();
            if (linhas.length === 0) { document.getElementById('status-importacao').textContent = 'Nenhuma linha válida.'; return; }
            
            document.getElementById('status-importacao').textContent = `Importando ${linhas.length} registros...`;
            mostrarCarregamento('Importando dados...');
            
            const CHUNK_SIZE = 500;
            for (let i = 0; i < linhas.length; i += CHUNK_SIZE) {
                const chunk = linhas.slice(i, i + CHUNK_SIZE);
                atualizarProgresso(Math.round(((i + chunk.length) / linhas.length) * 100));
                const { error } = await db.from('devolucoes').insert(chunk);
                if (error) { ocultarCarregamento(); alert('Erro ao inserir: ' + error.message); return; }
            }
            ocultarCarregamento();
            
            // Registrar histórico de cada arquivo importado
            for (const file of listaArquivos) {
                const tamanho = (file.size / 1024).toFixed(2) + ' KB';
                await registrarHistorico(file.name, linhas.length, tamanho);
            }
            
            document.getElementById('status-importacao').textContent = `✅ ${linhas.length} registros importados! Limpando duplicados...`;
            await limparDuplicadosSQL();
            
            listaArquivos = [];
            await carregarDevolucoes();
        }
        // ... (restante do código) ...
    </script>
