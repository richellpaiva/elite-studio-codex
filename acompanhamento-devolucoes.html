<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acompanhamento de Devoluções</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body>
    <script>
        if (localStorage.getItem('isLoggedIn') !== 'true') window.location.href = 'index.html';
    </script>

    <!-- Container da sidebar -->
    <div id="sidebar-container"></div>

    <!-- Conteúdo principal -->
    <div class="main-content-empresa" style="padding: 40px; transition: margin-left 0.3s ease;">
        <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; margin-bottom: 20px;">
            <h1 style="color: #1e3a8a;">Acompanhamento de Devoluções</h1>
            <div style="display: flex; gap: 10px;">
                <button onclick="document.getElementById('fileInput').click()" class="btn-primary" style="padding: 10px 20px;"><i class="fas fa-upload"></i> Importar Planilhas</button>
                <button onclick="atualizarBanco()" class="btn-outline" style="padding: 10px 20px;"><i class="fas fa-sync-alt"></i> Atualizar Banco</button>
            </div>
        </div>
        <input type="file" id="fileInput" accept=".xls,.xlsx" multiple style="display: none;" onchange="adicionarArquivos(event)">
        <div id="status-importacao" style="margin-bottom: 15px; color: #64748b; font-weight: 600;"></div>
        
        <div style="background: rgba(255,255,255,0.7); backdrop-filter: blur(10px); border-radius: 16px; padding: 20px; overflow-x: auto;">
            <table style="width: 100%; border-collapse: collapse; text-align: left;">
                <thead>
                    <tr style="background: linear-gradient(135deg, #3b82f6, #2563eb); color: white;">
                        <th style="padding: 12px;">Data</th>
                        <th style="padding: 12px;">Fornecedor</th>
                        <th style="padding: 12px;">Produto</th>
                        <th style="padding: 12px;">Qtd</th>
                        <th style="padding: 12px;">Cliente</th>
                        <th style="padding: 12px;">Motivo</th>
                        <th style="padding: 12px;">Ações</th>
                    </tr>
                </thead>
                <tbody id="tabela-devolucoes"></tbody>
            </table>
        </div>
    </div>

    <script src="script.js"></script>
    <script src="sidebar-empresa.js"></script>
    <script>
        // ========== LÓGICA DE DEVOLUÇÕES ==========
        let listaArquivos = [];

        function adicionarArquivos(event) {
            const files = Array.from(event.target.files);
            listaArquivos = listaArquivos.concat(files);
            const status = document.getElementById('status-importacao');
            status.textContent = `${listaArquivos.length} arquivo(s) selecionado(s). Clique em "Atualizar Banco" para processar.`;
            console.log("Arquivos selecionados:", listaArquivos.map(f => f.name));
            event.target.value = '';
        }

        // Função para detectar a linha de cabeçalho em uma matriz de dados
        function detectarCabecalho(matriz) {
            // Procura uma linha que contenha "CODFORNEC" ou "FORNECEDOR" na primeira coluna
            for (let i = 0; i < matriz.length; i++) {
                if (matriz[i] && matriz[i][0] === 'CODFORNEC') return i;
            }
            // Se não encontrar, assume a primeira linha
            return 0;
        }

        // Função para mapear uma linha de dados com base nos índices das colunas
        function mapearLinha(linha, empresaId) {
            return {
                empresa_id: empresaId,
                codfornec: linha[0] || '',
                fornecedor: linha[1] || '',
                numped: linha[2] || '',
                numnota: linha[3] || '',
                chavenfedev: linha[4] || '',
                dtent: linha[5] || '',
                codcli: linha[6] || '',
                cpfcnpj: linha[7] || '',
                cliente: linha[8] || '',
                codrca: linha[9] || '',
                nomerca: linha[10] || '',
                codsupervisor: linha[11] || '',
                nomesup: linha[12] || '',
                numnotaven: linha[13] || '',
                chavenfevend: linha[14] || '',
                numcarregamento: linha[15] || '',
                codprod: linha[16] || '',
                descricao: linha[17] || '',
                embalagem: linha[18] || '',
                qt: linha[19] || '',
                punit: linha[20] || '',
                custoultent: linha[21] || '',
                vltotal: linha[22] || '',
                nomefunc: linha[23] || '',
                motivo: linha[24] || '',
                numbonus: linha[25] || '',
                codfuncfecha: linha[26] || '',
                nome: linha[27] || '',
                codmotorista: linha[28] || '',
                motorista: linha[29] || '',
                codrota: linha[30] || '',
                rota: linha[31] || '',
                veiculo: linha[32] || '',
                placa: linha[33] || ''
            };
        }

        async function processarArquivos() {
            if (listaArquivos.length === 0) { alert('Nenhum arquivo selecionado.'); return; }
            const db = window.supabaseClient;
            if (!db) { alert('Banco não conectado.'); return; }
            const empresaId = localStorage.getItem('empresaId');
            const statusEl = document.getElementById('status-importacao');
            
            let todasLinhas = [];
            for (let i = 0; i < listaArquivos.length; i++) {
                const file = listaArquivos[i];
                statusEl.textContent = `Processando arquivo ${i+1}/${listaArquivos.length}: ${file.name}`;
                console.log(`Iniciando processamento do arquivo: ${file.name}`);
                try {
                    const data = await file.arrayBuffer();
                    const workbook = XLSX.read(data, { type: 'array' });
                    const sheet = workbook.Sheets[workbook.SheetNames[0]];
                    
                    // Converte para matriz (array de arrays) para ter controle total
                    const matriz = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: '' });
                    console.log(`Arquivo ${file.name}: ${matriz.length} linhas lidas.`);
                    
                    // Detecta a linha onde estão os cabeçalhos
                    const linhaCabecalho = detectarCabecalho(matriz);
                    console.log(`Linha de cabeçalho detectada: ${linhaCabecalho}`);
                    
                    // Pega todas as linhas de dados após a linha de cabeçalho
                    for (let j = linhaCabecalho + 1; j < matriz.length; j++) {
                        const linha = matriz[j];
                        // Verifica se a linha não está vazia (primeira coluna tem algo)
                        if (linha && linha[0] !== '' && linha[0] !== undefined && linha[0] !== null) {
                            todasLinhas.push(mapearLinha(linha, empresaId));
                        }
                    }
                } catch (e) {
                    console.error("Erro ao ler arquivo:", file.name, e);
                    alert('Erro ao ler arquivo ' + file.name + ': ' + e.message);
                    return;
                }
            }

            console.log("Total de linhas a inserir:", todasLinhas.length);
            if (todasLinhas.length === 0) {
                statusEl.textContent = 'Nenhuma linha válida encontrada nos arquivos. Verifique se a planilha tem cabeçalhos na primeira linha ou se os dados estão preenchidos.';
                return;
            }

            statusEl.textContent = `Inserindo ${todasLinhas.length} registros no banco...`;
            const CHUNK_SIZE = 500;
            for (let i = 0; i < todasLinhas.length; i += CHUNK_SIZE) {
                const chunk = todasLinhas.slice(i, i + CHUNK_SIZE);
                console.log(`Inserindo lote ${Math.floor(i/CHUNK_SIZE)+1} com ${chunk.length} registros`);
                const { error } = await db.from('devolucoes').insert(chunk);
                if (error) {
                    console.error("Erro ao inserir lote:", error);
                    alert('Erro ao inserir dados: ' + error.message);
                    return;
                }
            }
            statusEl.textContent = 'Importação concluída com sucesso!';
            console.log("Importação finalizada com sucesso.");
            listaArquivos = [];
            await carregarDevolucoes();
        }

        async function atualizarBanco() {
            const db = window.supabaseClient;
            if (!db) return;
            const empresaId = localStorage.getItem('empresaId');
            
            // Confirmação antes de apagar
            if (!confirm('Isso vai apagar TODOS os dados atuais e importar os arquivos selecionados. Deseja continuar?')) return;

            const statusEl = document.getElementById('status-importacao');
            statusEl.textContent = 'Apagando dados antigos...';
            console.log("Apagando dados antigos para empresa:", empresaId);
            const { error: delErr } = await db.from('devolucoes').delete().eq('empresa_id', empresaId);
            if (delErr) {
                console.error("Erro ao apagar:", delErr);
                alert('Erro ao apagar: ' + delErr.message);
                return;
            }
            console.log("Dados antigos apagados.");

            if (listaArquivos.length > 0) {
                await processarArquivos();
            } else {
                statusEl.textContent = 'Nenhum arquivo selecionado. Dados apagados.';
                console.log("Nenhum arquivo para importar.");
                await carregarDevolucoes();
            }
        }

        async function carregarDevolucoes() {
            const db = window.supabaseClient;
            if (!db) return;
            const empresaId = localStorage.getItem('empresaId');
            const { data, error } = await db.from('devolucoes').select('*').eq('empresa_id', empresaId).order('created_at', { ascending: false });
            if (error) {
                console.error("Erro ao carregar devoluções:", error);
                return;
            }
            console.log("Devoluções carregadas:", data.length);
            const tbody = document.getElementById('tabela-devolucoes');
            tbody.innerHTML = '';
            if (data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" style="text-align: center; padding: 20px; color: #64748b;">Nenhuma devolução registrada</td></tr>';
                return;
            }
            data.forEach(item => {
                const tr = document.createElement('tr');
                tr.style.borderBottom = '1px solid rgba(59,130,246,0.1)';
                tr.innerHTML = `
                    <td style="padding: 10px;">${item.dtent || ''}</td>
                    <td style="padding: 10px;">${item.fornecedor || ''}</td>
                    <td style="padding: 10px;">${item.descricao || ''}</td>
                    <td style="padding: 10px;">${item.qt || ''}</td>
                    <td style="padding: 10px;">${item.cliente || ''}</td>
                    <td style="padding: 10px;">${item.motivo || ''}</td>
                    <td style="padding: 10px;">
                        <button onclick="excluirDevolucao('${item.id}')" style="background: transparent; border: none; color: #ef4444; cursor: pointer;"><i class="fas fa-trash"></i></button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        async function excluirDevolucao(id) {
            if (!confirm('Excluir este registro?')) return;
            const db = window.supabaseClient;
            const { error } = await db.from('devolucoes').delete().eq('id', id);
            if (error) { alert('Erro: ' + error.message); return; }
            carregarDevolucoes();
        }

        document.addEventListener('DOMContentLoaded', () => {
            const wait = setInterval(() => {
                if (window.supabaseClient) {
                    clearInterval(wait);
                    carregarDevolucoes();
                }
            }, 200);
        });
    </script>
</body>
</html>
