<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configurações</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <script>
        if (localStorage.getItem('isLoggedIn') !== 'true') {
            window.location.href = 'index.html';
        }
    </script>

    <div class="watermark"></div>

    <div class="container-center" style="justify-content: flex-start; padding-top: 80px;">
        <a href="home.html" style="position: absolute; top: 25px; left: 30px; color: #3b82f6; text-decoration: none; border: 1px solid rgba(59,130,246,0.2); padding: 10px 18px; border-radius: 50px; background: rgba(255,255,255,0.7); backdrop-filter: blur(10px);">
            <i class="fas fa-arrow-left"></i> Voltar
        </a>

        <div style="background: rgba(255,255,255,0.75); backdrop-filter: blur(12px); padding: 40px; border-radius: 24px; max-width: 600px; width: 100%; border: 1px solid rgba(59,130,246,0.2); box-shadow: 0 20px 60px rgba(31,38,135,0.15);">
            <h2 style="color: #1e3a8a; text-align: center; margin-bottom: 20px;">Configurações do Sistema</h2>

            <div style="display: flex; flex-direction: column; gap: 20px;">
                <div>
                    <label style="color: #64748b; font-weight: 500;">Nome do Sistema</label>
                    <input type="text" id="configNomeSistema" placeholder="Sistema de Auditoria" value="Sistema de Auditoria">
                </div>
                <div>
                    <label style="color: #64748b; font-weight: 500;">Cor Principal da Interface</label>
                    <input type="color" id="configCorPrimaria" value="#3b82f6">
                </div>
                <div>
                    <label style="color: #64748b; font-weight: 500;">Permitir Cadastro de Empresas no Login?</label>
                    <select id="configPermitirCadastro" style="padding: 10px; border-radius: 8px; border: 1px solid #ccc;">
                        <option value="true">Sim</option>
                        <option value="false">Não</option>
                    </select>
                </div>
                <button onclick="salvarConfig()" class="btn-primary">Salvar Configurações</button>
                <p id="configMsg" style="text-align: center; display: none; color: #22c55e;"></p>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const config = JSON.parse(localStorage.getItem('config')) || { nomeSistema: 'Sistema de Auditoria', corPrimaria: '#3b82f6', permitirCadastro: true };
            document.getElementById('configNomeSistema').value = config.nomeSistema;
            document.getElementById('configCorPrimaria').value = config.corPrimaria;
            document.getElementById('configPermitirCadastro').value = config.permitirCadastro ? 'true' : 'false';
        });

        function salvarConfig() {
            const config = {
                nomeSistema: document.getElementById('configNomeSistema').value,
                corPrimaria: document.getElementById('configCorPrimaria').value,
                permitirCadastro: document.getElementById('configPermitirCadastro').value === 'true'
            };
            localStorage.setItem('config', JSON.stringify(config));
            document.getElementById('configMsg').innerHTML = '<i class="fas fa-check-circle"></i> Configurações salvas com sucesso!';
            document.getElementById('configMsg').style.display = 'block';
            setTimeout(() => { document.getElementById('configMsg').style.display = 'none'; }, 3000);
        }
    </script>
</body>
</html>
