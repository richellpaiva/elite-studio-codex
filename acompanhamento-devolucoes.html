<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acompanhamento de Devoluções</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        /* Seus estilos existentes */
        .modal-filtro-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(30,58,138,0.4); backdrop-filter: blur(6px); z-index: 9998; display: none; align-items: center; justify-content: center; }
        .modal-filtro-box { background: #fff; border-radius: 24px; padding: 30px; max-width: 600px; width: 95%; max-height: 80vh; display: flex; flex-direction: column; box-shadow: 0 20px 60px rgba(31,38,135,0.3); border: 1px solid rgba(59,130,246,0.2); }
        .modal-filtro-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 1px solid #e0f2fe; padding-bottom: 10px; }
        .modal-filtro-header h3 { margin: 0; color: #1e3a8a; }
        .modal-filtro-box input[type="text"] { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #cbd5e1; margin-bottom: 15px; }
        .modal-filtro-lista { max-height: 300px; overflow-y: auto; flex: 1; margin-bottom: 15px; border: 1px solid #e0f2fe; border-radius: 8px; padding: 10px; }
        .modal-filtro-lista label { display: flex; align-items: flex-start; gap: 12px; padding: 12px 10px; border-bottom: 1px solid #f1f5f9; cursor: pointer; font-size: 0.95rem; color: #1e3a8a; line-height: 1.4; word-break: normal; text-align: left; }
        .modal-filtro-lista label:hover { background: #e0f2fe; }
        .modal-filtro-lista input[type="checkbox"] { width: 24px; height: 24px; margin-top: 2px; flex-shrink: 0; cursor: pointer; accent-color: #3b82f6; }
        .modal-filtro-botoes { display: flex; justify-content: flex-end; gap: 10px; margin-top: auto; }
        .btn-acao { padding: 10px 20px; border-radius: 8px; cursor: pointer; border: none; font-weight: 600; }
        .btn-azul { background: #3b82f6; color: white; }
        .btn-cinza { background: #e2e8f0; color: #1e3a8a; }
        .btn-verde { background: #10b981; color: white; }
        .btn-vermelho { background: #ef4444; color: white; }
        .btn-roxo { background: #8b5cf6; color: white; }
        .paginacao { display: flex; align-items: center; gap: 15px; margin-top: 15px; justify-content: center; }
        
        /* Estilos do Dashboard */
        #dashboard-area { display: none; }
        .dashboard-filter-bar { background: rgba(255,255,255,0.8); border-radius: 12px; padding: 20px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .dashboard-chart-container { display: flex; gap: 20px; flex-wrap: wrap; }
        .chart-box { flex: 1; min-width: 400px; background: white; border-radius: 12px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .table-box { flex: 1; min-width: 400px; background: white; border-radius: 12px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); max-height: 500px; overflow-y: auto; }
        .month-btn { background: #e0f2fe; border: 1px solid #bae6fd; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-size: 0.9rem; transition: 0.3s; }
        .month-btn:hover, .month-btn.active { background: #3b82f6; color: white; border-color: #3b82f6; }
        .explorer-table { width: 100%; border-collapse: collapse; }
        .explorer-table th { text-align: left; padding: 8px; background: #f8fafc; border-bottom: 1px solid #e2e8f0; }
        .explorer-table td { padding: 8px; border-bottom: 1px solid #f1f5f9; font-size: 0.9rem; }
        .explorer-table tr:last-child td { font-weight: bold; background: #f1f5f9; }
    </style>
</head>
<body>
    <!-- ... (Início do body igual ao seu arquivo original) ... -->
    <script>
        if (localStorage.getItem('isLoggedIn') !== 'true') window.location.href = 'index.html';
    </script>

    <div id="sidebar-container"></div>
    <div class="main-content-empresa" style="padding: 40px; transition: margin-left 0.3s ease;">
        <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; margin-bottom: 20px;">
            <h1 style="color: #1e3a8a;">Acompanhamento de Devoluções</h1>
            <div style="display: flex; gap: 10px; flex-wrap: wrap;">
                <button onclick="document.getElementById('fileInput').click()" class="btn-primary" style="padding: 10px 20px;"><i class="fas fa-folder-open"></i> Selecionar Planilhas</button>
                <button onclick="processarArquivos()" class="btn-verde" style="padding: 10px 20px; border: none; border-radius: 8px; cursor: pointer;"><i class="fas fa-upload"></i> Importar Arquivos</button>
                <button onclick="substituirTudo()" class="btn-vermelho" style="padding: 10px 20px; border: none; border-radius: 8px; cursor: pointer;"><i class="fas fa-trash-alt"></i> Substituir Tudo</button>
                <button onclick="exportarExcel()" class="btn-verde" style="padding: 10px 20px; border: none; border-radius: 8px; cursor: pointer;"><i class="fas fa-file-excel"></i> Baixar Excel</button>
                <button onclick="abrirBancosImportados()" class="btn-roxo" style="padding: 10px 20px; border: none; border-radius: 8px; cursor: pointer;"><i class="fas fa-database"></i> Bancos Importados</button>
                <button onclick="alternarDashboard()" id="btn-dashboard" class="btn-roxo" style="padding: 10px 20px; border: none; border-radius: 8px; cursor: pointer;"><i class="fas fa-chart-pie"></i> Dashboard</button>
            </div>
        </div>
        <input type="file" id="fileInput" accept=".xls,.xlsx" multiple style="display: none;" onchange="adicionarArquivos(event)">
        <div id="status-importacao" style="margin-bottom: 15px; color: #1e3a8a; font-weight: 600; background: rgba(255,255,255,0.6); padding: 10px; border-radius: 8px;"></div>

        <!-- ÁREA DO DASHBOARD (Oculta por padrão) -->
        <div id="dashboard-area">
            <div style="margin-bottom: 15px;">
                <button onclick="alternarDashboard()" class="btn-cinza" style="padding: 10px 20px; cursor: pointer;"><i class="fas fa-arrow-left"></i> Voltar para Tabela</button>
            </div>

            <div class="dashboard-filter-bar">
                <h3 style="margin-top:0; color:#1e3a8a;">Devoluções por Indústria</h3>
                <div style="display: flex; flex-wrap: wrap; gap: 15px; margin-bottom: 15px;">
                    <div>
                        <label>Data Inicial</label>
                        <input type="date" id="dash_data_ini" style="padding: 8px;">
                    </div>
                    <div>
                        <label>Data Final</label>
                        <input type="date" id="dash_data_fim" style="padding: 8px;">
                    </div>
                    <div>
                        <label>Fornecedores</label>
                        <button onclick="abrirModalFiltro('fornecedor')" class="btn-cinza" style="padding: 8px;">Selecionar</button>
                    </div>
                    <div>
                        <label>Fornecedor Principal</label>
                        <button onclick="abrirModalFiltro('fornecedor_principal')" class="btn-cinza" style="padding: 8px;">Selecionar</button>
                    </div>
                </div>
                <div id="botoes-meses" style="display: flex; gap: 8px; flex-wrap: wrap;"></div>
                <div style="margin-top: 15px;">
                    <button onclick="carregarDashboard()" class="btn-azul" style="padding: 10px 20px;"><i class="fas fa-play"></i> Atualizar Dashboard</button>
                </div>
            </div>

            <div class="dashboard-chart-container">
                <div class="chart-box">
                    <h4>Gráfico de Barras (Valor Total por Fornecedor)</h4>
                    <canvas id="graficoBarras" height="250"></canvas>
                </div>
                <div class="table-box">
                    <h4>Tabela de Resumo</h4>
                    <table class="explorer-table">
                        <thead>
                            <tr>
                                <th>Fornecedor</th>
                                <th>VL.TOTAL</th>
                                <th>%</th>
                            </tr>
                        </thead>
                        <tbody id="tabela-resumo-dashboard"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- ÁREA DA TABELA (Oculta quando Dashboard está aberto) -->
        <div id="tabela-area">
            <div style="margin-bottom: 15px;">
                <button onclick="toggleFiltros()" class="btn-outline" style="display: flex; align-items: center; gap: 8px; padding: 10px 20px;">
                    <i class="fas fa-filter" id="icone-filtro"></i> <span id="texto-filtro">Mostrar Filtros</span>
                </button>
            </div>

            <div id="painel-filtros" style="display: none; background: rgba(255,255,255,0.7); backdrop-filter: blur(10px); border-radius: 16px; padding: 20px; margin-bottom: 20px;">
                <!-- CONTEÚDO DO PAINEL DE FILTROS (IGUAL AO SEU) -->
                <!-- ... -->
            </div>

            <div style="background: rgba(255,255,255,0.7); backdrop-filter: blur(10px); border-radius: 16px; padding: 20px;">
                <div style="max-height: 550px; overflow-y: auto; overflow-x: auto; border: 1px solid #e0f2fe; border-radius: 12px;">
                    <table style="width: 100%; border-collapse: collapse; text-align: left;">
                        <thead id="thead-tabela" style="position: sticky; top: 0; background: linear-gradient(135deg, #3b82f6, #2563eb); color: white; z-index: 10;"></thead>
                        <tbody id="tabela-devolucoes"></tbody>
                    </table>
                </div>
                <div class="paginacao">
                    <button onclick="mudarPagina(-1)" class="btn-acao btn-cinza"><i class="fas fa-chevron-left"></i> Anterior</button>
                    <span id="info-pagina" style="color: #1e3a8a; font-weight: 600;">Página 1 de 1</span>
                    <button onclick="mudarPagina(1)" class="btn-acao btn-cinza">Próxima <i class="fas fa-chevron-right"></i></button>
                </div>
            </div>
        </div>
    </div>

    <!-- (Seus modais existentes: Modal Bancos, Overlay, Modal Filtro) -->
    <!-- ... -->

    <script src="script.js"></script>
    <script src="sidebar-empresa.js"></script>
    <script>
        // ... (Seu código existente para tabela, filtros, importação) ...
        
        // ADICIONE ESTA PARTE PARA O DASHBOARD
        let graficoBarras = null;

        function alternarDashboard() {
            const dash = document.getElementById('dashboard-area');
            const tabela = document.getElementById('tabela-area');
            const btnDash = document.getElementById('btn-dashboard');
            
            if (dash.style.display === 'none' || dash.style.display === '') {
                dash.style.display = 'block';
                tabela.style.display = 'none';
                btnDash.innerHTML = '<i class="fas fa-table"></i> Ver Tabela';
                carregarDashboard();
            } else {
                dash.style.display = 'none';
                tabela.style.display = 'block';
                btnDash.innerHTML = '<i class="fas fa-chart-pie"></i> Dashboard';
            }
        }

        async function carregarMesesDisponiveis() {
            const db = window.supabaseClient;
            if (!db) return;
            const empresaId = localStorage.getItem('empresaId');
            
            // Busca meses distintos na coluna DTENT
            const { data, error } = await db.rpc('get_distinct_values', { col_name: 'dtent' });
            if (error) return;

            const meses = [...new Set(data.map(item => String(item).split('-')[1]))].sort();
            const nomesMeses = ['Jan', 'Fev', 'Mar', 'Abr', 'Mai', 'Jun', 'Jul', 'Ago', 'Set', 'Out', 'Nov', 'Dez'];
            
            const container = document.getElementById('botoes-meses');
            container.innerHTML = '<label style="font-weight:bold; margin-right:5px;">Mês:</label>';
            
            meses.forEach(mesNum => {
                const idx = parseInt(mesNum) - 1;
                const btn = document.createElement('button');
                btn.className = 'month-btn';
                btn.textContent = nomesMeses[idx] || mesNum;
                btn.dataset.mes = mesNum;
                btn.onclick = () => {
                    // Remove ativo de todos
                    document.querySelectorAll('.month-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    
                    // Filtra no range de datas
                    const dataIni = document.getElementById('dash_data_ini');
                    const dataFim = document.getElementById('dash_data_fim');
                    
                    dataIni.value = `2026-${mesNum}-01`;
                    dataFim.value = `2026-${mesNum}-31`;
                    carregarDashboard();
                };
                container.appendChild(btn);
            });
        }

        async function carregarDashboard() {
            const db = window.supabaseClient;
            if (!db) return;
            const empresaId = localStorage.getItem('empresaId');

            const dataInicio = document.getElementById('dash_data_ini').value || null;
            const dataFim = document.getElementById('dash_data_fim').value || null;
            
            // Converte seleções de filtros (que são salvas em arrays no objeto filtrosSelecionados)
            const fornecedores = filtrosSelecionados['fornecedor'] || null;
            const principais = filtrosSelecionados['fornecedor_principal'] || null;

            const { data, error } = await db.rpc('get_resumo_devolucoes', {
                p_empresa_id: empresaId,
                p_data_inicio: dataInicio,
                p_data_fim: dataFim,
                p_fornecedores: fornecedores,
                p_fornecedores_principais: principais
            });

            if (error) {
                console.error('Erro ao carregar dashboard:', error);
                alert('Erro ao carregar dados do dashboard: ' + error.message);
                return;
            }

            // Renderizar Tabela
            const tbody = document.getElementById('tabela-resumo-dashboard');
            tbody.innerHTML = '';
            let totalGeral = 0;
            
            data.forEach(item => {
                const valor = parseFloat(item.valor_total).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
                const perc = parseFloat(item.percentual).toFixed(2) + '%';
                totalGeral += parseFloat(item.valor_total);
                
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${item.fornecedor}</td>
                    <td>R$ ${valor}</td>
                    <td>${perc}</td>
                `;
                tbody.appendChild(tr);
            });

            // Linha de total
            const totalFormatado = totalGeral.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
            const trTotal = document.createElement('tr');
            trTotal.innerHTML = `<td>Total Geral</td><td>R$ ${totalFormatado}</td><td>100,00%</td>`;
            tbody.appendChild(trTotal);

            // Renderizar Gráfico
            const ctx = document.getElementById('graficoBarras').getContext('2d');
            
            if (graficoBarras) {
                graficoBarras.destroy();
            }

            graficoBarras = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: data.map(item => item.fornecedor),
                    datasets: [{
                        label: 'Valor Total',
                        data: data.map(item => parseFloat(item.valor_total)),
                        backgroundColor: 'rgba(59, 130, 246, 0.7)',
                        borderColor: 'rgba(59, 130, 246, 1)',
                        borderWidth: 1
                    }]
                },
                options: {
                    indexAxis: 'y', // Barras horizontais para caber nomes longos
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        x: {
                            beginAtZero: true,
                            ticks: {
                                callback: function(value) {
                                    return 'R$ ' + value.toLocaleString('pt-BR');
                                }
                            }
                        }
                    },
                    plugins: {
                        legend: { display: false }
                    }
                }
            });
        }

        // Chama a inicialização dos meses ao carregar a página
        document.addEventListener('DOMContentLoaded', async () => {
            const wait = setInterval(() => {
                if (window.supabaseClient) {
                    clearInterval(wait);
                    carregarDevolucoes();
                    carregarMesesDisponiveis();
                }
            }, 200);
        });

        // ... (Restante do seu código existente) ...
    </script>
</body>
</html>
