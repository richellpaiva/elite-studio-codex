<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard de Devoluções - Por Fornecedor</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.0.0"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background: #f0f9ff; margin: 0; padding: 0; }
        .dashboard-container { width: 100%; min-height: 100vh; padding: 20px; box-sizing: border-box; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; background: white; padding: 15px 20px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .btn { padding: 10px 20px; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; transition: 0.2s; }
        .btn-azul { background: #3b82f6; color: white; }
        .btn-cinza { background: #e2e8f0; color: #1e3a8a; }
        .filtro-toggle { display: flex; align-items: center; gap: 10px; margin-bottom: 15px; }
        
        /* ===== PAINEL DE FILTROS OTIMIZADO (MESMO PADRÃO) ===== */
        .painel-filtros { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); margin-bottom: 20px; display: none; }
        .painel-filtros.ativo { display: block; }
        
        .linha-topo { display: flex; flex-wrap: wrap; gap: 15px; margin-bottom: 20px; align-items: flex-end; }
        .campo-data { display: flex; flex-direction: column; gap: 5px; }
        .campo-data label { font-weight: 600; font-size: 0.9rem; color: #334155; }
        .campo-data input { padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 1rem; }
        
        .btn-selecionar { display: inline-flex; align-items: center; gap: 8px; padding: 10px 20px; background: #e0f2fe; border: 1px solid #bae6fd; border-radius: 8px; color: #1e3a8a; font-weight: 600; cursor: pointer; transition: 0.2s; }
        .btn-selecionar:hover { background: #dbeafe; }
        
        .linha-meses-anos { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; }
        .coluna-filtro label { font-weight: 700; color: #1e3a8a; display: block; margin-bottom: 10px; }
        .botoes-chips { display: flex; gap: 8px; flex-wrap: wrap; }
        .chip { background: #e0f2fe; border: 1px solid #bae6fd; padding: 8px 14px; border-radius: 20px; cursor: pointer; font-size: 0.9rem; user-select: none; transition: 0.2s; }
        .chip.active { background: #3b82f6; color: white; border-color: #3b82f6; }
        .acoes-chips { display: flex; gap: 8px; margin-top: 10px; }
        .acoes-chips .btn { padding: 5px 12px; font-size: 0.85rem; }
        
        /* ===== GRÁFICOS ===== */
        .graficos-container { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
        .grafico-box { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); height: 450px; border: 1px solid #e2e8f0; position: relative; }
        .grafico-box h3 { margin-top: 0; color: #1e3a8a; text-align: center; }
        canvas { width: 100% !important; height: 380px !important; display: block; }

        /* ===== TABELA ===== */
        .tabela-box { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); overflow-x: auto; margin-top: 20px; }
        .tabela-box h3 { color: #1e3a8a; margin-top: 0; margin-bottom: 15px; }
        table { width: 100%; border-collapse: collapse; font-size: 0.9rem; background: white; }
        thead th { background: linear-gradient(135deg, #3b82f6, #2563eb); color: white; font-weight: 600; text-align: center; padding: 12px 10px; border: 1px solid #2563eb; white-space: nowrap; }
        tbody td { padding: 10px 12px; border-bottom: 1px solid #e2e8f0; text-align: center; }
        tbody td:first-child { text-align: left; }
        tbody tr:last-child td { font-weight: bold; background: #dbeafe; }

        /* ===== MODAL PADRONIZADO ===== */
        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(30,58,138,0.4); backdrop-filter: blur(6px); z-index: 9998; display: none; align-items: center; justify-content: center; }
        .modal-overlay.ativo { display: flex; }
        .modal-box { background: #fff; border-radius: 24px; padding: 30px; max-width: 600px; width: 95%; max-height: 80vh; display: flex; flex-direction: column; box-shadow: 0 20px 60px rgba(31,38,135,0.3); border: 1px solid rgba(59,130,246,0.2); }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 1px solid #e0f2fe; padding-bottom: 10px; }
        .modal-header h3 { margin: 0; color: #1e3a8a; }
        .modal-lista { max-height: 300px; overflow-y: auto; margin-bottom: 15px; border: 1px solid #e0f2fe; border-radius: 8px; padding: 10px; }
        .modal-lista label { display: flex; align-items: flex-start; gap: 12px; padding: 12px 10px; border-bottom: 1px solid #f1f5f9; cursor: pointer; font-size: 0.95rem; color: #1e3a8a; line-height: 1.4; }
        .modal-lista label:hover { background: #e0f2fe; }
        .modal-lista input[type="checkbox"] { width: 24px; height: 24px; margin-top: 2px; flex-shrink: 0; cursor: pointer; accent-color: #3b82f6; }
        .modal-botoes { display: flex; justify-content: flex-end; gap: 10px; }

        /* ===== SIDEBAR ===== */
        #sidebar { position: fixed; top: 0; left: 0; width: 280px; height: 100%; background: rgba(255,255,255,0.95); backdrop-filter: blur(10px); border-right: 1px solid rgba(59,130,246,0.2); padding: 20px 15px; z-index: 100; display: flex; flex-direction: column; transition: width 0.3s ease; }
        .logo-area { text-align: center; margin-bottom: 15px; }
        .empresa-nome { color: #1e3a8a; text-align: center; font-size: 1.1rem; margin-bottom: 30px; word-wrap: break-word; }
        .nav-menu { display: flex; flex-direction: column; gap: 8px; flex-grow: 1; }
        .menu-link { display: flex; align-items: center; gap: 10px; color: #1e3a8a; text-decoration: none; padding: 12px; border-radius: 12px; transition: 0.3s; font-weight: 500; }
        .menu-link:hover, .menu-link.active { background: #e0f2fe; }
        .menu-link i { min-width: 20px; color: #3b82f6; }
        .rodape { margin-top: auto; padding-top: 15px; border-top: 1px solid rgba(59,130,246,0.2); }
        .botao-recolher { background: #e0f2fe; border: none; border-radius: 8px; padding: 8px 12px; cursor: pointer; color: #1e3a8a; margin-bottom: 15px; }
        .main-content { margin-left: 280px; padding: 40px; transition: margin-left 0.3s ease; }
    </style>
</head>
<body>

    <!-- Sidebar -->
    <div id="sidebar">
        <div class="logo-area">
            <div id="empresa-logo-placeholder" style="width: 60px; height: 60px; background: #e0f2fe; border-radius: 16px; display: flex; align-items: center; justify-content: center; color: #3b82f6; font-size: 30px; margin: 0 auto;"><i class="fas fa-building"></i></div>
            <img id="empresa-logo-img" src="" alt="Logo" style="display: none; max-width: 120px; max-height: 80px; object-fit: contain; margin: 0 auto;">
        </div>
        <h2 class="empresa-nome" id="empresa-nome-sidebar">Carregando...</h2>
        <button class="botao-recolher" onclick="toggleSidebar()"><i class="fas fa-bars"></i> <span>Recolher Menu</span></button>
        <nav class="nav-menu" id="nav-menu"></nav>
        <div class="rodape">
            <a href="painel-empresa.html" class="menu-link"><i class="fas fa-arrow-left"></i> <span>Voltar ao Painel</span></a>
            <a href="#" onclick="logout()" class="menu-link"><i class="fas fa-sign-out-alt"></i> <span>Sair</span></a>
        </div>
    </div>

    <!-- Conteúdo -->
    <div class="main-content" id="main-content">
        <div class="header">
            <h1 style="color:#1e3a8a; margin:0;">Dashboard de Devoluções</h1>
            <button class="btn btn-azul" onclick="toggleFiltros()"><i class="fas fa-filter"></i> Mostrar/Ocultar Filtros</button>
        </div>

        <!-- FILTROS CORRIGIDOS (Meses e Anos Lado a Lado + Ícones) -->
        <div id="painel-filtros" class="painel-filtros">
            
            <div class="linha-topo">
                <div class="campo-data">
                    <label>Data Inicial</label>
                    <input type="date" id="filtro_data_ini" onchange="carregarDashboard()">
                </div>
                <div class="campo-data">
                    <label>Data Final</label>
                    <input type="date" id="filtro_data_fim" onchange="carregarDashboard()">
                </div>
                <button class="btn-selecionar" onclick="abrirModalFiltro('fornecedor')"><i class="fas fa-truck"></i> Fornecedores</button>
                <button class="btn-selecionar" onclick="abrirModalFiltro('fornecedor_principal')"><i class="fas fa-building"></i> Fornecedor Principal</button>
                <button class="btn btn-azul" onclick="carregarDashboard()">Aplicar Filtros</button>
            </div>

            <div class="linha-meses-anos">
                <div class="coluna-filtro">
                    <label>Meses:</label>
                    <div id="botoes-meses" class="botoes-chips"></div>
                    <div class="acoes-chips">
                        <button onclick="selecionarTodosMeses()" class="btn btn-cinza">Todos</button>
                        <button onclick="limparMeses()" class="btn btn-cinza">Limpar</button>
                    </div>
                </div>
                <div class="coluna-filtro">
                    <label>Anos:</label>
                    <div id="botoes-anos" class="botoes-chips"></div>
                    <div class="acoes-chips">
                        <button onclick="selecionarTodosAnos()" class="btn btn-cinza">Todos</button>
                        <button onclick="limparAnos()" class="btn btn-cinza">Limpar</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Gráficos -->
        <div class="graficos-container">
            <div class="grafico-box"><h3>Por Fornecedor Principal</h3><canvas id="graficoPrincipal"></canvas></div>
            <div class="grafico-box"><h3>Por Fornecedor</h3><canvas id="graficoFornecedor"></canvas></div>
        </div>

        <!-- Tabela -->
        <div class="tabela-box">
            <h3>Resumo por Fornecedor Principal e Mês</h3>
            <table id="tabela-resumo"></table>
        </div>
    </div>

    <!-- Modal -->
    <div id="modal-overlay" class="modal-overlay">
        <div class="modal-box">
            <div class="modal-header">
                <h3 id="modal-titulo">Selecionar Fornecedores</h3>
                <button onclick="fecharModalFiltro()">&times;</button>
            </div>
            <input type="text" id="modal-busca" placeholder="Digite para buscar..." oninput="filtrarOpcoesModal()" style="width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #cbd5e1; border-radius: 8px;">
            <div class="modal-lista" id="modal-lista"></div>
            <div class="modal-botoes">
                <button onclick="selecionarTodosModal()" class="btn btn-cinza">Todos</button>
                <button onclick="limparSelecaoModal()" class="btn btn-cinza">Limpar</button>
                <button onclick="fecharModalFiltro()" class="btn btn-azul">Concluir</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
    <script src="sidebar-empresa.js"></script>
    <script>
        Chart.register(ChartDataLabels);

        let graficoPrincipal = null;
        let graficoFornecedor = null;
        let colunaAtual = null;
        let selecionados = { fornecedor: [], fornecedor_principal: [] };
        let mesesSelecionados = [];
        let anosSelecionados = [];

        window.afterSidebarInjected = function() {
            const nav = document.getElementById('nav-menu');
            if (nav) {
                nav.innerHTML = `
                    <a href="#" class="menu-link active" onclick="event.preventDefault();"><i class="fas fa-truck"></i> <span>Por Fornecedores</span></a>
                    <a href="#" class="menu-link" onclick="event.preventDefault(); alert('Em breve!');"><i class="fas fa-comment"></i> <span>Por Motivos</span></a>
                    <a href="#" class="menu-link" onclick="event.preventDefault(); alert('Em breve!');"><i class="fas fa-user"></i> <span>Por Vendedores</span></a>
                    <a href="#" class="menu-link" onclick="event.preventDefault(); alert('Em breve!');"><i class="fas fa-user-tie"></i> <span>Por Supervisores</span></a>
                    <a href="#" class="menu-link" onclick="event.preventDefault(); alert('Em breve!');"><i class="fas fa-id-card"></i> <span>Por Motoristas</span></a>
                `;
            }
        };

        window.toggleSidebar = function() {
            const sidebar = document.getElementById('sidebar');
            const main = document.getElementById('main-content');
            const texts = sidebar.querySelectorAll('span');
            const collapsed = sidebar.style.width === '70px';

            if (!collapsed) {
                sidebar.style.width = '70px';
                sidebar.style.padding = '20px 10px';
                main.style.marginLeft = '70px';
                texts.forEach(el => el.style.display = 'none');
                document.querySelector('.empresa-nome').style.display = 'none';
                document.getElementById('empresa-logo-img').style.display = 'none';
                document.getElementById('empresa-logo-placeholder').style.display = 'flex';
                document.getElementById('empresa-logo-placeholder').style.width = '40px';
                document.getElementById('empresa-logo-placeholder').style.height = '40px';
                document.getElementById('empresa-logo-placeholder').style.fontSize = '18px';
            } else {
                sidebar.style.width = '280px';
                sidebar.style.padding = '20px 15px';
                main.style.marginLeft = '280px';
                texts.forEach(el => el.style.display = 'inline');
                document.querySelector('.empresa-nome').style.display = 'block';
                const img = document.getElementById('empresa-logo-img');
                if (img.src) {
                    img.style.display = 'block';
                    document.getElementById('empresa-logo-placeholder').style.display = 'none';
                } else {
                    document.getElementById('empresa-logo-placeholder').style.display = 'flex';
                    document.getElementById('empresa-logo-placeholder').style.width = '60px';
                    document.getElementById('empresa-logo-placeholder').style.height = '60px';
                    document.getElementById('empresa-logo-placeholder').style.fontSize = '30px';
                }
            }
        };

        function converterData(valor) {
            if (!valor) return '';
            if (!isNaN(valor) && Number(valor) > 20000 && Number(valor) < 60000) {
                const data = new Date((Number(valor) - 25569) * 86400 * 1000);
                return data.toISOString().split('T')[0];
            }
            let str = String(valor).trim();
            if (str.includes('-') && str.length >= 10) return str.substring(0, 10);
            if (str.includes('/')) { const partes = str.split('/'); return `${partes[2]}-${partes[1]}-${partes[0]}`; }
            return str;
        }

        function converterValor(valor) {
            if (typeof valor === 'number') return valor;
            let str = String(valor).trim().replace(/R\$/g, '').replace(/\s/g, '');
            if (str.includes(',')) { str = str.replace(/\./g, '').replace(',', '.'); }
            else { const partes = str.split('.'); if (partes.length > 1) { if (partes[partes.length - 1].length <= 2) { str = partes.slice(0, -1).join('') + '.' + partes[partes.length - 1]; } else { str = partes.join(''); } } }
            const num = parseFloat(str);
            return isNaN(num) ? 0 : num;
        }

        function toggleFiltros() {
            const painel = document.getElementById('painel-filtros');
            painel.classList.toggle('ativo');
        }

        async function abrirModalFiltro(coluna) {
            colunaAtual = coluna;
            document.getElementById('modal-titulo').textContent = coluna === 'fornecedor' ? 'Selecionar Fornecedores' : 'Selecionar Fornecedor Principal';
            document.getElementById('modal-busca').value = '';
            document.getElementById('modal-lista').innerHTML = 'Carregando...';
            document.getElementById('modal-overlay').classList.add('ativo');
            const db = window.supabaseClient;
            if (!db) return;
            const { data, error } = await db.rpc('get_distinct_values', { col_name: coluna });
            if (error) { console.error(error); document.getElementById('modal-lista').innerHTML = 'Erro ao carregar'; return; }
            const valores = (data || []).sort();
            const selecionadosAtuais = selecionados[coluna] || [];
            const listaHTML = valores.map(val => `<label><input type="checkbox" value="${val}" ${selecionadosAtuais.includes(val) ? 'checked' : ''}> ${val}</label>`).join('');
            document.getElementById('modal-lista').innerHTML = listaHTML;
        }

        function filtrarOpcoesModal() {
            const termo = document.getElementById('modal-busca').value.toLowerCase();
            const lista = document.getElementById('modal-lista');
            const labels = lista.querySelectorAll('label');
            labels.forEach(label => { const texto = label.textContent.toLowerCase(); label.style.display = texto.includes(termo) ? 'flex' : 'none'; });
        }

        function fecharModalFiltro() {
            document.getElementById('modal-overlay').classList.remove('ativo');
            const checkboxes = document.querySelectorAll('#modal-lista input[type="checkbox"]:checked');
            const valores = Array.from(checkboxes).map(cb => cb.value);
            if (colunaAtual) { selecionados[colunaAtual] = valores; carregarDashboard(); }
        }

        function selecionarTodosModal() { document.querySelectorAll('#modal-lista input[type="checkbox"]').forEach(cb => cb.checked = true); }
        function limparSelecaoModal() { document.querySelectorAll('#modal-lista input[type="checkbox"]').forEach(cb => cb.checked = false); }

        async function carregarOpcoes() {
            const db = window.supabaseClient;
            if (!db) return;
            const { data, error } = await db.rpc('get_distinct_values', { col_name: 'dtent' });
            if (error) return;
            const nomesMeses = ['Jan', 'Fev', 'Mar', 'Abr', 'Mai', 'Jun', 'Jul', 'Ago', 'Set', 'Out', 'Nov', 'Dez'];
            const meses = new Set(); const anos = new Set();
            (data || []).forEach(val => { const dataConvertida = converterData(val); if (dataConvertida && dataConvertida.includes('-')) { const partes = dataConvertida.split('-'); meses.add(partes[1]); anos.add(partes[0]); } });

            const containerMeses = document.getElementById('botoes-meses');
            containerMeses.innerHTML = '';
            [...meses].sort().forEach(mesNum => { const idx = parseInt(mesNum) - 1; const chip = document.createElement('div'); chip.className = 'chip'; chip.textContent = nomesMeses[idx] || mesNum; chip.dataset.mes = mesNum; chip.onclick = () => { chip.classList.toggle('active'); atualizarMesesSelecionados(); carregarDashboard(); }; containerMeses.appendChild(chip); });

            const containerAnos = document.getElementById('botoes-anos');
            containerAnos.innerHTML = '';
            [...anos].sort().forEach(ano => { const chip = document.createElement('div'); chip.className = 'chip'; chip.textContent = ano; chip.dataset.ano = ano; chip.onclick = () => { chip.classList.toggle('active'); atualizarAnosSelecionados(); carregarDashboard(); }; containerAnos.appendChild(chip); });

            mesesSelecionados = [...meses]; anosSelecionados = [...anos];
            document.querySelectorAll('#botoes-meses .chip').forEach(c => c.classList.add('active'));
            document.querySelectorAll('#botoes-anos .chip').forEach(c => c.classList.add('active'));
        }

        function atualizarMesesSelecionados() { mesesSelecionados = Array.from(document.querySelectorAll('#botoes-meses .chip.active')).map(c => c.dataset.mes); }
        function atualizarAnosSelecionados() { anosSelecionados = Array.from(document.querySelectorAll('#botoes-anos .chip.active')).map(c => c.dataset.ano); }

        function selecionarTodosMeses() { document.querySelectorAll('#botoes-meses .chip').forEach(c => c.classList.add('active')); atualizarMesesSelecionados(); carregarDashboard(); }
        function limparMeses() { document.querySelectorAll('#botoes-meses .chip').forEach(c => c.classList.remove('active')); atualizarMesesSelecionados(); carregarDashboard(); }
        function selecionarTodosAnos() { document.querySelectorAll('#botoes-anos .chip').forEach(c => c.classList.add('active')); atualizarAnosSelecionados(); carregarDashboard(); }
        function limparAnos() { document.querySelectorAll('#botoes-anos .chip').forEach(c => c.classList.remove('active')); atualizarAnosSelecionados(); carregarDashboard(); }

        function getChartOptions(formatFunc) {
            return {
                indexAxis: 'y', responsive: true, maintainAspectRatio: false,
                plugins: {
                    legend: { display: false },
                    datalabels: { color: '#ffffff', backgroundColor: 'rgba(30, 58, 138, 0.8)', borderRadius: 4, padding: 6, anchor: 'end', align: 'end', offset: 4, font: { weight: 'bold', size: 12 }, formatter: formatFunc }
                },
                scales: {
                    x: { grid: { color: 'rgba(0, 0, 0, 0.05)' }, ticks: { color: '#334155', callback: function(value) { return 'R$ ' + Number(value).toLocaleString('pt-BR'); } } },
                    y: { grid: { display: false }, ticks: { color: '#334155', font: { size: 12 } } }
                }
            };
        }

        async function carregarDashboard() {
            const db = window.supabaseClient;
            if (!db) return;
            const empresaId = localStorage.getItem('empresaId');
            const dataIni = document.getElementById('filtro_data_ini').value || null;
            const dataFim = document.getElementById('filtro_data_fim').value || null;
            const forn = selecionados['fornecedor'].length ? selecionados['fornecedor'] : null;
            const fornPrinc = selecionados['fornecedor_principal'].length ? selecionados['fornecedor_principal'] : null;
            const meses = mesesSelecionados.length ? mesesSelecionados : null;
            const anos = anosSelecionados.length ? anosSelecionados : null;

            const { data, error } = await db.rpc('get_resumo_mensal', { p_empresa_id: empresaId, p_anos: anos, p_meses: meses, p_fornecedores: forn, p_fornecedores_principais: fornPrinc });
            if (error) { console.error('Erro ao carregar dados:', error); alert('Erro ao carregar dados: ' + error.message); return; }
            if (!data || data.length === 0) { document.getElementById('tabela-resumo').innerHTML = '<tr><td colspan="100%" style="text-align:center; color:#64748b; padding:20px;">Nenhum dado encontrado para os filtros selecionados.</td></tr>'; if (graficoPrincipal) { graficoPrincipal.destroy(); graficoPrincipal = null; } if (graficoFornecedor) { graficoFornecedor.destroy(); graficoFornecedor = null; } return; }

            const dadosPorPrincipal = {}; const dadosPorFornecedor = {}; const dadosPorMesPorPrincipal = {};
            data.forEach(item => {
                const valor = converterValor(item.valor_total);
                if (!dadosPorPrincipal[item.fornecedor_principal]) dadosPorPrincipal[item.fornecedor_principal] = 0;
                dadosPorPrincipal[item.fornecedor_principal] += valor;
                if (!dadosPorFornecedor[item.fornecedor]) dadosPorFornecedor[item.fornecedor] = 0;
                dadosPorFornecedor[item.fornecedor] += valor;
                if (!dadosPorMesPorPrincipal[item.fornecedor_principal]) dadosPorMesPorPrincipal[item.fornecedor_principal] = {};
                if (!dadosPorMesPorPrincipal[item.fornecedor_principal][item.mes]) dadosPorMesPorPrincipal[item.fornecedor_principal][item.mes] = 0;
                dadosPorMesPorPrincipal[item.fornecedor_principal][item.mes] += valor;
            });

            const arrayPrincipal = Object.entries(dadosPorPrincipal).sort((a, b) => b[1] - a[1]);
            const arrayFornecedor = Object.entries(dadosPorFornecedor).sort((a, b) => b[1] - a[1]);
            const formatCurrency = (val) => 'R$ ' + Number(val).toLocaleString('pt-BR', { maximumFractionDigits: 0 });

            const ctx1 = document.getElementById('graficoPrincipal').getContext('2d');
            if (graficoPrincipal) graficoPrincipal.destroy();
            graficoPrincipal = new Chart(ctx1, { type: 'bar', data: { labels: arrayPrincipal.map(item => item[0]), datasets: [{ label: 'Valor', data: arrayPrincipal.map(item => item[1]), backgroundColor: 'rgba(59, 130, 246, 0.9)', borderColor: 'rgba(147, 197, 253, 1)', borderWidth: 2 }] }, options: getChartOptions(formatCurrency) });

            const ctx2 = document.getElementById('graficoFornecedor').getContext('2d');
            if (graficoFornecedor) graficoFornecedor.destroy();
            graficoFornecedor = new Chart(ctx2, { type: 'bar', data: { labels: arrayFornecedor.map(item => item[0]), datasets: [{ label: 'Valor', data: arrayFornecedor.map(item => item[1]), backgroundColor: 'rgba(29, 78, 216, 0.9)', borderColor: 'rgba(96, 165, 250, 1)', borderWidth: 2 }] }, options: getChartOptions(formatCurrency) });

            const nomesMeses = ['Jan', 'Fev', 'Mar', 'Abr', 'Mai', 'Jun', 'Jul', 'Ago', 'Set', 'Out', 'Nov', 'Dez'];
            const mesesOrdenados = [...mesesSelecionados].sort();
            const totalPorMes = {}; mesesOrdenados.forEach(m => { totalPorMes[m] = 0; arrayPrincipal.forEach(([principal]) => { totalPorMes[m] += dadosPorMesPorPrincipal[principal]?.[m] || 0; }); });
            const totalGeral = arrayPrincipal.reduce((acc, [, val]) => acc + val, 0);

            const containerTabela = document.getElementById('tabela-resumo');
            let html = '<thead><tr><th>Fornecedor Principal</th>';
            mesesOrdenados.forEach(m => { const nome = nomesMeses[parseInt(m)-1] || m; html += `<th>Vlr. DEV. ${nome}.</th><th>%Vlr. DEV. ${nome}.</th>`; });
            html += '<th>Total Geral</th><th>% Total</th></tr></thead><tbody>';

            arrayPrincipal.forEach(([principal, valorTotal]) => {
                html += `<tr><td>${principal}</td>`;
                mesesOrdenados.forEach(m => { const v = dadosPorMesPorPrincipal[principal]?.[m] || 0; const pctMes = totalPorMes[m] > 0 ? (v / totalPorMes[m]) * 100 : 0; html += `<td>R$ ${v.toLocaleString('pt-BR', { minimumFractionDigits: 2 })}</td><td>${pctMes.toFixed(2)}%</td>`; });
                const pctTotal = totalGeral > 0 ? (valorTotal / totalGeral) * 100 : 0;
                html += `<td>R$ ${valorTotal.toLocaleString('pt-BR', { minimumFractionDigits: 2 })}</td><td>${pctTotal.toFixed(2)}%</td></tr>`;
            });

            html += `<tr><td>Total Geral</td>`;
            mesesOrdenados.forEach(m => { const v = totalPorMes[m]; html += `<td>R$ ${v.toLocaleString('pt-BR', { minimumFractionDigits: 2 })}</td><td>100%</td>`; });
            html += `<td>R$ ${totalGeral.toLocaleString('pt-BR', { minimumFractionDigits: 2 })}</td><td>100%</td></tr>`;
            html += '</tbody>';
            containerTabela.innerHTML = html;
        }

        document.addEventListener('DOMContentLoaded', async () => {
            const wait = setInterval(async () => {
                if (window.supabaseClient) { clearInterval(wait); await carregarOpcoes(); carregarDashboard(); }
            }, 200);
        });
    </script>
</body>
</html>
