<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Início - Sistema de Auditoria</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <!-- IMPORTANTE: Biblioteca do Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <script>
        if (localStorage.getItem('isLoggedIn') !== 'true') {
            window.location.href = 'index.html';
        }
    </script>

    <div class="watermark"></div>

    <div class="top-header">
        <div class="user-tag">
            <i class="fas fa-user-circle"></i> 
            <span id="loggedUserName"></span>
        </div>
        <button onclick="logout()" class="btn-outline" style="padding: 6px 14px; font-size: 0.8rem;">
            <i class="fas fa-sign-out-alt"></i> Sair
        </button>
    </div>

    <div class="container-center">
        <h1 style="font-size: 2.8rem; color: #1e3a8a; margin-bottom: 15px; text-align: center; font-weight: 800; letter-spacing: -0.5px; text-shadow: 0 2px 10px rgba(59,130,246,0.1);">
            Sistema de Auditoria
        </h1>
        <p style="color: #3b82f6; font-size: 1.1rem; margin-bottom: 50px; letter-spacing: 1px; font-weight: 500;">
            Selecione uma opção para começar
        </p>

        <div class="grid-menu">
            <a href="analises.html" class="menu-item">
                <i class="fas fa-chart-bar"></i>
                <span>Análises</span>
            </a>
            <a href="importacao.html" class="menu-item">
                <i class="fas fa-upload"></i>
                <span>Importação</span>
            </a>
            <a href="relatorios.html" class="menu-item">
                <i class="fas fa-file-alt"></i>
                <span>Relatórios</span>
            </a>
            <a href="gerar-auditoria.html" class="menu-item">
                <i class="fas fa-pen"></i>
                <span>Gerar Auditoria</span>
            </a>
            <a href="cadastro-usuarios.html" class="menu-item">
                <i class="fas fa-user-plus"></i>
                <span>Cadastro de Usuários</span>
            </a>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('loggedUserName').textContent = localStorage.getItem('userName') || 'Usuário';
        });
    </script>
</body>
</html>
