<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel da Empresa</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <script>
        // Proteção: se não estiver logado, volta para o login
        if (localStorage.getItem('isLoggedIn') !== 'true') {
            window.location.href = 'index.html';
        }
        // Se for ADMIN, redireciona para o painel administrativo
        if (localStorage.getItem('userName') === 'Administrador' || localStorage.getItem('userName') === 'RICHELL') {
            window.location.href = 'home.html';
        }
    </script>

    <!-- Menu lateral fixo -->
    <div class="sidebar" style="position: fixed; left: 0; top: 0; width: 280px; height: 100%; background: rgba(255,255,255,0.7); backdrop-filter: blur(10px); border-right: 1px solid rgba(59,130,246,0.2); padding: 30px 20px; z-index: 100; display: flex; flex-direction: column;">
        
        <!-- Logo da empresa (carregada do Supabase) -->
        <div style="text-align: center; margin-bottom: 30px;">
            <img id="empresa-logo" src="" alt="Logo" style="display: none; max-width: 150px; max-height: 100px; object-fit: contain; margin: 0 auto;">
            <div id="empresa-logo-placeholder" style="width: 80px; height: 80px; background: #e0f2fe; border-radius: 20px; display: flex; align-items: center; justify-content: center; color: #3b82f6; font-size: 40px; margin: 0 auto;">
                <i class="fas fa-building"></i>
            </div>
        </div>

        <h2 id="empresa-nome" style="color: #1e3a8a; text-align: center; font-size: 1.4rem; margin-bottom: 40px;">Carregando...</h2>

        <!-- Menu de navegação -->
        <nav style="display: flex; flex-direction: column; gap: 10px;">
            <a href="acompanhamento-devolucoes.html" style="display: flex; align-items: center; gap: 15px; color: #1e3a8a; text-decoration: none; padding: 15px; border-radius: 12px; transition: 0.3s; font-weight: 500; background: rgba(59,130,246,0.1);">
                <i class="fas fa-undo-alt" style="color: #3b82f6; font-size: 1.2rem;"></i> Acompanhamento de Devoluções
            </a>
            <!-- Adicione os próximos menus aqui -->
        </nav>

        <!-- Botões no rodapé -->
        <div style="margin-top: auto; padding-top: 20px; border-top: 1px solid rgba(59,130,246,0.2);">
            <a href="home.html" style="display: flex; align-items: center; gap: 10px; color: #64748b; text-decoration: none; padding: 10px;">
                <i class="fas fa-arrow-left"></i> Voltar ao Painel Geral
            </a>
            <a href="#" onclick="logout()" style="display: flex; align-items: center; gap: 10px; color: #ef4444; text-decoration: none; padding: 10px;">
                <i class="fas fa-sign-out-alt"></i> Sair
            </a>
        </div>
    </div>

    <!-- Conteúdo principal -->
    <div style="margin-left: 280px; padding: 40px;">
        <div class="top-header" style="display: flex; justify-content: flex-end; margin-bottom: 20px;">
            <span style="color: #1e3a8a;"><i class="fas fa-user-circle"></i> <span id="loggedUserName"></span></span>
        </div>
        
        <h1 style="font-size: 2.5rem; color: #1e3a8a; margin-bottom: 10px; font-weight: 800;">
            Bem-vindo, <span id="userNameDisplay"></span>
        </h1>
        <p style="color: #3b82f6; font-size: 1.1rem; margin-bottom: 40px; letter-spacing: 1px; font-weight: 500;">
            Portal Operacional: <span id="empresaDisplay"></span>
        </p>

        <div class="grid-menu" style="grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); max-width: 900px; gap: 20px;">
            <a href="analises.html" class="menu-item">
                <i class="fas fa-chart-bar"></i>
                <span>Análises</span>
            </a>
            <a href="importacao.html" class="menu-item">
                <i class="fas fa-upload"></i>
                <span>Importação</span>
            </a>
            <a href="relatorios.html" class="menu-item">
                <i class="fas fa-file-alt"></i>
                <span>Relatórios</span>
            </a>
            <a href="gerar-auditoria.html" class="menu-item">
                <i class="fas fa-pen"></i>
                <span>Gerar Auditoria</span>
            </a>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        function logout() {
            localStorage.removeItem('isLoggedIn');
            localStorage.removeItem('userName');
            localStorage.removeItem('empresaId');
            window.location.href = 'index.html';
        }

        // Buscar dados da empresa no Supabase usando o empresaId salvo no localStorage
        async function carregarEmpresa() {
            const dbClient = window.supabaseClient;
            if (!dbClient) return;

            const empresaId = localStorage.getItem('empresaId');
            if (!empresaId) {
                document.getElementById('empresa-nome').textContent = 'Empresa não encontrada';
                document.getElementById('empresaDisplay').textContent = '—';
                return;
            }

            const { data, error } = await dbClient.from('empresas').select('*').eq('id', empresaId).single();
            if (error) {
                console.error('Erro ao buscar empresa:', error);
                document.getElementById('empresa-nome').textContent = 'Empresa não encontrada';
                return;
            }

            if (data) {
                document.getElementById('empresa-nome').textContent = data.razao;
                document.getElementById('empresaDisplay').textContent = data.razao;
                
                if (data.logo && data.logo.trim() !== '') {
                    const img = document.getElementById('empresa-logo');
                    img.src = data.logo;
                    img.style.display = 'block';
                    document.getElementById('empresa-logo-placeholder').style.display = 'none';
                }
            }
        }

        document.addEventListener('DOMContentLoaded', async () => {
            const userName = localStorage.getItem('userName') || 'Usuário';
            document.getElementById('loggedUserName').textContent = userName;
            document.getElementById('userNameDisplay').textContent = userName;
            
            await carregarEmpresa();
        });
    </script>
</body>
</html>
