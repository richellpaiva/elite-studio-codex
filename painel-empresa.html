<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel da Empresa</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .menu-link { display: flex; align-items: center; gap: 10px; padding: 12px; border-radius: 12px; color: #1e3a8a; text-decoration: none; transition: 0.3s; font-weight: 500; }
        .menu-link:hover { background: #e0f2fe; }
        .grid-menu { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-top: 20px; }
        .menu-item { background: rgba(255,255,255,0.8); border-radius: 16px; padding: 30px; text-align: center; color: #1e3a8a; text-decoration: none; display: flex; flex-direction: column; align-items: center; gap: 15px; transition: 0.3s; box-shadow: 0 4px 15px rgba(0,0,0,0.05); border: 1px solid rgba(59,130,246,0.1); }
        .menu-item:hover { transform: translateY(-5px); box-shadow: 0 10px 25px rgba(59,130,246,0.15); }
        .menu-item i { font-size: 2.2rem; color: #3b82f6; }
    </style>
</head>
<body>
    <div id="sidebar-container"></div>
    <div class="main-content-empresa" style="padding: 40px; transition: margin-left 0.3s ease;">
        <div style="display: flex; justify-content: flex-end; margin-bottom: 20px;">
            <div style="display: flex; align-items: center; gap: 12px; background: rgba(255,255,255,0.7); padding: 8px 16px; border-radius: 30px; border: 1px solid rgba(59,130,246,0.2);">
                <img id="user-foto" src="" alt="Foto" style="width: 40px; height: 40px; border-radius: 50%; object-fit: cover; display: none;">
                <div id="user-foto-placeholder" style="width: 40px; height: 40px; border-radius: 50%; background: #e0f2fe; display: flex; align-items: center; justify-content: center; color: #3b82f6;"><i class="fas fa-user"></i></div>
                <span id="user-name" style="color: #1e3a8a; font-weight: 600;">Carregando...</span>
            </div>
        </div>
        <div id="content-area"></div>
    </div>

    <script src="script.js"></script>
    <script src="sidebar-empresa.js"></script>
    <script>
        let nomeEmpresa = '';
        async function carregarDados() {
            const db = window.supabaseClient;
            if (!db) return;
            const userId = localStorage.getItem('userId');
            const empresaId = localStorage.getItem('empresaId');
            
            // Carrega usuário
            if (userId) {
                const { data: user } = await db.from('usuarios').select('*').eq('id', userId).single();
                if (user) {
                    document.getElementById('user-name').textContent = user.nome;
                    if (user.foto) {
                        document.getElementById('user-foto').src = user.foto;
                        document.getElementById('user-foto').style.display = 'block';
                        document.getElementById('user-foto-placeholder').style.display = 'none';
                    }
                }
            }
            // Carrega empresa
            if (empresaId) {
                const { data: empresa } = await db.from('empresas').select('*').eq('id', empresaId).single();
                if (empresa) {
                    nomeEmpresa = empresa.razao;
                    montarMenu(empresa.razao);
                }
            }
        }

        function montarMenu(razaoEmpresa) {
            const area = document.getElementById('content-area');
            const ehElite = razaoEmpresa.toUpperCase().includes('ELITE STUDIO');
            
            if (ehElite) {
                area.innerHTML = `
                    <h1 style="color:#1e3a8a; font-size:2.5rem; font-weight:800;">Bem-vindo ao Painel</h1>
                    <p style="color:#3b82f6; margin-bottom:30px;">Portal Operacional: ${razaoEmpresa}</p>
                    <div class="grid-menu">
                        <a href="analises.html" class="menu-item"><i class="fas fa-chart-bar"></i><span>Análises</span></a>
                        <a href="importacao.html" class="menu-item"><i class="fas fa-upload"></i><span>Importação</span></a>
                        <a href="relatorios.html" class="menu-item"><i class="fas fa-file-alt"></i><span>Relatórios</span></a>
                        <a href="gerar-auditoria.html" class="menu-item"><i class="fas fa-pen"></i><span>Gerar Auditoria</span></a>
                        <a href="cadastro-usuarios.html" class="menu-item"><i class="fas fa-user-plus"></i><span>Cadastro de Usuários</span></a>
                        <a href="cadastro-empresas.html" class="menu-item"><i class="fas fa-building"></i><span>Cadastro de Empresas</span></a>
                        <a href="consulta-importacoes.html" class="menu-item"><i class="fas fa-database"></i><span>Consultar Bancos Importados</span></a>
                        <a href="#" class="menu-item"><i class="fas fa-cog"></i><span>Configurações</span></a>
                    </div>
                `;
            } else {
                area.innerHTML = `
                    <h1 style="color:#1e3a8a;">Bem-vindo ao Painel</h1>
                    <p style="color:#3b82f6;">Portal Operacional: ${razaoEmpresa}</p>
                    <div class="grid-menu">
                        <a href="acompanhamento-devolucoes.html" class="menu-item"><i class="fas fa-undo-alt"></i><span>Acompanhamento de Devoluções</span></a>
                        <a href="consulta-importacoes.html" class="menu-item"><i class="fas fa-database"></i><span>Consultar Bancos Importados</span></a>
                    </div>
                `;
            }
        }
        document.addEventListener('DOMContentLoaded', () => {
            const wait = setInterval(() => {
                if (window.supabaseClient) {
                    clearInterval(wait);
                    carregarDados();
                }
            }, 200);
        });
    </script>
</body>
</html>
