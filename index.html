<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acessar Empresas - Sistema de Auditoria</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <!-- CARREGANDO A BIBLIOTECA DO SUPABASE -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="watermark"></div>

    <div class="container-center" style="max-width: 420px; margin: 0 auto;">
        <div style="text-align: center; margin-bottom: 30px;">
            <!-- CORRIGIDO: Agora aponta para logotipo-principal.png -->
            <img src="logotipo-principal.png" alt="Logo Principal" style="height: 160px; width: auto; margin-bottom: 15px; object-fit: contain; filter: drop-shadow(0 4px 10px rgba(59,130,246,0.3));">
            <h2 style="color: #1e3a8a; margin-top: 0; font-weight: 700; letter-spacing: 1px;">Acessar Empresas</h2>
        </div>

        <div style="background: rgba(255,255,255,0.75); backdrop-filter: blur(12px); border: 1px solid rgba(59,130,246,0.2); padding: 40px; border-radius: 24px; width: 100%; box-shadow: 0 20px 60px rgba(31,38,135,0.15);">
            <!-- ADICIONADO O onsubmit PARA CHAMAR handleLogin -->
            <form id="loginForm" onsubmit="event.preventDefault(); handleLogin(document.getElementById('login').value, document.getElementById('password').value);" style="width: 100%; display: flex; flex-direction: column; gap: 20px;">
                <div>
                    <input type="text" id="login" placeholder="Usuário (Login)" value="TESTE01" required>
                </div>
                <div>
                    <input type="password" id="password" placeholder="Senha" value="123" required>
                </div>
                
                <!-- Este é o elemento de erro que a função handleLogin pode acionar -->
                <p id="loginError" style="color: #ef4444; font-size: 0.9rem; display: none; text-align: center;">
                    <i class="fas fa-exclamation-circle"></i> Usuário ou senha incorretos.
                </p>

                <button type="submit" class="btn-primary" style="width: 100%; justify-content: center;">
                    <i class="fas fa-sign-in-alt"></i> Entrar
                </button>
            </form>
        </div>
    </div>

    <!-- Carrega o script.js que contém a função handleLogin -->
    <script src="script.js"></script>
    
    <!-- Script auxiliar para exibir erro caso o login falhe -->
    <script>
        // Essa função é chamada pelo script.js quando o login é inválido
        window.showLoginError = function() {
            document.getElementById('loginError').style.display = 'block';
        };
        // Essa função é chamada pelo script.js para esconder o erro se tentar de novo
        window.hideLoginError = function() {
            document.getElementById('loginError').style.display = 'none';
        };

        // Limpa o erro quando o usuário começa a digitar
        document.getElementById('login').addEventListener('input', window.hideLoginError);
        document.getElementById('password').addEventListener('input', window.hideLoginError);
    </script>
</body>
</html>
