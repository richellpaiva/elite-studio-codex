<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acessar Empresas - Elite Studio Codex</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* RESET FORTE PARA GANHAR DO style.css */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: 
                radial-gradient(circle at 15% 20%, rgba(59, 130, 246, 0.2), transparent 50%),
                radial-gradient(circle at 85% 80%, rgba(139, 92, 246, 0.2), transparent 50%),
                linear-gradient(135deg, #ffffff, #f0f9ff, #e0f2fe);
            overflow: hidden;
            font-family: 'Inter', sans-serif !important;
        }

        /* LUZES NEON DE FUNDO */
        .neon-glow {
            position: fixed;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.6;
            z-index: 0;
            animation: floatLight 10s infinite alternate ease-in-out;
        }

        .neon-1 {
            background: rgba(59, 130, 246, 0.5);
            top: -150px;
            left: -150px;
            box-shadow: 0 0 100px rgba(59, 130, 246, 0.3);
        }

        .neon-2 {
            background: rgba(139, 92, 246, 0.4);
            bottom: -150px;
            right: -150px;
            animation-delay: 5s;
            box-shadow: 0 0 100px rgba(139, 92, 246, 0.3);
        }

        @keyframes floatLight {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(50px, -50px) scale(1.2); }
        }

        /* CONTAINER DE CENTRALIZAÇÃO PERFEITA */
        .container-central {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
            pointer-events: none;
        }

        /* CARD DE VIDRO */
        .glass-card {
            pointer-events: auto;
            width: 100%;
            max-width: 440px;
            padding: 40px;
            border-radius: 24px;
            text-align: center;
            
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-top: 1px solid rgba(255, 255, 255, 0.6);
            
            box-shadow: 
                0 20px 60px rgba(30, 58, 138, 0.2),
                inset 0 1px 0 rgba(255, 255, 255, 0.6),
                inset 0 -20px 40px rgba(59, 130, 246, 0.1),
                0 0 40px rgba(59, 130, 246, 0.3),
                0 0 80px rgba(139, 92, 246, 0.15);
            
            animation: fadeIn 0.8s ease;
        }

        .glass-card::before {
            content: '';
            position: absolute;
            top: -1px;
            left: 10%;
            width: 80%;
            height: 2px;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.9), transparent);
            border-radius: 50%;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* LOGO */
        .logo-container {
            margin-bottom: 25px;
        }

        .logo-container img {
            max-width: 180px;
            max-height: 110px;
            object-fit: contain;
            filter: drop-shadow(0 4px 15px rgba(59, 130, 246, 0.3));
        }

        /* TÍTULOS */
        .login-title {
            color: #1e3a8a;
            font-size: 2rem;
            font-weight: 800;
            margin-bottom: 5px;
            letter-spacing: -0.5px;
            text-shadow: 0 2px 10px rgba(255, 255, 255, 0.5);
        }

        .login-subtitle {
            color: #3b82f6;
            font-size: 1rem;
            font-weight: 500;
            margin-bottom: 30px;
        }

        /* INPUTS */
        .input-group { margin-bottom: 20px; text-align: left; }

        .input-group label {
            display: block;
            color: #475569;
            font-size: 0.85rem;
            font-weight: 700;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-group input {
            width: 100%;
            padding: 15px 16px;
            background: rgba(255, 255, 255, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 12px;
            color: #1e3a8a;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
            box-shadow: 
                inset 0 2px 4px rgba(30, 58, 138, 0.05),
                0 4px 8px rgba(30, 58, 138, 0.05);
        }

        .input-group input::placeholder { color: #94a3b8; }

        .input-group input:focus {
            border-color: #60a5fa;
            background: rgba(255, 255, 255, 0.9);
            box-shadow: 
                0 0 0 4px rgba(59, 130, 246, 0.1),
                0 4px 12px rgba(59, 130, 246, 0.2),
                inset 0 2px 4px rgba(30, 58, 138, 0.05);
        }

        /* BOTÃO COM GLOW NEON */
        .btn-login {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            border: none;
            border-radius: 12px;
            color: #ffffff;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 
                0 10px 20px rgba(59, 130, 246, 0.4),
                0 0 30px rgba(59, 130, 246, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.2);
        }

        .btn-login:hover {
            transform: translateY(-3px);
            box-shadow: 
                0 15px 30px rgba(59, 130, 246, 0.5),
                0 0 50px rgba(59, 130, 246, 0.5);
        }

        .btn-login:active { transform: translateY(0); }

        /* MENSAGEM DE ERRO */
        .error-msg {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #dc2626;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 0.9rem;
            font-weight: 500;
            display: none;
        }

        .error-msg.visible { display: block; }

        /* RODAPÉ */
        .login-footer {
            margin-top: 25px;
            color: #64748b;
            font-size: 0.85rem;
            font-weight: 500;
        }
        
        /* ÍCONE SVG DO BOTÃO */
        .btn-login svg {
            width: 20px;
            height: 20px;
            fill: white;
        }
    </style>
</head>
<body>
    <!-- LUZES NEON DE FUNDO -->
    <div class="neon-glow neon-1"></div>
    <div class="neon-glow neon-2"></div>

    <!-- CARD DE LOGIN PERFEITAMENTE CENTRALIZADO -->
    <div class="container-central">
        <div class="glass-card">
            <!-- LOGO -->
            <div class="logo-container">
                <img src="logotipo-principal.png" alt="Elite Studio Codex">
            </div>

            <h2 class="login-title">Acessar Empresas</h2>
            <p class="login-subtitle">Entre com suas credenciais</p>

            <!-- FORMULÁRIO -->
            <form id="loginForm">
                <div class="input-group">
                    <label for="login">Usuário</label>
                    <input type="text" id="login" placeholder="Digite seu login" required autocomplete="username">
                </div>

                <div class="input-group">
                    <label for="password">Senha</label>
                    <input type="password" id="password" placeholder="Digite sua senha" required autocomplete="current-password">
                </div>

                <div id="loginError" class="error-msg">
                    <i class="fas fa-exclamation-circle"></i> Usuário ou senha incorretos.
                </div>

                <button type="submit" class="btn-login">
                    <!-- ÍCONE SVG INLINE (NÃO DEPENDE DE FONTE EXTERNA) -->
                    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path d="M10 17l5-5-5-5v3H3v4h7v3zm9-14h-8v2h8v14h-8v2h8c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2z"/>
                    </svg>
                    Entrar
                </button>
            </form>

            <!-- RODAPÉ -->
            <div class="login-footer">
                © 2026 Elite Studio Codex - Data Intelligence & Analytics System
            </div>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        // FUNÇÕES DE ERRO
        window.showLoginError = function() {
            document.getElementById('loginError').classList.add('visible');
        };

        window.hideLoginError = function() {
            document.getElementById('loginError').classList.remove('visible');
        };

        // SUBMIT DO LOGIN
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            if (typeof handleLogin === 'function') {
                handleLogin(
                    document.getElementById('login').value,
                    document.getElementById('password').value
                );
            }
        });

        // LIMPA ERRO AO DIGITAR
        document.getElementById('login').addEventListener('input', window.hideLoginError);
        document.getElementById('password').addEventListener('input', window.hideLoginError);
    </script>
</body>
</html>
