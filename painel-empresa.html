<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel da Empresa</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        /* Estilos para o painel */
        .menu-link {
            display: flex; align-items: center; gap: 10px; padding: 12px; border-radius: 12px;
            color: #1e3a8a; text-decoration: none; transition: 0.3s; font-weight: 500;
        }
        .menu-link:hover { background: #e0f2fe; }
        .menu-link.active { background: rgba(59,130,246,0.2); }
        .grid-menu {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; max-width: 1100px;
        }
        .menu-item {
            background: rgba(255,255,255,0.8); border-radius: 16px; padding: 30px; text-align: center;
            color: #1e3a8a; text-decoration: none; display: flex; flex-direction: column; align-items: center;
            gap: 15px; transition: 0.3s; box-shadow: 0 4px 15px rgba(0,0,0,0.05); border: 1px solid rgba(59,130,246,0.1);
        }
        .menu-item:hover { transform: translateY(-5px); box-shadow: 0 10px 25px rgba(59,130,246,0.15); }
        .menu-item i { font-size: 2.2rem; color: #3b82f6; }
    </style>
</head>
<body>
    <script>
        if (localStorage.getItem('isLoggedIn') !== 'true') window.location.href = 'index.html';
    </script>

    <!-- Container da sidebar (preenchido pelo sidebar-empresa.js) -->
    <div id="sidebar-container"></div>

    <!-- Conteúdo Principal -->
    <div class="main-content-empresa" style="margin-left: 280px; padding: 40px; transition: margin-left 0.3s ease;">
        
        <!-- Cabeçalho com foto e nome do usuário -->
        <div style="display: flex; justify-content: flex-end; margin-bottom: 30px;">
            <div style="display: flex; align-items: center; gap: 12px; background: rgba(255,255,255,0.7); padding: 8px 16px; border-radius: 30px; border: 1px solid rgba(59,130,246,0.2);">
                <img id="user-foto" src="" alt="Foto" style="width: 40px; height: 40px; border-radius: 50%; object-fit: cover; display: none;">
                <div id="user-foto-placeholder" style="width: 40px; height: 40px; border-radius: 50%; background: #e0f2fe; display: flex; align-items: center; justify-content: center; color: #3b82f6;">
                    <i class="fas fa-user"></i>
                </div>
                <span id="user-name" style="color: #1e3a8a; font-weight: 600; font-size: 0.95rem;">Carregando...</span>
            </div>
        </div>

        <!-- Área de conteúdo dinâmico -->
        <div id="content-area">
            <!-- Será preenchido dinamicamente -->
        </div>
    </div>

    <script src="script.js"></script>
    <script src="sidebar-empresa.js"></script>

    <script>
        // Variáveis globais
        let nomeEmpresaAtual = '';
        let conteudoAtual = 'inicio';
        let sidebarAtual = null;

        // ================== CARREGAR DADOS DO USUÁRIO ==================
        async function carregarUsuario() {
            const db = window.supabaseClient;
            if (!db) return;
            const userId = localStorage.getItem('userId');
            if (!userId) return;
            const { data, error } = await db.from('usuarios').select('*').eq('id', userId).single();
            if (error) { console.error(error); return; }
            if (data) {
                document.getElementById('user-name').textContent = data.nome;
                if (data.foto) {
                    const img = document.getElementById('user-foto');
                    img.src = data.foto;
                    img.style.display = 'block';
                    document.getElementById('user-foto-placeholder').style.display = 'none';
                }
            }
        }

        // ================== CARREGAR DADOS DA EMPRESA ==================
        async function carregarEmpresa() {
            const db = window.supabaseClient;
            if (!db) return;
            const empresaId = localStorage.getItem('empresaId');
            if (!empresaId) return;
            const { data, error } = await db.from('empresas').select('*').eq('id', empresaId).single();
            if (error) { console.error(error); return; }
            if (data) {
                nomeEmpresaAtual = data.razao || '';
                // Após carregar, atualiza a sidebar (que vem do sidebar-empresa.js) e o conteúdo
                atualizarConteudo();
            }
        }

        // ================== ATUALIZAR CONTEÚDO CONFORME A EMPRESA ==================
        function atualizarConteudo() {
            const area = document.getElementById('content-area');
            if (!area) return;

            // Verifica se é a ELITE STUDIO CODEX
            const ehElite = nomeEmpresaAtual.toUpperCase().includes('ELITE STUDIO');

            if (ehElite) {
                // PAINEL PRINCIPAL DA ELITE (botões principais)
                if (conteudoAtual === 'inicio') {
                    area.innerHTML = `
                        <h1 style="color: #1e3a8a; font-size: 2.5rem; font-weight: 800; margin-bottom: 10px;">Bem-vindo ao Painel</h1>
                        <p style="color: #3b82f6; font-size: 1.1rem; margin-bottom: 40px; font-weight: 500;">Portal Operacional: ${nomeEmpresaAtual}</p>

                        <div class="grid-menu">
                            <a href="analises.html" class="menu-item">
                                <i class="fas fa-chart-bar"></i>
                                <span>Análises</span>
                            </a>
                            <a href="importacao.html" class="menu-item">
                                <i class="fas fa-upload"></i>
                                <span>Importação</span>
                            </a>
                            <a href="relatorios.html" class="menu-item">
                                <i class="fas fa-file-alt"></i>
                                <span>Relatórios</span>
                            </a>
                            <a href="gerar-auditoria.html" class="menu-item">
                                <i class="fas fa-pen"></i>
                                <span>Gerar Auditoria</span>
                            </a>
                            <a href="cadastro-usuarios.html" class="menu-item">
                                <i class="fas fa-user-plus"></i>
                                <span>Cadastro de Usuários</span>
                            </a>
                            <a href="cadastro-empresas.html" class="menu-item">
                                <i class="fas fa-building"></i>
                                <span>Cadastro de Empresas</span>
                            </a>
                            <a href="#" class="menu-item">
                                <i class="fas fa-cog"></i>
                                <span>Configurações</span>
                            </a>
                        </div>
                    `;
                }
            } else {
                // PAINEL DA TT (devoluções)
                if (conteudoAtual === 'inicio') {
                    area.innerHTML = `
                        <h1 style="color: #1e3a8a; font-size: 2.5rem; font-weight: 800; margin-bottom: 10px;">Bem-vindo ao Painel</h1>
                        <p style="color: #3b82f6; font-size: 1.1rem; margin-bottom: 40px; font-weight: 500;">Portal Operacional: ${nomeEmpresaAtual}</p>
                        <div style="text-align: center; padding: 40px; background: rgba(255,255,255,0.7); border-radius: 16px;">
                            <p style="color: #64748b;">Selecione uma opção no menu lateral.</p>
                        </div>
                    `;
                }
            }
        }

        // ================== FUNÇÕES DA SIDEBAR (APÓS INJEÇÃO) ==================
        window.afterSidebarInjected = function() {
            const sidebar = document.getElementById('sidebar');
            if (!sidebar) return;
            const nav = sidebar.querySelector('nav');
            if (!nav) return;
            
            // Limpa o menu atual
            nav.innerHTML = '';

            // Verifica se é Elite ou TT
            const ehElite = nomeEmpresaAtual.toUpperCase().includes('ELITE STUDIO');

            if (ehElite) {
                // Menu da Elite
                nav.innerHTML = `
                    <a href="#" class="menu-link active" onclick="event.preventDefault(); conteudoAtual='inicio'; atualizarConteudo();">
                        <i class="fas fa-home" style="min-width: 20px;"></i> <span class="menu-text">Início</span>
                    </a>
                    <a href="analises.html" class="menu-link">
                        <i class="fas fa-chart-bar" style="min-width: 20px;"></i> <span class="menu-text">Análises</span>
                    </a>
                    <a href="importacao.html" class="menu-link">
                        <i class="fas fa-upload" style="min-width: 20px;"></i> <span class="menu-text">Importação</span>
                    </a>
                    <a href="relatorios.html" class="menu-link">
                        <i class="fas fa-file-alt" style="min-width: 20px;"></i> <span class="menu-text">Relatórios</span>
                    </a>
                    <a href="gerar-auditoria.html" class="menu-link">
                        <i class="fas fa-pen" style="min-width: 20px;"></i> <span class="menu-text">Gerar Auditoria</span>
                    </a>
                    <a href="cadastro-usuarios.html" class="menu-link">
                        <i class="fas fa-user-plus" style="min-width: 20px;"></i> <span class="menu-text">Cadastro de Usuários</span>
                    </a>
                    <a href="cadastro-empresas.html" class="menu-link">
                        <i class="fas fa-building" style="min-width: 20px;"></i> <span class="menu-text">Cadastro de Empresas</span>
                    </a>
                    <a href="#" class="menu-link" onclick="event.preventDefault(); alert('Configurações em breve');">
                        <i class="fas fa-cog" style="min-width: 20px;"></i> <span class="menu-text">Configurações</span>
                    </a>
                `;
            } else {
                // Menu da TT
                nav.innerHTML = `
                    <a href="#" class="menu-link active" onclick="event.preventDefault(); conteudoAtual='inicio'; atualizarConteudo();">
                        <i class="fas fa-home" style="min-width: 20px;"></i> <span class="menu-text">Início</span>
                    </a>
                    <a href="acompanhamento-devolucoes.html" class="menu-link">
                        <i class="fas fa-undo-alt" style="min-width: 20px;"></i> <span class="menu-text">Acompanhamento de Devoluções</span>
                    </a>
                `;
            }
        };

        // ================== INICIALIZAÇÃO ==================
        document.addEventListener('DOMContentLoaded', async () => {
            const wait = setInterval(() => {
                if (window.supabaseClient) {
                    clearInterval(wait);
                    carregarUsuario();
                    carregarEmpresa().then(() => {
                        // Força a atualização da sidebar após carregar empresa
                        setTimeout(() => {
                            if (window.afterSidebarInjected) window.afterSidebarInjected();
                            atualizarConteudo();
                        }, 500);
                    });
                }
            }, 200);
        });
    </script>
</body>
</html>
