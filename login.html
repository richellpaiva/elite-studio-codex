<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Auditoria</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
    <div class="watermark" style="background-size: 30% auto; opacity: 0.05;"></div>

    <div class="container-center" style="max-width: 400px; margin: 0 auto; text-align: center;">
        <img src="https://i.imgur.com/IWI5gqi.png" alt="Logo" style="height: 80px; margin-bottom: 20px; object-fit: contain;">
        <h2 style="color: #fff; margin-bottom: 10px;">Acessar Sistema</h2>
        <p style="color: #888; margin-bottom: 30px;">Insira suas credenciais para continuar</p>

        <form id="loginForm" style="width: 100%; display: flex; flex-direction: column; gap: 15px;">
            <div>
                <input type="email" id="email" placeholder="E-mail" value="admin@auditoria.com" required>
            </div>
            <div>
                <input type="password" id="password" placeholder="Senha" value="123456" required>
            </div>
            <p id="loginError" style="color: #ef4444; font-size: 0.9rem; display: none;">
                <i class="fas fa-exclamation-circle"></i> Credenciais inválidas.
            </p>
            <button type="submit" class="btn-primary" style="width: 100%;">
                <i class="fas fa-sign-in-alt"></i> Entrar
            </button>
            <a href="index.html" style="color: #888; margin-top: 15px; text-decoration: none; font-size: 0.9rem;">
                <i class="fas fa-arrow-left"></i> Voltar para início
            </a>
        </form>
    </div>

    <script src="script.js"></script>
</body>
</html>
