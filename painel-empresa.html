<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel da Empresa</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body>
    <script>
        if (localStorage.getItem('isLoggedIn') !== 'true') window.location.href = 'index.html';
    </script>

    <!-- Sidebar -->
    <div id="sidebar" style="position: fixed; top: 0; left: 0; width: 280px; height: 100%; background: rgba(255,255,255,0.7); backdrop-filter: blur(10px); border-right: 1px solid rgba(59,130,246,0.2); padding: 20px 15px; z-index: 100; display: flex; flex-direction: column; transition: width 0.3s ease;">
        
        <!-- Logo da empresa -->
        <div style="text-align: center; margin-bottom: 15px; position: relative;">
            <img id="empresa-logo" src="" alt="Logo" style="display: none; max-width: 120px; max-height: 80px; object-fit: contain; margin: 0 auto;">
            <div id="empresa-logo-placeholder" style="width: 60px; height: 60px; background: #e0f2fe; border-radius: 16px; display: flex; align-items: center; justify-content: center; color: #3b82f6; font-size: 30px; margin: 0 auto;">
                <i class="fas fa-building"></i>
            </div>
        </div>
        <h2 id="empresa-nome" style="color: #1e3a8a; text-align: center; font-size: 1.1rem; margin-bottom: 30px; word-wrap: break-word;">Carregando...</h2>

        <!-- Botão hambúrguer (posicionado logo abaixo do logo, sem sobrepor) -->
        <div style="text-align: center; margin-bottom: 15px;">
            <button onclick="toggleSidebar()" style="background: #e0f2fe; border: none; border-radius: 8px; padding: 8px 12px; cursor: pointer; color: #1e3a8a;"><i class="fas fa-bars" id="menuIcon"></i> <span class="menu-text">Recolher Menu</span></button>
        </div>

        <!-- Menu -->
        <nav style="display: flex; flex-direction: column; gap: 8px;">
            <a href="#" onclick="loadSection('devolucoes')" class="menu-link" style="display: flex; align-items: center; gap: 10px; color: #1e3a8a; text-decoration: none; padding: 12px; border-radius: 12px; transition: 0.3s; font-weight: 500; background: rgba(59,130,246,0.1);">
                <i class="fas fa-undo-alt" style="color: #3b82f6; font-size: 1.2rem; min-width: 20px;"></i>
                <span class="menu-text">Acompanhamento de Devoluções</span>
            </a>
        </nav>

        <!-- Rodapé -->
        <div style="margin-top: auto; padding-top: 15px; border-top: 1px solid rgba(59,130,246,0.2);">
            <a href="home.html" class="menu-link" style="display: flex; align-items: center; gap: 10px; color: #64748b; text-decoration: none; padding: 10px;">
                <i class="fas fa-arrow-left" style="min-width: 20px;"></i>
                <span class="menu-text">Voltar ao Painel Geral</span>
            </a>
            <a href="#" onclick="logout()" style="display: flex; align-items: center; gap: 10px; color: #ef4444; text-decoration: none; padding: 10px;">
                <i class="fas fa-sign-out-alt" style="min-width: 20px;"></i>
                <span class="menu-text">Sair</span>
            </a>
        </div>
    </div>

    <!-- Conteúdo Principal -->
    <div id="main-content" style="margin-left: 280px; padding: 30px; transition: margin-left 0.3s ease;">
        <!-- Cabeçalho do usuário -->
        <div style="display: flex; justify-content: flex-end; margin-bottom: 20px;">
            <div style="display: flex; align-items: center; gap: 10px; background: rgba(255,255,255,0.7); padding: 6px 14px; border-radius: 30px; border: 1px solid rgba(59,130,246,0.2);">
                <img id="user-foto" src="" alt="Foto" style="width: 35px; height: 35px; border-radius: 50%; object-fit: cover; display: none;">
                <div id="user-foto-placeholder" style="width: 35px; height: 35px; border-radius: 50%; background: #e0f2fe; display: flex; align-items: center; justify-content: center; color: #3b82f6;">
                    <i class="fas fa-user"></i>
                </div>
                <span id="user-name" style="color: #1e3a8a; font-weight: 600; font-size: 0.9rem;">Carregando...</span>
            </div>
        </div>

        <!-- Área de conteúdo -->
        <div id="content-area">
            <h1 style="color: #1e3a8a;">Bem-vindo!</h1>
            <p style="color: #64748b;">Selecione uma opção no menu lateral.</p>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        // ========== CONTROLE DA SIDEBAR ==========
        let collapsed = false;
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const main = document.getElementById('main-content');
            const texts = document.querySelectorAll('.menu-text');
            collapsed = !collapsed;
            if (collapsed) {
                sidebar.style.width = '70px';
                sidebar.style.padding = '20px 10px';
                main.style.marginLeft = '70px';
                texts.forEach(el => el.style.display = 'none');
                document.getElementById('empresa-nome').style.display = 'none';
            } else {
                sidebar.style.width = '280px';
                sidebar.style.padding = '20px 15px';
                main.style.marginLeft = '280px';
                texts.forEach(el => el.style.display = 'inline');
                document.getElementById('empresa-nome').style.display = 'block';
            }
        }

        // ========== CARREGAR USUÁRIO E EMPRESA ==========
        async function carregarUsuario() {
            const db = window.supabaseClient;
            if (!db) return;
            const userId = localStorage.getItem('userId');
            if (!userId) return;
            const { data, error } = await db.from('usuarios').select('*').eq('id', userId).single();
            if (error) return;
            if (data) {
                document.getElementById('user-name').textContent = data.nome;
                if (data.foto) {
                    const img = document.getElementById('user-foto');
                    img.src = data.foto;
                    img.style.display = 'block';
                    document.getElementById('user-foto-placeholder').style.display = 'none';
                }
            }
        }

        async function carregarEmpresa() {
            const db = window.supabaseClient;
            if (!db) return;
            const empresaId = localStorage.getItem('empresaId');
            if (!empresaId) return;
            const { data, error } = await db.from('empresas').select('*').eq('id', empresaId).single();
            if (error) return;
            if (data) {
                document.getElementById('empresa-nome').textContent = data.razao;
                if (data.logo) {
                    const img = document.getElementById('empresa-logo');
                    img.src = data.logo;
                    img.style.display = 'block';
                    document.getElementById('empresa-logo-placeholder').style.display = 'none';
                }
            }
        }

        // ========== LÓGICA DE DEVOLUÇÕES ==========
        let listaArquivos = []; // Armazena os arquivos selecionados

        async function loadSection(section) {
            const area = document.getElementById('content-area');
            if (section === 'devolucoes') {
                area.innerHTML = `
                    <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; margin-bottom: 20px;">
                        <h1 style="color: #1e3a8a;">Acompanhamento de Devoluções</h1>
                        <div style="display: flex; gap: 10px;">
                            <button onclick="document.getElementById('fileInput').click()" class="btn-primary" style="padding: 10px 20px;"><i class="fas fa-upload"></i> Importar Planilhas</button>
                            <button onclick="atualizarBanco()" class="btn-outline" style="padding: 10px 20px;"><i class="fas fa-sync-alt"></i> Atualizar Banco</button>
                        </div>
                    </div>
                    <input type="file" id="fileInput" accept=".xls,.xlsx" multiple style="display: none;" onchange="adicionarArquivos(event)">
                    <div id="status-importacao" style="margin-bottom: 15px; color: #64748b;"></div>
                    <div style="background: rgba(255,255,255,0.7); backdrop-filter: blur(10px); border-radius: 16px; padding: 20px; overflow-x: auto;">
                        <table style="width: 100%; border-collapse: collapse; text-align: left;">
                            <thead>
                                <tr style="background: linear-gradient(135deg, #3b82f6, #2563eb); color: white;">
                                    <th style="padding: 12px;">Data</th>
                                    <th style="padding: 12px;">Fornecedor</th>
                                    <th style="padding: 12px;">Produto</th>
                                    <th style="padding: 12px;">Qtd</th>
                                    <th style="padding: 12px;">Cliente</th>
                                    <th style="padding: 12px;">Motivo</th>
                                    <th style="padding: 12px;">Ações</th>
                                </tr>
                            </thead>
                            <tbody id="tabela-devolucoes"></tbody>
                        </table>
                    </div>
                `;
                await carregarDevolucoes();
            }
        }

        function adicionarArquivos(event) {
            const files = Array.from(event.target.files);
            listaArquivos = listaArquivos.concat(files);
            document.getElementById('status-importacao').textContent = `${listaArquivos.length} arquivo(s) selecionado(s). Clique em "Atualizar Banco" para processar.`;
            event.target.value = '';
        }

        async function processarArquivos() {
            if (listaArquivos.length === 0) { alert('Nenhum arquivo selecionado.'); return; }
            const db = window.supabaseClient;
            if (!db) return;
            const empresaId = localStorage.getItem('empresaId');
            const statusEl = document.getElementById('status-importacao');

            // Lê todos os arquivos e coleta as linhas
            let todasLinhas = [];
            for (let i = 0; i < listaArquivos.length; i++) {
                const file = listaArquivos[i];
                statusEl.textContent = `Processando arquivo ${i+1}/${listaArquivos.length}: ${file.name}`;
                const data = await file.arrayBuffer();
                const workbook = XLSX.read(data, { type: 'array' });
                const sheet = workbook.Sheets[workbook.SheetNames[0]];
                const json = XLSX.utils.sheet_to_json(sheet, { defval: '' });
                // Mapeia as colunas para os campos da tabela
                json.forEach(row => {
                    todasLinhas.push({
                        empresa_id: empresaId,
                        codfornec: row['CODFORNEC'] || '',
                        fornecedor: row['FORNECEDOR'] || '',
                        numped: row['NUMPED'] || '',
                        numnota: row['NUMNOTA'] || '',
                        chavenfedev: row['CHAVENFEDEV'] || '',
                        dtent: row['DTENT'] || '',
                        codcli: row['CODCLI'] || '',
                        cpfcnpj: row['CPFCNPJ'] || '',
                        cliente: row['CLIENTE'] || '',
                        codrca: row['CODRCA'] || '',
                        nomerca: row['NOMERCA'] || '',
                        codsupervisor: row['CODSUPERVISOR'] || '',
                        nomesup: row['NOMESUP'] || '',
                        numnotaven: row['NUMNOTAVEN'] || '',
                        chavenfevend: row['CHAVENFEVEND'] || '',
                        numcarregamento: row['NUMCARREGAMENTO'] || '',
                        codprod: row['CODPROD'] || '',
                        descricao: row['DESCRICAO'] || '',
                        embalagem: row['EMBALAGEM'] || '',
                        qt: row['QT'] || '',
                        punit: row['PUNIT'] || '',
                        custoultent: row['CUSTOULTENT'] || '',
                        vltotal: row['VLTOTAL'] || '',
                        nomefunc: row['NOMEFUNC'] || '',
                        motivo: row['MOTIVO'] || '',
                        numbonus: row['NUMBONUS'] || '',
                        codfuncfecha: row['CODFUNCFECHA'] || '',
                        nome: row['NOME'] || '',
                        codmotorista: row['CODMOTORISTA'] || '',
                        motorista: row['MOTORISTA'] || '',
                        codrota: row['CODROTA'] || '',
                        rota: row['ROTA'] || '',
                        veiculo: row['VEICULO'] || '',
                        placa: row['PLACA'] || ''
                    });
                });
            }

            // Insere em lotes de 500
            statusEl.textContent = `Inserindo ${todasLinhas.length} registros no banco...`;
            const CHUNK_SIZE = 500;
            for (let i = 0; i < todasLinhas.length; i += CHUNK_SIZE) {
                const chunk = todasLinhas.slice(i, i + CHUNK_SIZE);
                const { error } = await db.from('devolucoes').insert(chunk);
                if (error) { alert('Erro ao inserir: ' + error.message); return; }
            }
            statusEl.textContent = 'Importação concluída!';
            listaArquivos = [];
            await carregarDevolucoes();
        }

        async function atualizarBanco() {
            const db = window.supabaseClient;
            if (!db) return;
            const empresaId = localStorage.getItem('empresaId');
            if (!confirm('Isso vai apagar TODOS os dados atuais e importar os arquivos selecionados. Deseja continuar?')) return;

            // Apaga tudo
            const { error: delErr } = await db.from('devolucoes').delete().eq('empresa_id', empresaId);
            if (delErr) { alert('Erro ao apagar: ' + delErr.message); return; }

            // Se houver arquivos, processa e insere
            if (listaArquivos.length > 0) {
                await processarArquivos();
            } else {
                document.getElementById('status-importacao').textContent = 'Nenhum arquivo selecionado para reimportar. Dados apagados.';
                await carregarDevolucoes();
            }
        }

        async function carregarDevolucoes() {
            const db = window.supabaseClient;
            if (!db) return;
            const empresaId = localStorage.getItem('empresaId');
            const { data, error } = await db.from('devolucoes').select('*').eq('empresa_id', empresaId).order('created_at', { ascending: false });
            if (error) return;
            const tbody = document.getElementById('tabela-devolucoes');
            if (!tbody) return;
            tbody.innerHTML = '';
            if (data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" style="text-align: center; padding: 20px; color: #64748b;">Nenhuma devolução registrada</td></tr>';
                return;
            }
            data.forEach(item => {
                const tr = document.createElement('tr');
                tr.style.borderBottom = '1px solid rgba(59,130,246,0.1)';
                tr.innerHTML = `
                    <td style="padding: 10px;">${item.dtent || ''}</td>
                    <td style="padding: 10px;">${item.fornecedor || ''}</td>
                    <td style="padding: 10px;">${item.descricao || ''}</td>
                    <td style="padding: 10px;">${item.qt || ''}</td>
                    <td style="padding: 10px;">${item.cliente || ''}</td>
                    <td style="padding: 10px;">${item.motivo || ''}</td>
                    <td style="padding: 10px;">
                        <button onclick="excluirDevolucao('${item.id}')" style="background: transparent; border: none; color: #ef4444; cursor: pointer;"><i class="fas fa-trash"></i></button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        async function excluirDevolucao(id) {
            if (!confirm('Excluir este registro?')) return;
            const db = window.supabaseClient;
            const { error } = await db.from('devolucoes').delete().eq('id', id);
            if (error) { alert('Erro: ' + error.message); return; }
            carregarDevolucoes();
        }

        function logout() {
            localStorage.removeItem('isLoggedIn');
            localStorage.removeItem('userName');
            localStorage.removeItem('empresaId');
            localStorage.removeItem('userId');
            window.location.href = 'index.html';
        }

        document.addEventListener('DOMContentLoaded', async () => {
            await carregarUsuario();
            await carregarEmpresa();
            loadSection('devolucoes');
        });
    </script>
</body>
</html>
