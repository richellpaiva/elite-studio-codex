<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel da Empresa</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* Reset e fundo */
        body {
            font-family: 'Inter', sans-serif;
            background: 
                radial-gradient(circle at 15% 20%, rgba(59, 130, 246, 0.2), transparent 50%),
                radial-gradient(circle at 85% 80%, rgba(139, 92, 246, 0.2), transparent 50%),
                linear-gradient(135deg, #ffffff, #f0f9ff, #e0f2fe);
            min-height: 100vh;
            margin: 0;
        }

        /* Luzes neon de fundo */
        .neon-glow {
            position: fixed;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.5;
            z-index: 0;
            animation: floatLight 10s infinite alternate ease-in-out;
        }

        .neon-1 { background: rgba(59, 130, 246, 0.4); top: -150px; left: -150px; box-shadow: 0 0 100px rgba(59, 130, 246, 0.3); }
        .neon-2 { background: rgba(139, 92, 246, 0.3); bottom: -150px; right: -150px; animation-delay: 5s; box-shadow: 0 0 100px rgba(139, 92, 246, 0.3); }

        @keyframes floatLight {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(50px, -50px) scale(1.2); }
        }

        /* Estrutura da sidebar (mantém a injetada pelo sidebar-empresa.js) */
        #sidebar-container { z-index: 100; }

        /* Conteúdo principal */
        .main-content-empresa {
            position: relative;
            z-index: 10;
            margin-left: 280px;
            padding: 40px;
            transition: margin-left 0.3s ease;
        }

        /* Cabeçalho do usuário */
        .user-header {
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 50px;
            padding: 8px 20px;
            box-shadow: 
                0 10px 30px rgba(30, 58, 138, 0.1),
                inset 0 1px 0 rgba(255, 255, 255, 0.6);
            display: inline-flex;
            align-items: center;
            gap: 10px;
            float: right;
        }

        .user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #60a5fa;
        }

        .user-avatar-placeholder {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #e0f2fe;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #3b82f6;
        }

        .user-name {
            color: #1e3a8a;
            font-weight: 700;
            font-size: 1rem;
        }

        /* Título */
        .welcome-title {
            color: #1e3a8a;
            font-size: 2.8rem;
            font-weight: 800;
            margin: 0 0 10px 0;
            text-shadow: 0 2px 10px rgba(255, 255, 255, 0.6);
        }

        .welcome-subtitle {
            color: #3b82f6;
            font-size: 1.1rem;
            font-weight: 500;
            margin-bottom: 50px;
        }

        /* Grid de cards com vidro */
        .grid-menu {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 30px;
            max-width: 1000px;
        }

        .menu-item {
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(15px);
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            color: #1e3a8a;
            text-decoration: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 
                0 20px 40px rgba(30, 58, 138, 0.1),
                0 8px 16px rgba(30, 58, 138, 0.05),
                inset 0 1px 0 rgba(255, 255, 255, 0.6);
        }

        .menu-item:hover {
            transform: translateY(-5px);
            box-shadow: 
                0 30px 60px rgba(30, 58, 138, 0.2),
                0 0 40px rgba(59, 130, 246, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.8);
        }

        .menu-item i {
            font-size: 3rem;
            color: #3b82f6;
            filter: drop-shadow(0 4px 10px rgba(59, 130, 246, 0.3));
        }

        .menu-item span {
            font-size: 1.1rem;
            font-weight: 600;
            color: #1e3a8a;
        }
    </style>
</head>
<body>
    <!-- Luzes neon -->
    <div class="neon-glow neon-1"></div>
    <div class="neon-glow neon-2"></div>

    <!-- Sidebar -->
    <div id="sidebar-container"></div>

    <!-- Conteúdo principal -->
    <div class="main-content-empresa">
        <!-- Cabeçalho do usuário -->
        <div style="overflow: hidden; margin-bottom: 30px;">
            <div class="user-header">
                <img id="user-foto" src="" alt="Foto" class="user-avatar" style="display: none;">
                <div id="user-foto-placeholder" class="user-avatar-placeholder">
                    <i class="fas fa-user"></i>
                </div>
                <span id="user-name" class="user-name">Carregando...</span>
            </div>
        </div>

        <!-- Título -->
        <h1 class="welcome-title">Bem-vindo ao Painel</h1>
        <p class="welcome-subtitle">Portal Operacional: <span id="empresa-nome-painel">Carregando...</span></p>

        <!-- Cards de menu -->
        <div class="grid-menu">
            <a href="acompanhamento-devolucoes.html" class="menu-item">
                <i class="fas fa-undo-alt"></i>
                <span>Acompanhamento de Devoluções</span>
            </a>
            <a href="consulta-importacoes.html" class="menu-item">
                <i class="fas fa-database"></i>
                <span>Consultar Bancos Importados</span>
            </a>
            <!-- Adicione mais cards aqui quando criar novos módulos -->
        </div>
    </div>

    <script src="script.js"></script>
    <script src="sidebar-empresa.js"></script>
    <script>
        // Carregar dados do usuário e da empresa
        async function carregarDados() {
            const db = window.supabaseClient;
            if (!db) return;
            
            const userId = localStorage.getItem('userId');
            const empresaId = localStorage.getItem('empresaId');
            
            // Carrega usuário
            if (userId) {
                const { data: user } = await db.from('usuarios').select('*').eq('id', userId).single();
                if (user) {
                    document.getElementById('user-name').textContent = user.nome;
                    if (user.foto) {
                        document.getElementById('user-foto').src = user.foto;
                        document.getElementById('user-foto').style.display = 'block';
                        document.getElementById('user-foto-placeholder').style.display = 'none';
                    }
                }
            }
            
            // Carrega empresa
            if (empresaId) {
                const { data: empresa } = await db.from('empresas').select('*').eq('id', empresaId).single();
                if (empresa) {
                    document.getElementById('empresa-nome-painel').textContent = empresa.razao;
                }
            }
        }

        // Inicialização
        document.addEventListener('DOMContentLoaded', () => {
            const wait = setInterval(() => {
                if (window.supabaseClient) {
                    clearInterval(wait);
                    carregarDados();
                }
            }, 200);
        });
    </script>
</body>
</html>
