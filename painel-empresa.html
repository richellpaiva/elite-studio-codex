<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel da Empresa</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <script>
        if (localStorage.getItem('isLoggedIn') !== 'true') window.location.href = 'index.html';
    </script>

    <!-- Container da sidebar (será preenchido pelo sidebar-empresa.js) -->
    <div id="sidebar-container"></div>

    <!-- Conteúdo principal -->
    <div class="main-content-empresa" style="padding: 40px; transition: margin-left 0.3s ease;">
        <!-- Cabeçalho do usuário -->
        <div style="display: flex; justify-content: flex-end; margin-bottom: 30px;">
            <div style="display: flex; align-items: center; gap: 10px; background: rgba(255,255,255,0.7); padding: 6px 14px; border-radius: 30px; border: 1px solid rgba(59,130,246,0.2);">
                <img id="user-foto" src="" alt="Foto" style="width: 35px; height: 35px; border-radius: 50%; object-fit: cover; display: none;">
                <div id="user-foto-placeholder" style="width: 35px; height: 35px; border-radius: 50%; background: #e0f2fe; display: flex; align-items: center; justify-content: center; color: #3b82f6;">
                    <i class="fas fa-user"></i>
                </div>
                <span id="user-name" style="color: #1e3a8a; font-weight: 600; font-size: 0.9rem;">Carregando...</span>
            </div>
        </div>

        <h1 style="color: #1e3a8a; margin-bottom: 20px;">Bem-vindo ao Portal da Empresa</h1>
        <p style="color: #64748b;">Selecione uma opção no menu lateral para começar.</p>

        <!-- Cards de atalho (opcional) -->
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-top: 40px;">
            <a href="acompanhamento-devolucoes.html" class="menu-item">
                <i class="fas fa-undo-alt"></i>
                <span>Acompanhamento de Devoluções</span>
            </a>
            <!-- Adicione mais cards aqui -->
        </div>
    </div>

    <script src="script.js"></script>
    <script src="sidebar-empresa.js"></script>
    <script>
        async function carregarUsuario() {
            const db = window.supabaseClient;
            if (!db) return;
            const userId = localStorage.getItem('userId');
            if (!userId) return;
            const { data, error } = await db.from('usuarios').select('*').eq('id', userId).single();
            if (error) return;
            if (data) {
                document.getElementById('user-name').textContent = data.nome;
                if (data.foto) {
                    const img = document.getElementById('user-foto');
                    img.src = data.foto;
                    img.style.display = 'block';
                    document.getElementById('user-foto-placeholder').style.display = 'none';
                }
            }
        }

        document.addEventListener('DOMContentLoaded', carregarUsuario);
    </script>
</body>
</html>
