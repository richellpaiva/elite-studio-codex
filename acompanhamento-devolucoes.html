<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acompanhamento de Devoluções</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        .modal-filtro-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(30,58,138,0.4); backdrop-filter: blur(6px); z-index: 9998; display: none; align-items: center; justify-content: center; }
        .modal-filtro-box { background: #fff; border-radius: 24px; padding: 30px; max-width: 600px; width: 95%; max-height: 80vh; display: flex; flex-direction: column; box-shadow: 0 20px 60px rgba(31,38,135,0.3); border: 1px solid rgba(59,130,246,0.2); }
        .modal-filtro-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 1px solid #e0f2fe; padding-bottom: 10px; }
        .modal-filtro-header h3 { margin: 0; color: #1e3a8a; }
        .modal-filtro-box input[type="text"] { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #cbd5e1; margin-bottom: 15px; }
        .modal-filtro-lista { max-height: 300px; overflow-y: auto; flex: 1; margin-bottom: 15px; border: 1px solid #e0f2fe; border-radius: 8px; padding: 10px; }
        .modal-filtro-lista label { display: flex; align-items: flex-start; gap: 12px; padding: 12px 10px; border-bottom: 1px solid #f1f5f9; cursor: pointer; font-size: 0.95rem; color: #1e3a8a; line-height: 1.4; word-break: normal; text-align: left; }
        .modal-filtro-lista label:hover { background: #e0f2fe; }
        .modal-filtro-lista input[type="checkbox"] { width: 24px; height: 24px; margin-top: 2px; flex-shrink: 0; cursor: pointer; accent-color: #3b82f6; }
        .modal-filtro-botoes { display: flex; justify-content: flex-end; gap: 10px; margin-top: auto; }
        .btn-acao { padding: 10px 20px; border-radius: 8px; cursor: pointer; border: none; font-weight: 600; }
        .btn-azul { background: #3b82f6; color: white; }
        .btn-cinza { background: #e2e8f0; color: #1e3a8a; }
        .btn-verde { background: #10b981; color: white; }
        .btn-vermelho { background: #ef4444; color: white; }
        .paginacao { display: flex; align-items: center; gap: 15px; margin-top: 15px; justify-content: center; }
    </style>
</head>
<body>
    <script>
        if (localStorage.getItem('isLoggedIn') !== 'true') window.location.href = 'index.html';
    </script>

    <div id="sidebar-container"></div>
    <div class="main-content-empresa" style="padding: 40px; transition: margin-left 0.3s ease;">
        <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; margin-bottom: 20px;">
            <h1 style="color: #1e3a8a;">Acompanhamento de Devoluções</h1>
            <div style="display: flex; gap: 10px; flex-wrap: wrap;">
                <button onclick="document.getElementById('fileInput').click()" class="btn-primary" style="padding: 10px 20px;"><i class="fas fa-folder-open"></i> Selecionar Planilhas</button>
                <button onclick="processarArquivos()" class="btn-verde" style="padding: 10px 20px; border: none; border-radius: 8px; cursor: pointer;"><i class="fas fa-upload"></i> Importar Arquivos</button>
                <button onclick="substituirTudo()" class="btn-vermelho" style="padding: 10px 20px; border: none; border-radius: 8px; cursor: pointer;"><i class="fas fa-trash-alt"></i> Substituir Tudo</button>
                <button onclick="exportarExcel()" class="btn-verde" style="padding: 10px 20px; border: none; border-radius: 8px; cursor: pointer;"><i class="fas fa-file-excel"></i> Baixar Excel</button>
            </div>
        </div>
        <input type="file" id="fileInput" accept=".xls,.xlsx" multiple style="display: none;" onchange="adicionarArquivos(event)">
        <div id="status-importacao" style="margin-bottom: 15px; color: #1e3a8a; font-weight: 600; background: rgba(255,255,255,0.6); padding: 10px; border-radius: 8px;"></div>

        <div style="margin-bottom: 15px;">
            <button onclick="toggleFiltros()" class="btn-outline" style="display: flex; align-items: center; gap: 8px; padding: 10px 20px;">
                <i class="fas fa-filter" id="icone-filtro"></i> <span id="texto-filtro">Mostrar Filtros</span>
            </button>
        </div>

        <div id="painel-filtros" style="display: none; background: rgba(255,255,255,0.7); backdrop-filter: blur(10px); border-radius: 16px; padding: 20px; margin-bottom: 20px;">
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                <div><label style="font-weight: 600; font-size: 0.9rem; color: #64748b;">Data Inicial</label><input type="date" id="filtro_data_inicio" style="width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px;"></div>
                <div><label style="font-weight: 600; font-size: 0.9rem; color: #64748b;">Data Final</label><input type="date" id="filtro_data_fim" style="width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px;"></div>
            </div>
            <div style="display: flex; flex-wrap: wrap; gap: 10px; margin-top: 20px;">
                <button onclick="abrirModalFiltro('fornecedor')" class="btn-acao btn-cinza" style="flex: 1; min-width: 150px;"><i class="fas fa-truck"></i> Fornecedores</button>
                <button onclick="abrirModalFiltro('fornecedor_principal')" class="btn-acao btn-cinza" style="flex: 1; min-width: 150px;"><i class="fas fa-building"></i> Fornecedor Principal</button>
                <button onclick="abrirModalFiltro('codprod')" class="btn-acao btn-cinza" style="flex: 1; min-width: 150px;"><i class="fas fa-barcode"></i> Código Produto</button>
                <button onclick="abrirModalFiltro('descricao')" class="btn-acao btn-cinza" style="flex: 2; min-width: 250px;"><i class="fas fa-box"></i> Descrição</button>
                <button onclick="abrirModalFiltro('motivo')" class="btn-acao btn-cinza" style="flex: 1; min-width: 150px;"><i class="fas fa-comment"></i> Motivo</button>
                <button onclick="abrirModalFiltro('nomerca')" class="btn-acao btn-cinza" style="flex: 1; min-width: 150px;"><i class="fas fa-user"></i> Vendedores</button>
                <button onclick="abrirModalFiltro('nomesup')" class="btn-acao btn-cinza" style="flex: 1; min-width: 150px;"><i class="fas fa-user-tie"></i> Supervisores</button>
                <button onclick="abrirModalFiltro('motorista')" class="btn-acao btn-cinza" style="flex: 1; min-width: 150px;"><i class="fas fa-id-card"></i> Motoristas</button>
                <button onclick="abrirModalFiltro('rota')" class="btn-acao btn-cinza" style="flex: 1; min-width: 150px;"><i class="fas fa-route"></i> Rotas</button>
                <button onclick="abrirModalFiltro('placa')" class="btn-acao btn-cinza" style="flex: 1; min-width: 150px;"><i class="fas fa-car"></i> Placas</button>
            </div>
            <div style="display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px;">
                <button onclick="limparFiltros()" class="btn-acao btn-cinza"><i class="fas fa-eraser"></i> Limpar Filtros</button>
                <button onclick="executarFiltros()" class="btn-acao btn-azul"><i class="fas fa-play"></i> Executar Filtros</button>
            </div>
        </div>

        <div style="background: rgba(255,255,255,0.7); backdrop-filter: blur(10px); border-radius: 16px; padding: 20px;">
            <div style="max-height: 550px; overflow-y: auto; overflow-x: auto; border: 1px solid #e0f2fe; border-radius: 12px;">
                <table style="width: 100%; border-collapse: collapse; text-align: left;">
                    <thead id="thead-tabela" style="position: sticky; top: 0; background: linear-gradient(135deg, #3b82f6, #2563eb); color: white; z-index: 10;"></thead>
                    <tbody id="tabela-devolucoes"></tbody>
                </table>
            </div>
            <div class="paginacao">
                <button onclick="mudarPagina(-1)" class="btn-acao btn-cinza"><i class="fas fa-chevron-left"></i> Anterior</button>
                <span id="info-pagina" style="color: #1e3a8a; font-weight: 600;">Página 1 de 1</span>
                <button onclick="mudarPagina(1)" class="btn-acao btn-cinza">Próxima <i class="fas fa-chevron-right"></i></button>
            </div>
        </div>
    </div>

    <div id="overlay-carregamento" style="display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(255,255,255,0.85); backdrop-filter: blur(8px); z-index: 9999; align-items: center; justify-content: center; flex-direction: column;">
        <div style="width: 120px; height: 120px; position: relative;">
            <svg viewBox="0 0 100 100" style="width: 100%; height: 100%; transform: rotate(-90deg);">
                <circle cx="50" cy="50" r="40" fill="none" stroke="#e0f2fe" stroke-width="8"/>
                <circle id="barra-progresso" cx="50" cy="50" r="40" fill="none" stroke="#3b82f6" stroke-width="8" stroke-dasharray="251.2" stroke-dashoffset="251.2" stroke-linecap="round"/>
            </svg>
            <span id="percentual-carregamento" style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 1.4rem; font-weight: 700; color: #1e3a8a;">0%</span>
        </div>
        <p style="color: #1e3a8a; font-weight: 500; margin-top: 20px;" id="texto-carregamento">Carregando...</p>
    </div>

    <div id="modal-filtro-overlay" class="modal-filtro-overlay">
        <div class="modal-filtro-box">
            <div class="modal-filtro-header">
                <h3 id="modal-filtro-titulo">Filtro</h3>
                <button onclick="fecharModalFiltro()" style="background: transparent; border: none; font-size: 1.5rem; cursor: pointer; color: #64748b;">&times;</button>
            </div>
            <input type="text" id="modal-filtro-busca" placeholder="Digite para buscar..." oninput="filtrarOpcoesModal()">
            <div id="modal-filtro-lista" class="modal-filtro-lista"></div>
            <div class="modal-filtro-botoes">
                <button onclick="selecionarTodosModal()" class="btn-acao btn-cinza">Todos</button>
                <button onclick="limparSelecaoModal()" class="btn-acao btn-cinza">Limpar</button>
                <button onclick="fecharModalFiltro()" class="btn-acao btn-azul">Concluir</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
    <script src="sidebar-empresa.js"></script>
    <script>
        // Definição das colunas (incluindo fornecedor_principal)
        const COLUNAS = [
            { key: 'codfornec', label: 'COD_FORNEC', tipo: 'inteiro' },
            { key: 'fornecedor', label: 'FORNECEDOR', tipo: 'texto' },
            { key: 'fornecedor_principal', label: 'FORNEC_PRINCIPAL', tipo: 'texto' },
            { key: 'numped', label: 'NUMPED', tipo: 'inteiro' },
            { key: 'numnota', label: 'NUMNOTA', tipo: 'inteiro' },
            { key: 'chavenfedev', label: 'CHAVE_NFE_DEV', tipo: 'texto' },
            { key: 'dtent', label: 'DT_ENT', tipo: 'data' },
            { key: 'codcli', label: 'COD_CLI', tipo: 'inteiro' },

        ];

        const FILTROS_DROPDOWN = [
            { titulo: 'Fornecedores', coluna: 'fornecedor' },

            { titulo: 'Código Produto', coluna: 'codprod' },

            { titulo: 'Motivo', coluna: 'motivo' },
            { titulo: 'Vendedores', coluna: 'nomerca' },
            { titulo: 'Supervisores', coluna: 'nomesup' },
            { titulo: 'Motoristas', coluna: 'motorista' },
            { titulo: 'Rotas', coluna: 'rota' },
            { titulo: 'Placas', coluna: 'placa' }
        ];

        let listaArquivos = [];
        let todosDados = [];
        let todosFiltrados = [];
        let paginaAtual = 1;
        let totalRegistros = 0;
        const POR_PAGINA = 200;
        let filtrosSelecionados = {};
        let filtroAtual = null;
        let sortState = { col: null, asc: true };

        // (Todas as funções de carregamento, filtro, ordenação etc. permanecem iguais)
        // ...
        // ================== IMPORTAÇÃO ==================
        // Na função mapearLinha, adicione a extração:
        function mapearLinha(linha, empresaId) {
            const fornecedor = linha[1] ? String(linha[1]).trim() : '';
            const fornecedorPrincipal = fornecedor ? fornecedor.split(' ')[0] : '';
            return {
                empresa_id: empresaId,
                codfornec: linha[0] || '',
                fornecedor: fornecedor,
                fornecedor_principal: fornecedorPrincipal,
                // ... resto dos campos
                numped: linha[2] || '',
                numnota: linha[3] || '',

                numcarregamento: linha[15] || '',
                codprod: linha[16] || '',
                descricao: linha[17] || '',
                embalagem: linha[18] || '',
                qt: linha[19] || '',
                punit: linha[20] || '',
                custoultent: linha[21] || '',
                vltotal: linha[22] || '',
                nomefunc: linha[23] || '',
                motivo: linha[24] || '',
                numbonus: linha[25] || '',
                codfuncfecha: linha[26] || '',
                nome: linha[27] || '',
                codmotorista: linha[28] || '',

                codrota: linha[30] || '',
                rota: linha[31] || '',
                veiculo: linha[32] || '',
                placa: linha[33] || ''
            };
        }
        // ... (restante do código de importação, filtros, paginação, etc. permanece igual)
    </script>
</body>
</html>
