<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Análises - Auditoria</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
    <!-- Proteção de rota: se não estiver logado, volta pro login -->
    <script>
        if (localStorage.getItem('isLoggedIn') !== 'true') {
            window.location.href = 'index.html';
        }
    </script>

    <!-- Marca D'água e fundo tecnológico mantidos pelo style.css -->
    <div class="watermark"></div>

    <!-- Conteúdo da página -->
    <div class="container-center" style="justify-content: flex-start; padding-top: 80px;">
        
        <!-- Botão Voltar (Minimalista e em vidro para combinar com o tema) -->
        <a href="home.html" style="position: absolute; top: 25px; left: 30px; color: rgba(255,255,255,0.6); text-decoration: none; transition: 0.3s; border: 1px solid var(--border-glow); padding: 10px 18px; border-radius: 50px; background: var(--bg-card); backdrop-filter: blur(10px); display: flex; align-items: center; gap: 8px; font-weight: 500;">
            <i class="fas fa-arrow-left"></i> Voltar
        </a>

        <!-- Painel Central com estilo Glassmorphism -->
        <div style="background: var(--bg-card); backdrop-filter: blur(12px); padding: 50px 40px; border-radius: 24px; max-width: 600px; width: 100%; border: 1px solid var(--border-glow); box-shadow: 0 20px 60px rgba(0,0,0,0.5); position: relative; z-index: 1; text-align: center;">
            
            <div style="margin-bottom: 20px;">
                <!-- Ícone com efeito de brilho/neon -->
                <i class="fas fa-chart-bar" style="font-size: 60px; color: var(--color-secondary); text-shadow: 0 0 30px rgba(59, 130, 246, 0.2); margin-bottom: 15px;"></i>
                <h2 style="color: #fff; font-size: 2rem; margin-bottom: 10px;">Análises</h2>
                <p style="color: rgba(255,255,255,0.5); font-weight: 300;">
                    Esta seção está em desenvolvimento.
                </p>
            </div>

            <div style="border-top: 1px solid rgba(255,255,255,0.05); padding-top: 20px; margin-top: 20px;">
                <p style="color: rgba(255,255,255,0.3); font-size: 0.9rem;">
                    Em breve, painéis gráficos dinâmicos e filtros inteligentes.
                </p>
                <button onclick="window.location.href='home.html'" class="btn-outline" style="margin-top: 20px; width: 100%; justify-content: center;">
                    <i class="fas fa-home"></i> Ir para Início
                </button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
