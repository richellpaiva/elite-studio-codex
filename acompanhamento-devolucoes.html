<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acompanhamento de Devoluções</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        /* Estilos adicionais para os modais de filtro */
        .modal-filtro-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(30, 58, 138, 0.4); backdrop-filter: blur(6px);
            z-index: 9998; display: none; align-items: center; justify-content: center;
        }
        .modal-filtro-box {
            background: #fff; border-radius: 24px; padding: 30px; max-width: 500px;
            width: 95%; max-height: 80vh; display: flex; flex-direction: column;
            box-shadow: 0 20px 60px rgba(31, 38, 135, 0.3); border: 1px solid rgba(59,130,246,0.2);
        }
        .modal-filtro-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 15px; border-bottom: 1px solid #e0f2fe; padding-bottom: 10px;
        }
        .modal-filtro-header h3 { margin: 0; color: #1e3a8a; }
        .modal-filtro-box input[type="text"] {
            width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #cbd5e1; margin-bottom: 15px;
        }
        .modal-filtro-lista {
            max-height: 300px; overflow-y: auto; flex: 1; margin-bottom: 15px;
            border: 1px solid #e0f2fe; border-radius: 8px; padding: 10px;
        }
        .modal-filtro-lista label {
            display: flex; align-items: center; gap: 10px; padding: 8px;
            border-bottom: 1px solid #f1f5f9; cursor: pointer; font-size: 1rem; color: #1e3a8a;
        }
        .modal-filtro-lista label:hover { background: #e0f2fe; }
        .modal-filtro-botoes {
            display: flex; justify-content: flex-end; gap: 10px; margin-top: auto;
        }
        .btn-acao { padding: 10px 20px; border-radius: 8px; cursor: pointer; border: none; font-weight: 600; }
        .btn-azul { background: #3b82f6; color: white; }
        .btn-azul:hover { background: #2563eb; }
        .btn-cinza { background: #e2e8f0; color: #1e3a8a; }
        .btn-cinza:hover { background: #cbd5e1; }
        .btn-vermelho { background: #ef4444; color: white; }
    </style>
</head>
<body>
    <script>
        if (localStorage.getItem('isLoggedIn') !== 'true') window.location.href = 'index.html';
    </script>

    <!-- Sidebar -->
    <div id="sidebar-container"></div>

    <!-- Conteúdo principal -->
    <div class="main-content-empresa" style="padding: 40px; transition: margin-left 0.3s ease;">
        <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; margin-bottom: 20px;">
            <h1 style="color: #1e3a8a;">Acompanhamento de Devoluções</h1>
            <div style="display: flex; gap: 10px; flex-wrap: wrap;">
                <button onclick="document.getElementById('fileInput').click()" class="btn-primary" style="padding: 10px 20px;">
                    <i class="fas fa-folder-open"></i> Selecionar Planilhas
                </button>
                <button onclick="processarArquivos()" style="padding: 10px 20px; background: linear-gradient(135deg, #22c55e, #16a34a); color: white; border: none; border-radius: 8px; cursor: pointer;">
                    <i class="fas fa-upload"></i> Importar Arquivos
                </button>
                <button onclick="substituirTudo()" style="padding: 10px 20px; background: linear-gradient(135deg, #ef4444, #dc2626); color: white; border: none; border-radius: 8px; cursor: pointer;">
                    <i class="fas fa-trash-alt"></i> Substituir Tudo
                </button>
            </div>
        </div>
        <input type="file" id="fileInput" accept=".xls,.xlsx" multiple style="display: none;" onchange="adicionarArquivos(event)">
        <div id="status-importacao" style="margin-bottom: 15px; color: #1e3a8a; font-weight: 600; background: rgba(255,255,255,0.6); padding: 10px; border-radius: 8px;"></div>

        <!-- Botão para exibir/ocultar filtros -->
        <div style="margin-bottom: 15px;">
            <button onclick="toggleFiltros()" class="btn-outline" style="display: flex; align-items: center; gap: 8px; padding: 10px 20px;">
                <i class="fas fa-filter" id="icone-filtro"></i> <span id="texto-filtro">Mostrar Filtros</span>
            </button>
        </div>

        <!-- Painel de Filtros (oculto por padrão) -->
        <div id="painel-filtros" style="display: none; background: rgba(255,255,255,0.7); backdrop-filter: blur(10px); border-radius: 16px; padding: 20px; margin-bottom: 20px;">
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                <div>
                    <label style="font-weight: 600; font-size: 0.9rem; color: #64748b;">Data Inicial</label>
                    <input type="date" id="filtro_data_inicio" style="width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px;">
                </div>
                <div>
                    <label style="font-weight: 600; font-size: 0.9rem; color: #64748b;">Data Final</label>
                    <input type="date" id="filtro_data_fim" style="width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px;">
                </div>
            </div>
            <div style="display: flex; flex-wrap: wrap; gap: 10px; margin-top: 20px;">
                <!-- Botões para abrir modais de filtro -->
                <button onclick="abrirModalFiltro('fornecedor')" class="btn-acao btn-cinza" style="flex: 1; min-width: 150px;"><i class="fas fa-truck"></i> Fornecedores</button>
                <button onclick="abrirModalFiltro('codprod')" class="btn-acao btn-cinza" style="flex: 1; min-width: 150px;"><i class="fas fa-barcode"></i> Código Produto</button>
                <button onclick="abrirModalFiltro('descricao')" class="btn-acao btn-cinza" style="flex: 1; min-width: 150px;"><i class="fas fa-box"></i> Descrição</button>
                <button onclick="abrirModalFiltro('motivo')" class="btn-acao btn-cinza" style="flex: 1; min-width: 150px;"><i class="fas fa-comment"></i> Motivo</button>
                <button onclick="abrirModalFiltro('nomerca')" class="btn-acao btn-cinza" style="flex: 1; min-width: 150px;"><i class="fas fa-user"></i> Vendedores</button>
                <button onclick="abrirModalFiltro('nomesup')" class="btn-acao btn-cinza" style="flex: 1; min-width: 150px;"><i class="fas fa-user-tie"></i> Supervisores</button>
                <button onclick="abrirModalFiltro('motorista')" class="btn-acao btn-cinza" style="flex: 1; min-width: 150px;"><i class="fas fa-id-card"></i> Motoristas</button>
                <button onclick="abrirModalFiltro('rota')" class="btn-acao btn-cinza" style="flex: 1; min-width: 150px;"><i class="fas fa-route"></i> Rotas</button>
                <button onclick="abrirModalFiltro('placa')" class="btn-acao btn-cinza" style="flex: 1; min-width: 150px;"><i class="fas fa-car"></i> Placas</button>
            </div>
            <div style="display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px;">
                <button onclick="limparFiltros()" class="btn-acao btn-cinza"><i class="fas fa-eraser"></i> Limpar Filtros</button>
                <button onclick="executarFiltros()" class="btn-acao btn-azul"><i class="fas fa-play"></i> Executar Filtros</button>
            </div>
        </div>

        <!-- TABELA -->
        <div style="background: rgba(255,255,255,0.7); backdrop-filter: blur(10px); border-radius: 16px; padding: 20px;">
            <div style="max-height: 550px; overflow-y: auto; overflow-x: auto; border: 1px solid #e0f2fe; border-radius: 12px;">
                <table style="width: 100%; border-collapse: collapse; text-align: left;">
                    <thead id="thead-tabela" style="position: sticky; top: 0; background: linear-gradient(135deg, #3b82f6, #2563eb); color: white; z-index: 10;"></thead>
                    <tbody id="tabela-devolucoes"></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Overlay de carregamento circular -->
    <div id="overlay-carregamento" style="display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(255,255,255,0.85); backdrop-filter: blur(8px); z-index: 9999; align-items: center; justify-content: center; flex-direction: column;">
        <div style="width: 120px; height: 120px; position: relative;">
            <svg viewBox="0 0 100 100" style="width: 100%; height: 100%; transform: rotate(-90deg);">
                <circle cx="50" cy="50" r="40" fill="none" stroke="#e0f2fe" stroke-width="8"/>
                <circle id="barra-progresso" cx="50" cy="50" r="40" fill="none" stroke="#3b82f6" stroke-width="8" stroke-dasharray="251.2" stroke-dashoffset="251.2" stroke-linecap="round"/>
            </svg>
            <span id="percentual-carregamento" style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 1.4rem; font-weight: 700; color: #1e3a8a;">0%</span>
        </div>
        <p style="color: #1e3a8a; font-weight: 500; margin-top: 20px;" id="texto-carregamento">Carregando...</p>
    </div>

    <!-- Overlay do modal de filtro -->
    <div id="modal-filtro-overlay" class="modal-filtro-overlay">
        <div class="modal-filtro-box">
            <div class="modal-filtro-header">
                <h3 id="modal-filtro-titulo">Filtro</h3>
                <button onclick="fecharModalFiltro()" style="background: transparent; border: none; font-size: 1.5rem; cursor: pointer; color: #64748b;">&times;</button>
            </div>
            <input type="text" id="modal-filtro-busca" placeholder="Digite para buscar..." oninput="filtrarOpcoesModal()">
            <div id="modal-filtro-lista" class="modal-filtro-lista"></div>
            <div class="modal-filtro-botoes">
                <button onclick="selecionarTodosModal()" class="btn-acao btn-cinza">Todos</button>
                <button onclick="limparSelecaoModal()" class="btn-acao btn-cinza">Limpar</button>
                <button onclick="fecharModalFiltro()" class="btn-acao btn-azul">Concluir</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
    <script src="sidebar-empresa.js"></script>
    <script>
        // Definição das colunas (todas as 34)
        const COLUNAS = [
            { key: 'codfornec', label: 'COD_FORNEC' }, { key: 'fornecedor', label: 'FORNECEDOR' },
            { key: 'numped', label: 'NUMPED' }, { key: 'numnota', label: 'NUMNOTA' },
            { key: 'chavenfedev', label: 'CHAVE_NFE_DEV' }, { key: 'dtent', label: 'DT_ENT' },
            { key: 'codcli', label: 'COD_CLI' }, { key: 'cpfcnpj', label: 'CPF_CNPJ' },
            { key: 'cliente', label: 'CLIENTE' }, { key: 'codrca', label: 'COD_RCA' },
            { key: 'nomerca', label: 'NOME_RCA' }, { key: 'codsupervisor', label: 'COD_SUP' },
            { key: 'nomesup', label: 'NOME_SUP' }, { key: 'numnotaven', label: 'NUMNOTAVEN' },
            { key: 'chavenfevend', label: 'CHAVE_NFE_VEND' }, { key: 'numcarregamento', label: 'NUM_CARREG' },
            { key: 'codprod', label: 'COD_PROD' }, { key: 'descricao', label: 'DESCRICAO' },
            { key: 'embalagem', label: 'EMBALAGEM' }, { key: 'qt', label: 'QT' },
            { key: 'punit', label: 'P_UNIT' }, { key: 'custoultent', label: 'CUSTO_ULT_ENT' },
            { key: 'vltotal', label: 'VL_TOTAL' }, { key: 'nomefunc', label: 'NOME_FUNC' },
            { key: 'motivo', label: 'MOTIVO' }, { key: 'numbonus', label: 'NUM_BONUS' },
            { key: 'codfuncfecha', label: 'COD_FUNC_FECHA' }, { key: 'nome', label: 'NOME' },
            { key: 'codmotorista', label: 'COD_MOTORISTA' }, { key: 'motorista', label: 'MOTORISTA' },
            { key: 'codrota', label: 'COD_ROTA' }, { key: 'rota', label: 'ROTA' },
            { key: 'veiculo', label: 'VEICULO' }, { key: 'placa', label: 'PLACA' }
        ];

        const FILTROS_DROPDOWN = [
            { titulo: 'Fornecedores', coluna: 'fornecedor' },
            { titulo: 'Código Produto', coluna: 'codprod' },
            { titulo: 'Descrição', coluna: 'descricao' },
            { titulo: 'Motivo', coluna: 'motivo' },
            { titulo: 'Vendedores', coluna: 'nomerca' },
            { titulo: 'Supervisores', coluna: 'nomesup' },
            { titulo: 'Motoristas', coluna: 'motorista' },
            { titulo: 'Rotas', coluna: 'rota' },
            { titulo: 'Placas', coluna: 'placa' }
        ];

        let listaArquivos = [];
        let todosDados = [];
        let dadosFiltrados = [];
        let dadosBanco = [];
        let filtrosSelecionados = {}; // Guarda os valores selecionados de cada coluna
        let filtroAtual = null; // Coluna atual do modal

        // ========== FUNÇÕES DE CARREGAMENTO ==========
        function mostrarCarregamento(texto = 'Carregando...') {
            document.getElementById('texto-carregamento').textContent = texto;
            document.getElementById('overlay-carregamento').style.display = 'flex';
            atualizarProgresso(0);
        }
        function atualizarProgresso(percent) {
            const barra = document.getElementById('barra-progresso');
            const texto = document.getElementById('percentual-carregamento');
            const circumference = 251.2;
            const offset = circumference - (percent / 100) * circumference;
            barra.style.strokeDashoffset = offset;
            texto.textContent = percent + '%';
        }
        function ocultarCarregamento() {
            document.getElementById('overlay-carregamento').style.display = 'none';
        }

        // ========== CONTROLE DO PAINEL DE FILTROS ==========
        function toggleFiltros() {
            const painel = document.getElementById('painel-filtros');
            const texto = document.getElementById('texto-filtro');
            const icone = document.getElementById('icone-filtro');
            if (painel.style.display === 'none') {
                painel.style.display = 'block';
                texto.textContent = 'Ocultar Filtros';
                icone.classList.remove('fa-filter');
                icone.classList.add('fa-eye-slash');
            } else {
                painel.style.display = 'none';
                texto.textContent = 'Mostrar Filtros';
                icone.classList.remove('fa-eye-slash');
                icone.classList.add('fa-filter');
            }
        }

        // ========== MODAL DE FILTRO ==========
        function abrirModalFiltro(coluna) {
            const filtro = FILTROS_DROPDOWN.find(f => f.coluna === coluna);
            if (!filtro) return;
            filtroAtual = coluna;
            document.getElementById('modal-filtro-titulo').textContent = 'Filtrar: ' + filtro.titulo;
            document.getElementById('modal-filtro-busca').value = '';
            // Popula a lista com as opções
            const valores = [...new Set(dadosBanco.map(item => item[coluna]).filter(v => v && v !== ''))].sort();
            const lista = document.getElementById('modal-filtro-lista');
            lista.innerHTML = '';
            const selecionados = filtrosSelecionados[coluna] || [];
            valores.forEach(val => {
                const label = document.createElement('label');
                const cb = document.createElement('input');
                cb.type = 'checkbox';
                cb.value = val;
                cb.checked = selecionados.includes(val);
                cb.onchange = () => atualizarSelecaoModal();
                label.appendChild(cb);
                label.appendChild(document.createTextNode(' ' + val));
                lista.appendChild(label);
            });
            document.getElementById('modal-filtro-overlay').style.display = 'flex';
        }

        function fecharModalFiltro() {
            document.getElementById('modal-filtro-overlay').style.display = 'none';
            filtroAtual = null;
        }

        function filtrarOpcoesModal() {
            const termo = document.getElementById('modal-filtro-busca').value.toLowerCase();
            const lista = document.getElementById('modal-filtro-lista');
            const labels = lista.querySelectorAll('label');
            labels.forEach(label => {
                const texto = label.textContent.toLowerCase();
                label.style.display = texto.includes(termo) ? 'flex' : 'none';
            });
        }

        function atualizarSelecaoModal() {
            const lista = document.getElementById('modal-filtro-lista');
            const checkboxes = lista.querySelectorAll('input[type="checkbox"]:checked');
            const valores = Array.from(checkboxes).map(cb => cb.value);
            if (filtroAtual) {
                filtrosSelecionados[filtroAtual] = valores;
            }
        }

        function selecionarTodosModal() {
            const lista = document.getElementById('modal-filtro-lista');
            const checkboxes = lista.querySelectorAll('input[type="checkbox"]');
            checkboxes.forEach(cb => cb.checked = true);
            atualizarSelecaoModal();
        }

        function limparSelecaoModal() {
            const lista = document.getElementById('modal-filtro-lista');
            const checkboxes = lista.querySelectorAll('input[type="checkbox"]');
            checkboxes.forEach(cb => cb.checked = false);
            atualizarSelecaoModal();
        }

        // ========== EXECUTAR FILTROS ==========
        async function executarFiltros() {
            mostrarCarregamento('Aplicando filtros...');
            await new Promise(r => setTimeout(r, 50));

            const dataInicio = document.getElementById('filtro_data_inicio').value;
            const dataFim = document.getElementById('filtro_data_fim').value;

            let filtrados = todosDados.filter(item => {
                if (dataInicio && item.dtent < dataInicio) return false;
                if (dataFim && item.dtent > dataFim) return false;
                for (const filtro of FILTROS_DROPDOWN) {
                    const coluna = filtro.coluna;
                    const selecionados = filtrosSelecionados[coluna] || [];
                    if (selecionados.length > 0 && !selecionados.includes(item[coluna])) {
                        return false;
                    }
                }
                return true;
            });

            dadosFiltrados = filtrados;
            await renderizarTabela(dadosFiltrados);
            ocultarCarregamento();
        }

        function limparFiltros() {
            document.getElementById('filtro_data_inicio').value = '';
            document.getElementById('filtro_data_fim').value = '';
            filtrosSelecionados = {};
            // Fecha o modal se estiver aberto
            fecharModalFiltro();
            dadosFiltrados = todosDados;
            renderizarTabela(dadosFiltrados);
        }

        // ========== RENDERIZAR TABELA ==========
        function renderizarTabela(dados) {
            const thead = document.getElementById('thead-tabela');
            const tbody = document.getElementById('tabela-devolucoes');
            thead.innerHTML = '<tr>' + COLUNAS.map(col => `<th style="padding: 12px; font-weight: 600; white-space: nowrap;">${col.label}</th>`).join('') + '</tr>';
            tbody.innerHTML = '';
            if (dados.length === 0) {
                tbody.innerHTML = `<tr><td colspan="${COLUNAS.length}" style="text-align: center; padding: 20px; color: #64748b;">Nenhum registro encontrado</td></tr>`;
                return;
            }
            dados.forEach(item => {
                const tr = document.createElement('tr');
                tr.style.borderBottom = '1px solid rgba(59,130,246,0.1)';
                tr.innerHTML = COLUNAS.map(col => `<td style="padding: 8px; white-space: nowrap;">${item[col.key] || ''}</td>`).join('');
                tbody.appendChild(tr);
            });
        }

        // ========== IMPORTAÇÃO ==========
        function adicionarArquivos(event) {
            const files = Array.from(event.target.files);
            listaArquivos = listaArquivos.concat(files);
            document.getElementById('status-importacao').textContent = `${listaArquivos.length} arquivo(s) selecionado(s). Clique em "Importar Arquivos" ou "Substituir Tudo".`;
            event.target.value = '';
        }
        function detectarCabecalho(matriz) {
            for (let i = 0; i < matriz.length; i++) {
                if (matriz[i] && matriz[i][0] === 'CODFORNEC') return i;
            }
            return 0;
        }
        function mapearLinha(linha, empresaId) {
            return {
                empresa_id: empresaId,
                codfornec: linha[0] || '', fornecedor: linha[1] || '', numped: linha[2] || '', numnota: linha[3] || '',
                chavenfedev: linha[4] || '', dtent: linha[5] || '', codcli: linha[6] || '', cpfcnpj: linha[7] || '',
                cliente: linha[8] || '', codrca: linha[9] || '', nomerca: linha[10] || '', codsupervisor: linha[11] || '',
                nomesup: linha[12] || '', numnotaven: linha[13] || '', chavenfevend: linha[14] || '', numcarregamento: linha[15] || '',
                codprod: linha[16] || '', descricao: linha[17] || '', embalagem: linha[18] || '', qt: linha[19] || '',
                punit: linha[20] || '', custoultent: linha[21] || '', vltotal: linha[22] || '', nomefunc: linha[23] || '',
                motivo: linha[24] || '', numbonus: linha[25] || '', codfuncfecha: linha[26] || '', nome: linha[27] || '',
                codmotorista: linha[28] || '', motorista: linha[29] || '', codrota: linha[30] || '', rota: linha[31] || '',
                veiculo: linha[32] || '', placa: linha[33] || ''
            };
        }
        async function lerArquivos() {
            if (listaArquivos.length === 0) { alert('Nenhum arquivo selecionado.'); return []; }
            const empresaId = localStorage.getItem('empresaId');
            let todasLinhas = [];
            for (let i = 0; i < listaArquivos.length; i++) {
                const file = listaArquivos[i];
                document.getElementById('status-importacao').textContent = `Processando arquivo ${i+1}/${listaArquivos.length}: ${file.name}`;
                try {
                    const data = await file.arrayBuffer();
                    const workbook = XLSX.read(data, { type: 'array' });
                    const sheet = workbook.Sheets[workbook.SheetNames[0]];
                    const matriz = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: '' });
                    const linhaCabecalho = detectarCabecalho(matriz);
                    for (let j = linhaCabecalho + 1; j < matriz.length; j++) {
                        const linha = matriz[j];
                        if (linha && linha[0] !== '' && linha[0] !== undefined && linha[0] !== null) {
                            todasLinhas.push(mapearLinha(linha, empresaId));
                        }
                    }
                } catch (e) {
                    alert('Erro ao ler arquivo ' + file.name + ': ' + e.message);
                    return [];
                }
            }
            return todasLinhas;
        }
        async function processarArquivos() {
            const db = window.supabaseClient;
            if (!db) { alert('Banco não conectado.'); return; }
            const linhas = await lerArquivos();
            if (linhas.length === 0) { document.getElementById('status-importacao').textContent = 'Nenhuma linha válida.'; return; }
            document.getElementById('status-importacao').textContent = `Importando ${linhas.length} registros...`;
            mostrarCarregamento('Importando dados...');
            const CHUNK_SIZE = 500;
            for (let i = 0; i < linhas.length; i += CHUNK_SIZE) {
                const chunk = linhas.slice(i, i + CHUNK_SIZE);
                atualizarProgresso(Math.round(((i + chunk.length) / linhas.length) * 100));
                const { error } = await db.from('devolucoes').insert(chunk);
                if (error) { ocultarCarregamento(); alert('Erro ao inserir: ' + error.message); return; }
            }
            ocultarCarregamento();
            document.getElementById('status-importacao').textContent = `✅ ${linhas.length} registros importados com sucesso!`;
            listaArquivos = [];
            await carregarDevolucoes();
        }
        async function substituirTudo() {
            const db = window.supabaseClient;
            if (!db) { alert('Banco não conectado.'); return; }
            const empresaId = localStorage.getItem('empresaId');
            if (!confirm('⚠️ Isso vai apagar TODOS os dados e importar os arquivos selecionados. Deseja continuar?')) return;
            document.getElementById('status-importacao').textContent = 'Apagando dados antigos...';
            mostrarCarregamento('Apagando dados antigos...');
            const { error } = await db.from('devolucoes').delete().eq('empresa_id', empresaId);
            ocultarCarregamento();
            if (error) { alert('Erro ao apagar: ' + error.message); return; }
            if (listaArquivos.length > 0) { await processarArquivos(); }
            else { document.getElementById('status-importacao').textContent = 'Nenhum arquivo. Dados apagados.'; await carregarDevolucoes(); }
        }

        // ========== CARREGAR DADOS ==========
        async function carregarDevolucoes() {
            const db = window.supabaseClient;
            if (!db) return;
            const empresaId = localStorage.getItem('empresaId');
            mostrarCarregamento('Carregando dados...');
            const { data, error } = await db.from('devolucoes').select('*').eq('empresa_id', empresaId).order('created_at', { ascending: false });
            ocultarCarregamento();
            if (error) { console.error(error); return; }
            todosDados = data || [];
            dadosBanco = [...todosDados];
            dadosFiltrados = [...todosDados];
            renderizarTabela(dadosFiltrados);
        }

        // ========== INICIALIZAÇÃO ==========
        document.addEventListener('DOMContentLoaded', async () => {
            const wait = setInterval(() => {
                if (window.supabaseClient) {
                    clearInterval(wait);
                    carregarDevolucoes();
                }
            }, 200);
        });
    </script>
</body>
</html>
