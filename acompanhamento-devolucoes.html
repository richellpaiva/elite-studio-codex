<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acompanhamento de Devoluções</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        .modal-filtro-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(30,58,138,0.4); backdrop-filter: blur(6px); z-index: 9998; display: none; align-items: center; justify-content: center; }
        .modal-filtro-box { background: #fff; border-radius: 24px; padding: 30px; max-width: 600px; width: 95%; max-height: 80vh; display: flex; flex-direction: column; box-shadow: 0 20px 60px rgba(31,38,135,0.3); border: 1px solid rgba(59,130,246,0.2); }
        .modal-filtro-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 1px solid #e0f2fe; padding-bottom: 10px; }
        .modal-filtro-header h3 { margin: 0; color: #1e3a8a; }
        .modal-filtro-box input[type="text"] { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #cbd5e1; margin-bottom: 15px; }
        .modal-filtro-lista { max-height: 300px; overflow-y: auto; flex: 1; margin-bottom: 15px; border: 1px solid #e0f2fe; border-radius: 8px; padding: 10px; }
        .modal-filtro-lista label { display: flex; align-items: flex-start; gap: 12px; padding: 12px 10px; border-bottom: 1px solid #f1f5f9; cursor: pointer; font-size: 0.95rem; color: #1e3a8a; line-height: 1.4; word-break: normal; text-align: left; }
        .modal-filtro-lista label:hover { background: #e0f2fe; }
        .modal-filtro-lista input[type="checkbox"] { width: 24px; height: 24px; margin-top: 2px; flex-shrink: 0; cursor: pointer; accent-color: #3b82f6; }
        .modal-filtro-botoes { display: flex; justify-content: flex-end; gap: 10px; margin-top: auto; }
        .btn-acao { padding: 10px 20px; border-radius: 8px; cursor: pointer; border: none; font-weight: 600; }
        .btn-azul { background: #3b82f6; color: white; }
        .btn-cinza { background: #e2e8f0; color: #1e3a8a; }
        .btn-verde { background: #10b981; color: white; }
        .btn-vermelho { background: #ef4444; color: white; }
        .paginacao { display: flex; align-items: center; gap: 15px; margin-top: 15px; justify-content: center; }
    </style>
</head>
<body>
    <script>
        if (localStorage.getItem('isLoggedIn') !== 'true') window.location.href = 'index.html';
    </script>

    <div id="sidebar-container"></div>
    <div class="main-content-empresa" style="padding: 40px; transition: margin-left 0.3s ease;">
        <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; margin-bottom: 20px;">
            <h1 style="color: #1e3a8a;">Acompanhamento de Devoluções</h1>
            <div style="display: flex; gap: 10px; flex-wrap: wrap;">
                <button onclick="document.getElementById('fileInput').click()" class="btn-primary" style="padding: 10px 20px;"><i class="fas fa-folder-open"></i> Selecionar Planilhas</button>
                <button onclick="processarArquivos()" class="btn-verde" style="padding: 10px 20px; border: none; border-radius: 8px; cursor: pointer;"><i class="fas fa-upload"></i> Importar Arquivos</button>
                <button onclick="substituirTudo()" class="btn-vermelho" style="padding: 10px 20px; border: none; border-radius: 8px; cursor: pointer;"><i class="fas fa-trash-alt"></i> Substituir Tudo</button>
                <button onclick="exportarExcel()" class="btn-verde" style="padding: 10px 20px; border: none; border-radius: 8px; cursor: pointer;"><i class="fas fa-file-excel"></i> Baixar Excel</button>
            </div>
        </div>
        <input type="file" id="fileInput" accept=".xls,.xlsx" multiple style="display: none;" onchange="adicionarArquivos(event)">
        <div id="status-importacao" style="margin-bottom: 15px; color: #1e3a8a; font-weight: 600; background: rgba(255,255,255,0.6); padding: 10px; border-radius: 8px;"></div>

        <div style="margin-bottom: 15px;">
            <button onclick="toggleFiltros()" class="btn-outline" style="display: flex; align-items: center; gap: 8px; padding: 10px 20px;">
                <i class="fas fa-filter" id="icone-filtro"></i> <span id="texto-filtro">Mostrar Filtros</span>
            </button>
        </div>

        <div id="painel-filtros" style="display: none; background: rgba(255,255,255,0.7); backdrop-filter: blur(10px); border-radius: 16px; padding: 20px; margin-bottom: 20px;">
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                <div><label style="font-weight: 600; font-size: 0.9rem; color: #64748b;">Data Inicial</label><input type="date" id="filtro_data_inicio" style="width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px;"></div>
                <div><label style="font-weight: 600; font-size: 0.9rem; color: #64748b;">Data Final</label><input type="date" id="filtro_data_fim" style="width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px;"></div>
            </div>
            <div style="display: flex; flex-wrap: wrap; gap: 10px; margin-top: 20px;">
                <button onclick="abrirModalFiltro('fornecedor')" class="btn-acao btn-cinza" style="flex: 1; min-width: 150px;"><i class="fas fa-truck"></i> Fornecedores</button>
                <button onclick="abrirModalFiltro('fornecedor_principal')" class="btn-acao btn-cinza" style="flex: 1; min-width: 150px;"><i class="fas fa-building"></i> Fornecedor Principal</button>
                <button onclick="abrirModalFiltro('codprod')" class="btn-acao btn-cinza" style="flex: 1; min-width: 150px;"><i class="fas fa-barcode"></i> Código Produto</button>
                <button onclick="abrirModalFiltro('id_nfe_produt')" class="btn-acao btn-cinza" style="flex: 1; min-width: 150px;"><i class="fas fa-barcode"></i> ID NFE Produto</button>
                <button onclick="abrirModalFiltro('descricao')" class="btn-acao btn-cinza" style="flex: 2; min-width: 250px;"><i class="fas fa-box"></i> Descrição</button>
                <button onclick="abrirModalFiltro('motivo')" class="btn-acao btn-cinza" style="flex: 1; min-width: 150px;"><i class="fas fa-comment"></i> Motivo</button>
                <button onclick="abrirModalFiltro('nomerca')" class="btn-acao btn-cinza" style="flex: 1; min-width: 150px;"><i class="fas fa-user"></i> Vendedores</button>
                <button onclick="abrirModalFiltro('nomesup')" class="btn-acao btn-cinza" style="flex: 1; min-width: 150px;"><i class="fas fa-user-tie"></i> Supervisores</button>
                <button onclick="abrirModalFiltro('motorista')" class="btn-acao btn-cinza" style="flex: 1; min-width: 150px;"><i class="fas fa-id-card"></i> Motoristas</button>
                <button onclick="abrirModalFiltro('rota')" class="btn-acao btn-cinza" style="flex: 1; min-width: 150px;"><i class="fas fa-route"></i> Rotas</button>
                <button onclick="abrirModalFiltro('placa')" class="btn-acao btn-cinza" style="flex: 1; min-width: 150px;"><i class="fas fa-car"></i> Placas</button>
            </div>
            <div style="display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px;">
                <button onclick="limparFiltros()" class="btn-acao btn-cinza"><i class="fas fa-eraser"></i> Limpar Filtros</button>
                <button onclick="executarFiltros()" class="btn-acao btn-azul"><i class="fas fa-play"></i> Executar Filtros</button>
            </div>
        </div>

        <div style="background: rgba(255,255,255,0.7); backdrop-filter: blur(10px); border-radius: 16px; padding: 20px;">
            <div style="max-height: 550px; overflow-y: auto; overflow-x: auto; border: 1px solid #e0f2fe; border-radius: 12px;">
                <table style="width: 100%; border-collapse: collapse; text-align: left;">
                    <thead id="thead-tabela" style="position: sticky; top: 0; background: linear-gradient(135deg, #3b82f6, #2563eb); color: white; z-index: 10;"></thead>
                    <tbody id="tabela-devolucoes"></tbody>
                </table>
            </div>
            <div class="paginacao">
                <button onclick="mudarPagina(-1)" class="btn-acao btn-cinza"><i class="fas fa-chevron-left"></i> Anterior</button>
                <span id="info-pagina" style="color: #1e3a8a; font-weight: 600;">Página 1 de 1</span>
                <button onclick="mudarPagina(1)" class="btn-acao btn-cinza">Próxima <i class="fas fa-chevron-right"></i></button>
            </div>
        </div>
    </div>

    <div id="overlay-carregamento" style="display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(255,255,255,0.85); backdrop-filter: blur(8px); z-index: 9999; align-items: center; justify-content: center; flex-direction: column;">
        <div style="width: 120px; height: 120px; position: relative;">
            <svg viewBox="0 0 100 100" style="width: 100%; height: 100%; transform: rotate(-90deg);">
                <circle cx="50" cy="50" r="40" fill="none" stroke="#e0f2fe" stroke-width="8"/>
                <circle id="barra-progresso" cx="50" cy="50" r="40" fill="none" stroke="#3b82f6" stroke-width="8" stroke-dasharray="251.2" stroke-dashoffset="251.2" stroke-linecap="round"/>
            </svg>
            <span id="percentual-carregamento" style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 1.4rem; font-weight: 700; color: #1e3a8a;">0%</span>
        </div>
        <p style="color: #1e3a8a; font-weight: 500; margin-top: 20px;" id="texto-carregamento">Carregando...</p>
    </div>

    <div id="modal-filtro-overlay" class="modal-filtro-overlay">
        <div class="modal-filtro-box">
            <div class="modal-filtro-header">
                <h3 id="modal-filtro-titulo">Filtro</h3>
                <button onclick="fecharModalFiltro()" style="background: transparent; border: none; font-size: 1.5rem; cursor: pointer; color: #64748b;">&times;</button>
            </div>
            <input type="text" id="modal-filtro-busca" placeholder="Digite para buscar..." oninput="filtrarOpcoesModal()">
            <div id="modal-filtro-lista" class="modal-filtro-lista"></div>
            <div class="modal-filtro-botoes">
                <button onclick="selecionarTodosModal()" class="btn-acao btn-cinza">Todos</button>
                <button onclick="limparSelecaoModal()" class="btn-acao btn-cinza">Limpar</button>
                <button onclick="fecharModalFiltro()" class="btn-acao btn-azul">Concluir</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
    <script src="sidebar-empresa.js"></script>
    <script>
        // ================== COLUNAS ==================
        const COLUNAS = [
            { key: 'codfornec', label: 'COD_FORNEC', tipo: 'inteiro' },
            { key: 'fornecedor', label: 'FORNECEDOR', tipo: 'texto' },
            { key: 'fornecedor_principal', label: 'FORNEC_PRINCIPAL', tipo: 'texto' },
            { key: 'numped', label: 'NUMPED', tipo: 'inteiro' },
            { key: 'numnota', label: 'NUMNOTA', tipo: 'inteiro' },
            { key: 'codprod', label: 'COD_PROD', tipo: 'inteiro' },
            { key: 'id_nfe_produt', label: 'ID_NFE_PRODUT', tipo: 'texto' },
            { key: 'chavenfedev', label: 'CHAVE_NFE_DEV', tipo: 'texto' },
            { key: 'dtent', label: 'DT_ENT', tipo: 'data' },
            { key: 'codcli', label: 'COD_CLI', tipo: 'inteiro' },
            { key: 'cpfcnpj', label: 'CPF_CNPJ', tipo: 'texto' },
            { key: 'cliente', label: 'CLIENTE', tipo: 'texto' },
            { key: 'codrca', label: 'COD_RCA', tipo: 'inteiro' },
            { key: 'nomerca', label: 'NOME_RCA', tipo: 'texto' },
            { key: 'codsupervisor', label: 'COD_SUP', tipo: 'inteiro' },
            { key: 'nomesup', label: 'NOME_SUP', tipo: 'texto' },
            { key: 'numnotaven', label: 'NUMNOTAVEN', tipo: 'inteiro' },
            { key: 'chavenfevend', label: 'CHAVE_NFE_VEND', tipo: 'texto' },
            { key: 'numcarregamento', label: 'NUM_CARREG', tipo: 'texto' },
            { key: 'descricao', label: 'DESCRICAO', tipo: 'texto' },
            { key: 'embalagem', label: 'EMBALAGEM', tipo: 'texto' },
            { key: 'qt', label: 'QT', tipo: 'inteiro' },
            { key: 'punit', label: 'P_UNIT', tipo: 'moeda' },
            { key: 'custoultent', label: 'CUSTO_ULT_ENT', tipo: 'moeda' },
            { key: 'vltotal', label: 'VL_TOTAL', tipo: 'moeda' },
            { key: 'nomefunc', label: 'NOME_FUNC', tipo: 'texto' },
            { key: 'motivo', label: 'MOTIVO', tipo: 'texto' },
            { key: 'numbonus', label: 'NUM_BONUS', tipo: 'texto' },
            { key: 'codfuncfecha', label: 'COD_FUNC_FECHA', tipo: 'inteiro' },
            { key: 'nome', label: 'NOME', tipo: 'texto' },
            { key: 'codmotorista', label: 'COD_MOTORISTA', tipo: 'inteiro' },
            { key: 'motorista', label: 'MOTORISTA', tipo: 'texto' },
            { key: 'codrota', label: 'COD_ROTA', tipo: 'inteiro' },
            { key: 'rota', label: 'ROTA', tipo: 'texto' },
            { key: 'veiculo', label: 'VEICULO', tipo: 'texto' },
            { key: 'placa', label: 'PLACA', tipo: 'texto' }
        ];

        const FILTROS_DROPDOWN = [
            { titulo: 'Fornecedores', coluna: 'fornecedor' },
            { titulo: 'Fornecedor Principal', coluna: 'fornecedor_principal' },
            { titulo: 'Código Produto', coluna: 'codprod' },
            { titulo: 'ID NFE Produto', coluna: 'id_nfe_produt' },
            { titulo: 'Descrição', coluna: 'descricao' },
            { titulo: 'Motivo', coluna: 'motivo' },
            { titulo: 'Vendedores', coluna: 'nomerca' },
            { titulo: 'Supervisores', coluna: 'nomesup' },
            { titulo: 'Motoristas', coluna: 'motorista' },
            { titulo: 'Rotas', coluna: 'rota' },
            { titulo: 'Placas', coluna: 'placa' }
        ];

        let cacheValores = {};
        let listaArquivos = [];
        let todosDados = [];
        let todosFiltrados = [];
        let paginaAtual = 1;
        let totalRegistros = 0;
        const POR_PAGINA = 200;
        let filtrosSelecionados = {};
        let filtroAtual = null;
        let sortState = { col: null, asc: true };

        // ================== FUNÇÕES DE CARREGAMENTO ==================
        function mostrarCarregamento(texto = 'Carregando...') {
            document.getElementById('texto-carregamento').textContent = texto;
            document.getElementById('overlay-carregamento').style.display = 'flex';
            atualizarProgresso(0);
        }
        function atualizarProgresso(percent) {
            const barra = document.getElementById('barra-progresso');
            const texto = document.getElementById('percentual-carregamento');
            const circumference = 251.2;
            const offset = circumference - (percent / 100) * circumference;
            barra.style.strokeDashoffset = offset;
            texto.textContent = percent + '%';
        }
        function ocultarCarregamento() {
            document.getElementById('overlay-carregamento').style.display = 'none';
        }

        function toggleFiltros() {
            const painel = document.getElementById('painel-filtros');
            const texto = document.getElementById('texto-filtro');
            const icone = document.getElementById('icone-filtro');
            if (painel.style.display === 'none') {
                painel.style.display = 'block';
                texto.textContent = 'Ocultar Filtros';
                icone.classList.remove('fa-filter');
                icone.classList.add('fa-eye-slash');
            } else {
                painel.style.display = 'none';
                texto.textContent = 'Mostrar Filtros';
                icone.classList.remove('fa-eye-slash');
                icone.classList.add('fa-filter');
            }
        }

        // ================== MODAL DE FILTRO ==================
        async function abrirModalFiltro(coluna) {
            const filtro = FILTROS_DROPDOWN.find(f => f.coluna === coluna);
            if (!filtro) return;
            filtroAtual = coluna;
            document.getElementById('modal-filtro-titulo').textContent = 'Filtrar: ' + filtro.titulo;
            document.getElementById('modal-filtro-busca').value = '';

            if (cacheValores[coluna]) {
                preencherLista(cacheValores[coluna]);
                document.getElementById('modal-filtro-overlay').style.display = 'flex';
                return;
            }

            mostrarCarregamento('Carregando opções...');
            const db = window.supabaseClient;
            if (!db) { ocultarCarregamento(); return; }
            const empresaId = localStorage.getItem('empresaId');

            try {
                const { data, error } = await db.rpc('get_distinct_values', { col_name: coluna });
                if (error) throw error;
                const valores = (data || []).sort((a, b) => a.localeCompare(b));
                cacheValores[coluna] = valores;
                ocultarCarregamento();
                preencherLista(valores);
                document.getElementById('modal-filtro-overlay').style.display = 'flex';
            } catch (e) {
                console.warn('RPC falhou, usando fallback');
                let all = [];
                let from = 0;
                const pageSize = 1000;
                while (true) {
                    const { data, error } = await db.from('devolucoes').select(coluna).not(coluna, 'is', null).range(from, from + pageSize - 1);
                    if (error) break;
                    all = all.concat(data.map(item => item[coluna]));
                    if (data.length < pageSize) break;
                    from += pageSize;
                }
                const valores = [...new Set(all.filter(v => v && v !== ''))].sort((a, b) => a.localeCompare(b));
                cacheValores[coluna] = valores;
                ocultarCarregamento();
                preencherLista(valores);
                document.getElementById('modal-filtro-overlay').style.display = 'flex';
            }
        }

        function preencherLista(valores) {
            const lista = document.getElementById('modal-filtro-lista');
            lista.innerHTML = '';
            const selecionados = filtrosSelecionados[filtroAtual] || [];
            valores.forEach(val => {
                const label = document.createElement('label');
                const cb = document.createElement('input');
                cb.type = 'checkbox';
                cb.value = val;
                cb.checked = selecionados.includes(val);
                cb.onchange = () => atualizarSelecaoModal();
                label.appendChild(cb);
                label.appendChild(document.createTextNode(' ' + val));
                lista.appendChild(label);
            });
        }

        function fecharModalFiltro() {
            document.getElementById('modal-filtro-overlay').style.display = 'none';
            filtroAtual = null;
        }

        function filtrarOpcoesModal() {
            const termo = document.getElementById('modal-filtro-busca').value.toLowerCase();
            const lista = document.getElementById('modal-filtro-lista');
            const labels = lista.querySelectorAll('label');
            labels.forEach(label => {
                const texto = label.textContent.toLowerCase();
                label.style.display = texto.includes(termo) ? 'flex' : 'none';
            });
        }

        function atualizarSelecaoModal() {
            const lista = document.getElementById('modal-filtro-lista');
            const checkboxes = lista.querySelectorAll('input[type="checkbox"]:checked');
            const valores = Array.from(checkboxes).map(cb => cb.value);
            if (filtroAtual) filtrosSelecionados[filtroAtual] = valores;
        }

        function selecionarTodosModal() {
            const lista = document.getElementById('modal-filtro-lista');
            const checkboxes = lista.querySelectorAll('input[type="checkbox"]');
            checkboxes.forEach(cb => cb.checked = true);
            atualizarSelecaoModal();
        }

        function limparSelecaoModal() {
            const lista = document.getElementById('modal-filtro-lista');
            const checkboxes = lista.querySelectorAll('input[type="checkbox"]');
            checkboxes.forEach(cb => cb.checked = false);
            atualizarSelecaoModal();
        }

        // ================== EXECUTAR FILTROS ==================
        async function executarFiltros() {
            mostrarCarregamento('Aplicando filtros...');
            await new Promise(r => setTimeout(r, 50));
            const dataInicio = document.getElementById('filtro_data_inicio').value;
            const dataFim = document.getElementById('filtro_data_fim').value;

            const db = window.supabaseClient;
            let query = db.from('devolucoes').select('*').eq('empresa_id', localStorage.getItem('empresaId'));
            if (dataInicio) query = query.gte('dtent', dataInicio);
            if (dataFim) query = query.lte('dtent', dataFim);
            for (const filtro of FILTROS_DROPDOWN) {
                const coluna = filtro.coluna;
                const selecionados = filtrosSelecionados[coluna] || [];
                if (selecionados.length > 0) query = query.in(coluna, selecionados);
            }

            const { count, error: countError } = await query.select('*', { count: 'exact', head: true });
            if (countError) { console.error(countError); ocultarCarregamento(); return; }
            totalRegistros = count;
            paginaAtual = 1;

            const { data, error } = await query.range(0, POR_PAGINA - 1);
            ocultarCarregamento();
            if (error) { console.error(error); return; }

            todosFiltrados = data || [];
            todosDados = data || [];
            sortState = { col: null, asc: true };
            renderizarTabela(todosDados);
            atualizarInfoPagina();
        }

        function limparFiltros() {
            document.getElementById('filtro_data_inicio').value = '';
            document.getElementById('filtro_data_fim').value = '';
            filtrosSelecionados = {};
            fecharModalFiltro();
            carregarDevolucoes();
        }

        // ================== PAGINAÇÃO ==================
        function mudarPagina(delta) {
            const novaPagina = paginaAtual + delta;
            if (novaPagina < 1) return;
            carregarPagina(novaPagina);
        }

        async function carregarPagina(numero) {
            paginaAtual = numero;
            mostrarCarregamento('Carregando página...');
            const db = window.supabaseClient;
            const from = (paginaAtual - 1) * POR_PAGINA;
            const to = from + POR_PAGINA - 1;

            const dataInicio = document.getElementById('filtro_data_inicio').value;
            const dataFim = document.getElementById('filtro_data_fim').value;

            let query = db.from('devolucoes').select('*').eq('empresa_id', localStorage.getItem('empresaId'));
            if (dataInicio) query = query.gte('dtent', dataInicio);
            if (dataFim) query = query.lte('dtent', dataFim);
            for (const filtro of FILTROS_DROPDOWN) {
                const coluna = filtro.coluna;
                const selecionados = filtrosSelecionados[coluna] || [];
                if (selecionados.length > 0) query = query.in(coluna, selecionados);
            }

            const { data, error } = await query.range(from, to);
            ocultarCarregamento();
            if (error) { console.error(error); return; }

            todosDados = data || [];
            renderizarTabela(todosDados);
            atualizarInfoPagina();
        }

        function atualizarInfoPagina() {
            const totalPaginas = Math.ceil(totalRegistros / POR_PAGINA);
            document.getElementById('info-pagina').textContent = `Página ${paginaAtual} de ${totalPaginas || 1} (${totalRegistros} registros)`;
        }

        // ================== FORMATAÇÃO ==================
        function formatarMoeda(valor) {
            if (valor === null || valor === undefined || valor === '') return '';
            if (typeof valor === 'number') {
                return 'R$ ' + valor.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
            }
            let str = String(valor).trim().replace(/R\$/g, '').replace(/\s/g, '');
            if (str.includes(',')) {
                str = str.replace(/\./g, '');
                str = str.replace(',', '.');
            } else {
                const partes = str.split('.');
                if (partes.length > 2) {
                    str = partes.slice(0, -1).join('') + '.' + partes[partes.length - 1];
                }
            }
            let num = parseFloat(str);
            if (isNaN(num)) return valor;
            return 'R$ ' + num.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }

        function formatarData(valor) {
            if (!valor) return '';
            if (!isNaN(valor) && Number(valor) > 20000 && Number(valor) < 60000) {
                const serial = Number(valor);
                const data = new Date((serial - 25569) * 86400 * 1000);
                const dia = String(data.getDate()).padStart(2, '0');
                const mes = String(data.getMonth() + 1).padStart(2, '0');
                const ano = data.getFullYear();
                return `${dia}/${mes}/${ano}`;
            }
            if (String(valor).includes('-')) {
                const [ano, mes, dia] = String(valor).split('-');
                return `${dia}/${mes}/${ano}`;
            }
            return valor;
        }

        function formatarInteiro(valor) {
            if (valor === null || valor === undefined || valor === '') return '';
            let num = parseInt(String(valor).replace(/[^\d-]/g, ''), 10);
            if (isNaN(num)) return valor;
            return num.toString();
        }

        function formatarValor(valor, tipo) {
            switch (tipo) {
                case 'data': return formatarData(valor);
                case 'inteiro': return formatarInteiro(valor);
                case 'moeda': return formatarMoeda(valor);
                default: return valor || '';
            }
        }

        // ================== ORDENAÇÃO ==================
        function ordenarPor(colKey) {
            if (sortState.col === colKey) {
                sortState.asc = !sortState.asc;
            } else {
                sortState.col = colKey;
                sortState.asc = true;
            }
            const col = COLUNAS.find(c => c.key === colKey);
            const sorted = [...todosDados].sort((a, b) => {
                let valA = a[colKey];
                let valB = b[colKey];
                if (col.tipo === 'moeda') {
                    let numA = parseFloat(String(valA).replace(/[^\d,-]/g, '').replace(',', '.'));
                    let numB = parseFloat(String(valB).replace(/[^\d,-]/g, '').replace(',', '.'));
                    if (!isNaN(numA) && !isNaN(numB)) return sortState.asc ? numA - numB : numB - numA;
                } else if (col.tipo === 'inteiro') {
                    let numA = parseInt(String(valA).replace(/[^\d-]/g, ''), 10);
                    let numB = parseInt(String(valB).replace(/[^\d-]/g, ''), 10);
                    if (!isNaN(numA) && !isNaN(numB)) return sortState.asc ? numA - numB : numB - numA;
                } else if (col.tipo === 'data') {
                    let dataA = formatarData(valA);
                    let dataB = formatarData(valB);
                    let dateA = new Date(dataA.split('/').reverse().join('-'));
                    let dateB = new Date(dataB.split('/').reverse().join('-'));
                    if (!isNaN(dateA) && !isNaN(dateB)) return sortState.asc ? dateA - dateB : dateB - dateA;
                }
                let strA = String(valA || '').toLowerCase();
                let strB = String(valB || '').toLowerCase();
                if (strA < strB) return sortState.asc ? -1 : 1;
                if (strA > strB) return sortState.asc ? 1 : -1;
                return 0;
            });
            todosDados = sorted;
            renderizarTabela(todosDados);
        }

        // ================== RENDERIZAR TABELA ==================
        function renderizarTabela(dados) {
            const thead = document.getElementById('thead-tabela');
            const tbody = document.getElementById('tabela-devolucoes');
            thead.innerHTML = '<tr>' + COLUNAS.map(col => {
                const sortIcon = sortState.col === col.key ? (sortState.asc ? '<i class="fas fa-sort-up sort-icon"></i>' : '<i class="fas fa-sort-down sort-icon"></i>') : '<i class="fas fa-sort sort-icon"></i>';
                return `<th class="sortable" onclick="ordenarPor('${col.key}')" style="padding: 12px; font-weight: 600; white-space: nowrap;">${col.label}${sortIcon}</th>`;
            }).join('') + '</tr>';
            tbody.innerHTML = '';
            if (dados.length === 0) {
                tbody.innerHTML = `<tr><td colspan="${COLUNAS.length}" style="text-align: center; padding: 20px; color: #64748b;">Nenhum registro encontrado</td></tr>`;
                return;
            }
            dados.forEach(item => {
                const tr = document.createElement('tr');
                tr.style.borderBottom = '1px solid rgba(59,130,246,0.1)';
                tr.innerHTML = COLUNAS.map(col => {
                    let valor = formatarValor(item[col.key], col.tipo);
                    return `<td style="padding: 8px; white-space: nowrap;">${valor}</td>`;
                }).join('');
                tbody.appendChild(tr);
            });
        }

        // ================== EXPORTAR EXCEL ==================
        function exportarExcel() {
            if (todosDados.length === 0) { alert('Nenhum dado para exportar.'); return; }
            const ws_data = [COLUNAS.map(col => col.label)];
            todosDados.forEach(item => {
                ws_data.push(COLUNAS.map(col => formatarValor(item[col.key], col.tipo)));
            });
            const ws = XLSX.utils.aoa_to_sheet(ws_data);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, 'Devoluções');
            XLSX.writeFile(wb, 'devolucoes.xlsx');
        }

        // ================== IMPORTAÇÃO ==================
        function adicionarArquivos(event) {
            const files = Array.from(event.target.files);
            listaArquivos = listaArquivos.concat(files);
            document.getElementById('status-importacao').textContent = `${listaArquivos.length} arquivo(s) selecionado(s). Clique em "Importar Arquivos"`;
            event.target.value = '';
        }

        function detectarCabecalho(matriz) {
            for (let i = 0; i < matriz.length; i++) {
                if (matriz[i] && matriz[i][0] === 'CODFORNEC') return i;
            }
            return 0;
        }

        function mapearLinha(linha, empresaId) {
            const fornecedor = linha[1] ? String(linha[1]).trim() : '';
            const numnota = linha[3] ? String(linha[3]).trim() : '';
            const codprod = linha[16] ? String(linha[16]).trim() : '';
            const id_nfe_produt = (numnota && codprod) ? `${numnota}|${codprod}` : '';
            let fornecedorPrincipal = '';
            if (fornecedor) {
                const palavras = fornecedor.split(' ').filter(p => p !== '');
                fornecedorPrincipal = palavras.slice(0, 2).join(' ');
            }
            return {
                empresa_id: empresaId,
                codfornec: linha[0] || '',
                fornecedor: fornecedor,
                fornecedor_principal: fornecedorPrincipal,
                numped: linha[2] || '',
                numnota: numnota,
                codprod: codprod,
                id_nfe_produt: id_nfe_produt,
                chavenfedev: linha[4] || '',
                dtent: linha[5] || '',
                codcli: linha[6] || '',
                cpfcnpj: linha[7] || '',
                cliente: linha[8] || '',
                codrca: linha[9] || '',
                nomerca: linha[10] || '',
                codsupervisor: linha[11] || '',
                nomesup: linha[12] || '',
                numnotaven: linha[13] || '',
                chavenfevend: linha[14] || '',
                numcarregamento: linha[15] || '',
                descricao: linha[17] || '',
                embalagem: linha[18] || '',
                qt: linha[19] || '',
                punit: linha[20] || '',
                custoultent: linha[21] || '',
                vltotal: linha[22] || '',
                nomefunc: linha[23] || '',
                motivo: linha[24] || '',
                numbonus: linha[25] || '',
                codfuncfecha: linha[26] || '',
                nome: linha[27] || '',
                codmotorista: linha[28] || '',
                motorista: linha[29] || '',
                codrota: linha[30] || '',
                rota: linha[31] || '',
                veiculo: linha[32] || '',
                placa: linha[33] || ''
            };
        }

        async function lerArquivos() {
            if (listaArquivos.length === 0) { alert('Nenhum arquivo selecionado.'); return []; }
            const empresaId = localStorage.getItem('empresaId');
            let todasLinhas = [];
            for (let i = 0; i < listaArquivos.length; i++) {
                const file = listaArquivos[i];
                document.getElementById('status-importacao').textContent = `Processando arquivo ${i+1}/${listaArquivos.length}: ${file.name}`;
                try {
                    const data = await file.arrayBuffer();
                    const workbook = XLSX.read(data, { type: 'array' });
                    const sheet = workbook.Sheets[workbook.SheetNames[0]];
                    const matriz = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: '' });
                    const linhaCabecalho = detectarCabecalho(matriz);
                    for (let j = linhaCabecalho + 1; j < matriz.length; j++) {
                        const linha = matriz[j];
                        if (linha && linha[0] !== '' && linha[0] !== undefined && linha[0] !== null) {
                            todasLinhas.push(mapearLinha(linha, empresaId));
                        }
                    }
                } catch (e) {
                    alert('Erro ao ler arquivo ' + file.name + ': ' + e.message);
                    return [];
                }
            }
            return todasLinhas;
        }

        // ================== FUNÇÃO DE HISTÓRICO ==================
        async function registrarHistorico(nomeArquivo, linhas, tamanho) {
            const db = window.supabaseClient;
            if (!db) return;
            const empresaId = localStorage.getItem('empresaId');
            const dataCriacao = new Date().toISOString().split('T')[0];
            const { error } = await db.from('historico_importacoes').insert({
                empresa_id: empresaId,
                nome_arquivo: nomeArquivo,
                data_criacao: dataCriacao,
                quantidade_linhas: linhas,
                tamanho_arquivo: tamanho
            });
            if (error) console.error('Erro ao salvar histórico:', error);
        }

        // ================== PROCESSAR IMPORTAÇÃO ==================
        async function processarArquivos() {
            const db = window.supabaseClient;
            if (!db) { alert('Banco não conectado.'); return; }
            const linhas = await lerArquivos();
            if (linhas.length === 0) { document.getElementById('status-importacao').textContent = 'Nenhuma linha válida.'; return; }
            document.getElementById('status-importacao').textContent = `Importando ${linhas.length} registros...`;
            mostrarCarregamento('Importando dados...');
            const CHUNK_SIZE = 500;
            for (let i = 0; i < linhas.length; i += CHUNK_SIZE) {
                const chunk = linhas.slice(i, i + CHUNK_SIZE);
                atualizarProgresso(Math.round(((i + chunk.length) / linhas.length) * 100));
                const { error } = await db.from('devolucoes').insert(chunk);
                if (error) { ocultarCarregamento(); alert('Erro ao inserir: ' + error.message); return; }
            }
            ocultarCarregamento();

            // Registrar histórico de cada arquivo
            for (const file of listaArquivos) {
                const tamanho = (file.size / 1024).toFixed(2) + ' KB';
                await registrarHistorico(file.name, linhas.length, tamanho);
            }

            document.getElementById('status-importacao').textContent = `✅ ${linhas.length} registros importados! Limpando duplicados...`;
            await limparDuplicadosSQL();
            listaArquivos = [];
            await carregarDevolucoes();
        }

        // ================== DEDUPLICAÇÃO VIA SQL ==================
        async function limparDuplicadosSQL() {
            const db = window.supabaseClient;
            if (!db) return;
            const empresaId = localStorage.getItem('empresaId');
            mostrarCarregamento('Verificando e removendo duplicados...');
            try {
                const { data, error } = await db.rpc('limpar_duplicados', { p_empresa_id: empresaId });
                if (error) throw error;
                if (data && data.length > 0) {
                    const totalEncontrados = data[0].total_encontrados;
                    const totalRemovidos = data[0].total_removidos;
                    if (totalEncontrados === 0) {
                        document.getElementById('status-importacao').textContent = '✅ Nenhum duplicado encontrado. Banco de dados revisado e íntegro!';
                    } else {
                        document.getElementById('status-importacao').textContent = `✅ ${totalRemovidos} duplicados identificados e removidos. Banco de dados revisado e íntegro!`;
                    }
                } else {
                    document.getElementById('status-importacao').textContent = '✅ Nenhum duplicado encontrado. Banco de dados revisado e íntegro!';
                }
            } catch (e) {
                console.error('Erro ao chamar limpar_duplicados:', e);
                alert('Erro ao limpar duplicados: ' + e.message);
            } finally {
                ocultarCarregamento();
            }
        }

        // ================== SUBSTITUIR TUDO ==================
        async function substituirTudo() {
            const db = window.supabaseClient;
            if (!db) { alert('Banco não conectado.'); return; }
            const empresaId = localStorage.getItem('empresaId');
            if (!confirm('⚠️ Isso vai apagar TODOS os dados e importar os arquivos selecionados. Deseja continuar?')) return;
            document.getElementById('status-importacao').textContent = 'Apagando dados antigos...';
            mostrarCarregamento('Apagando dados antigos...');
            const { error } = await db.from('devolucoes').delete().eq('empresa_id', empresaId);
            ocultarCarregamento();
            if (error) { alert('Erro ao apagar: ' + error.message); return; }
            if (listaArquivos.length > 0) {
                await processarArquivos();
            } else {
                document.getElementById('status-importacao').textContent = 'Nenhum arquivo. Dados apagados.';
                await carregarDevolucoes();
            }
        }

        // ================== CARREGAR DADOS ==================
        async function carregarDevolucoes() {
            const db = window.supabaseClient;
            if (!db) return;
            const empresaId = localStorage.getItem('empresaId');
            mostrarCarregamento('Carregando dados...');
            const { count, error: countError } = await db.from('devolucoes').select('*', { count: 'exact', head: true }).eq('empresa_id', empresaId);
            if (countError) { console.error(countError); ocultarCarregamento(); return; }
            totalRegistros = count || 0;
            const { data, error } = await db.from('devolucoes').select('*').eq('empresa_id', empresaId).range(0, POR_PAGINA - 1);
            ocultarCarregamento();
            if (error) { console.error(error); return; }
            todosDados = data || [];
            todosFiltrados = [...todosDados];
            paginaAtual = 1;
            sortState = { col: null, asc: true };
            renderizarTabela(todosDados);
            atualizarInfoPagina();
        }

        document.addEventListener('DOMContentLoaded', async () => {
            const wait = setInterval(() => {
                if (window.supabaseClient) {
                    clearInterval(wait);
                    carregarDevolucoes();
                }
            }, 200);
        });
    </script>
